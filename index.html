<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>最終 281〜286</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:24px 5vw;background:#fff;border-bottom:1px solid #ddd}main{max-width:1200px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{min-height:165px;padding:17px;text-align:left;background:#fff;border:1px solid #ddd;border-radius:16px;cursor:pointer}.card b,.card span,.card small{display:block}.card b{margin-top:6px}.card span{margin-top:9px;color:#667085}.modal{display:none;position:fixed;inset:0;background:#0009;padding:10px}.modal.open{display:flex}.sheet{width:min(1050px,100%);height:96vh;margin:auto;background:#fff;border-radius:18px;display:flex;flex-direction:column;overflow:hidden}.head{padding:16px 20px;display:flex;justify-content:space-between;border-bottom:1px solid #ddd}.title{font-size:24px;font-weight:800}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px}.tab{padding:10px;border:1px solid #bbb;border-radius:10px;background:#fff;font-weight:700}.tab.active{background:#202124;color:#fff}.panel{padding:24px;overflow:auto;white-space:pre-wrap;line-height:1.95}.close{border:0;font-size:22px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.panel{padding:16px}.tab{font-size:12px}}</style></head><body><header><h1>四角形単語帳｜最終 281〜286</h1><p>日本語語彙6項目・個別作り込み版</p></header><main><div class="grid"><button class="card" data-id="x0"><small>281｜日本語語彙</small><b>随意</b><span>決まった強制に従うのではなく、本人の意思・自由な選択に任せること</span></button><button class="card" data-id="x1"><small>282｜日本語語彙</small><b>隔世の感</b><span>以前と比べて世の中が大きく変わり、まるで別の時代になったように感じること</span></button><button class="card" data-id="x2"><small>283｜日本語語彙</small><b>風合い</b><span>素材の手触り・見た目・質感などが合わさって生まれる独特の感じ</span></button><button class="card" data-id="x3"><small>284｜日本語語彙</small><b>風情</b><span>その場・物に漂う趣や味わい、しみじみ感じられる情緒</span></button><button class="card" data-id="x4"><small>285｜日本語語彙</small><b>ミネルバの梟が黄昏に飛び立つ</b><span>ある時代や現実の本質は、その展開が十分に進んだ後になって初めて哲学的に理解できる、という趣旨の比喩</span></button><button class="card" data-id="x5"><small>286｜日本語語彙</small><b>しょっつる</b><span>秋田県の伝統的な魚醤。魚を塩とともに発酵・熟成させて作る液体調味料</span></button></div></main><div id="m" class="modal"><div class="sheet"><div class="head"><div id="title" class="title"></div><button id="close" class="close">×</button></div><div class="tabs"><button class="tab active" data-k="A">A 要点</button><button class="tab" data-k="B">B 詳細</button><button class="tab" data-k="C">C イメージ</button><button class="tab" data-k="D">D 具体例</button></div><div id="p" class="panel"></div></div></div><script type="application/json" id="x0">{"A": "A【要点｜まず全体を掴みましょう】\n\n「先輩、最後の6個でもやることは同じです。最初に芯を一本作ります。」\n\n■ 読み・品詞\n**随意**\n読み：**ずいい**\n品詞：**名詞・形容動詞的**\n\n■ 一言でいうと\n**決まった強制に従うのではなく、本人の意思・自由な選択に任せること**\n\n■ 核イメージ\n**『こうしなければならない』ではなく、選ぶかどうかを本人に委ねる**\n\n「まずここです。細かい説明より、この核を頭に残してください。」\n\n■ 3つのポイント\n① 基本意味：**決まった強制に従うのではなく、本人の意思・自由な選択に任せること**\n② 核：**『こうしなければならない』ではなく、選ぶかどうかを本人に委ねる**\n③ 似た表現は『焦点の違い』まで分けて覚える。\n\n【一文で先に固定】\n**随意 ＝ 『こうしなければならない』ではなく、選ぶかどうかを本人に委ねる**\n\n「はい。これで土台はできました。」", "B": "B【詳しい解説｜似た言葉とどう違うの？】\n\n「じゃあ、ここから境界線を引きますよ。」\n\n■ 随意 の中心\n**『こうしなければならない』ではなく、選ぶかどうかを本人に委ねる**\n\n【近い表現1：任意】\n「**任意** も近いですね。でも、同じものとして覚えるのはなしです。」\n\nイメージ：**本人の自由な意思に任せる**\nニュアンス：制度・手続きでも広く使う一般的な語\n例：**この欄の記入は任意です。**\n→ Filling in this field is optional.\n\n【近い表現2：自由】\n「**自由** も近いですね。でも、同じものとして覚えるのはなしです。」\n\nイメージ：**拘束されず自分で選べる**\nニュアンス：意味範囲が非常に広い\n例：**服装は自由です。**\n→ You may dress as you like.\n\n【近い表現3：適宜】\n「**適宜** も近いですね。でも、同じものとして覚えるのはなしです。」\n\nイメージ：**状況に応じて適切に**\nニュアンス：自由選択より『必要に応じて』が中心\n例：**適宜休憩を取ってください。**\n→ Take breaks as appropriate.\n\n■ 選択の流れ\n場面・文章を見る\n↓\n何を中心に表したいか考える\n↓\n**『こうしなければならない』ではなく、選ぶかどうかを本人に委ねる**\n↓\n**随意**\n\n「ほら、訳語だけで覚えるよりずっと整理しやすいでしょう？」\n\n■ 間違えやすいところ\n**『随意＝適当でよい』ではありません。中心は自由意思への委任です。日常では『任意』の方がよく使われる場面も多いです。**\n\n「ここを説明できれば、似た言葉が出ても迷いにくくなります。」", "C": "C【イメージ理解｜一回、想像してみてください】\n\n「先輩、今度は文字から離れますよ。」\n\n■ 場面\n研修の最後に懇親会がありますが、参加は必須ではなく『参加は随意です』と案内され、自分の都合で出欠を決める場面です。\n\n「この場面を一枚の絵にしたら、何が中心に残ります？」\n\n……\n\n「そうです。**『こうしなければならない』ではなく、選ぶかどうかを本人に委ねる**。」\n\n場面\n↓\n特徴を抜き出す\n↓\n**『こうしなければならない』ではなく、選ぶかどうかを本人に委ねる**\n↓\n**随意**\n\n「次にこの言葉を見たとき、今の映像から意味が戻ればOKです。」\n\n「つまり、難しい語でも『映像→核→言葉』の順なら記憶に引っかかりやすいんです。」", "D": "D【具体例｜実際の使い方で確認しましょう】\n\n「じゃあ先輩、最後に文で仕上げます。」\n\n例1：**服装は随意とする。**\n→ 服装は各自の自由な選択に任せる。\n\n「どうしてここで **随意** なのか、説明できます？」\n……\n「はい。**一定の服装を強制せず本人へ選択を委ねるから**からです。」\n\n例2：**参加は随意です。**\n→ 参加するかどうかは本人の意思に任されています。\n\n「どうしてここで **随意** なのか、説明できます？」\n……\n「はい。**義務ではないことを硬く表すから**からです。」\n\n■ 最終比較\n**随意** → 『こうしなければならない』ではなく、選ぶかどうかを本人に委ねる\n**任意** → 本人の自由な意思に任せる\n\n■ 理解確認\n「先輩、本当に分かりました？」\n\n「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」\n\nQ1. **随意** を一言で説明すると？\n→ **決まった強制に従うのではなく、本人の意思・自由な選択に任せること**\n\nQ2. 核イメージは？\n→ **『こうしなければならない』ではなく、選ぶかどうかを本人に委ねる**\n\nQ3. **任意** とは何が違う？\n→ **制度・手続きでも広く使う一般的な語**\n\n「はい、それで合ってます。」\n\n■ 30秒復習\n「はい、あと30秒です。これで本当に最後ですから。」\n\n① 何の話？ → **随意**\n② 一番重要なのは？ → **『こうしなければならない』ではなく、選ぶかどうかを本人に委ねる**\n③ なぜ？ → その焦点がこの言葉らしさを作るから\n④ どういう流れ？ → **場面 → 核 → 随意**\n⑤ 具体例は？ → 上の2例\n⑥ 間違えやすいところは？ → **『随意＝適当でよい』ではありません。中心は自由意思への委任です。日常では『任意』の方がよく使われる場面も多いです。**\n\n【一文で覚える】\n**「随意 ＝ 『こうしなければならない』ではなく、選ぶかどうかを本人に委ねる」**\n\n「全部丸暗記しなくてもいいです。」\n\n「でも、この一文から今日の場面と近い表現の違いまで戻せるようにはしておいてください。」\n\n「……はい。これで286項目の最後まで来ました。」"}</script><script type="application/json" id="x1">{"A": "A【要点｜まず全体を掴みましょう】\n\n「先輩、最後の6個でもやることは同じです。最初に芯を一本作ります。」\n\n■ 読み・品詞\n**隔世の感**\n読み：**かくせいのかん**\n品詞：**慣用句・名詞句**\n\n■ 一言でいうと\n**以前と比べて世の中が大きく変わり、まるで別の時代になったように感じること**\n\n■ 核イメージ\n**昔と今の間に一世代分ほどの大きな断絶を感じる**\n\n「まずここです。細かい説明より、この核を頭に残してください。」\n\n■ 3つのポイント\n① 基本意味：**以前と比べて世の中が大きく変わり、まるで別の時代になったように感じること**\n② 核：**昔と今の間に一世代分ほどの大きな断絶を感じる**\n③ 似た表現は『焦点の違い』まで分けて覚える。\n\n【一文で先に固定】\n**隔世の感 ＝ 昔と今の間に一世代分ほどの大きな断絶を感じる**\n\n「はい。これで土台はできました。」", "B": "B【詳しい解説｜似た言葉とどう違うの？】\n\n「じゃあ、ここから境界線を引きますよ。」\n\n■ 隔世の感 の中心\n**昔と今の間に一世代分ほどの大きな断絶を感じる**\n\n【近い表現1：時代の変化】\n「**時代の変化** も近いですね。でも、同じものとして覚えるのはなしです。」\n\nイメージ：**時代が変わること**\nニュアンス：最も中立的な説明\n例：**時代の変化を感じる。**\n→ I feel how times have changed.\n\n【近い表現2：今昔の感】\n「**今昔の感** も近いですね。でも、同じものとして覚えるのはなしです。」\n\nイメージ：**昔と今を比べた感慨**\nニュアンス：変化へのしみじみした感情に焦点\n例：**街並みに今昔の感を覚える。**\n→ The streetscape makes me reflect on past and present.\n\n【近い表現3：様変わり】\n「**様変わり** も近いですね。でも、同じものとして覚えるのはなしです。」\n\nイメージ：**姿・状態が大きく変わること**\nニュアンス：対象そのものの変化に焦点\n例：**駅前はすっかり様変わりした。**\n→ The area around the station has completely changed.\n\n■ 選択の流れ\n場面・文章を見る\n↓\n何を中心に表したいか考える\n↓\n**昔と今の間に一世代分ほどの大きな断絶を感じる**\n↓\n**隔世の感**\n\n「ほら、訳語だけで覚えるよりずっと整理しやすいでしょう？」\n\n■ 間違えやすいところ\n**単に『懐かしい』という意味ではありません。昔と今の大きな変化・隔たりへの驚きや感慨が必要です。**\n\n「ここを説明できれば、似た言葉が出ても迷いにくくなります。」", "C": "C【イメージ理解｜一回、想像してみてください】\n\n「先輩、今度は文字から離れますよ。」\n\n■ 場面\n昔は切符を買い、紙の地図を広げて移動していた人が、今はスマホ一台で乗車・地図・決済まで済む様子を見て驚く場面です。\n\n「この場面を一枚の絵にしたら、何が中心に残ります？」\n\n……\n\n「そうです。**昔と今の間に一世代分ほどの大きな断絶を感じる**。」\n\n場面\n↓\n特徴を抜き出す\n↓\n**昔と今の間に一世代分ほどの大きな断絶を感じる**\n↓\n**隔世の感**\n\n「次にこの言葉を見たとき、今の映像から意味が戻ればOKです。」\n\n「つまり、難しい語でも『映像→核→言葉』の順なら記憶に引っかかりやすいんです。」", "D": "D【具体例｜実際の使い方で確認しましょう】\n\n「じゃあ先輩、最後に文で仕上げます。」\n\n例1：**AIの進歩を見ると隔世の感がある。**\n→ AIの進歩を見ると、以前とは別時代のような大きな変化を感じる。\n\n「どうしてここで **隔世の感** なのか、説明できます？」\n……\n「はい。**過去との落差が非常に大きいから**からです。」\n\n例2：**久しぶりに故郷を訪れ、隔世の感を覚えた。**\n→ 久々の故郷が大きく変わり、別の時代のように感じた。\n\n「どうしてここで **隔世の感** なのか、説明できます？」\n……\n「はい。**昔の記憶と現在の姿に大きな隔たりがあるから**からです。」\n\n■ 最終比較\n**隔世の感** → 昔と今の間に一世代分ほどの大きな断絶を感じる\n**時代の変化** → 時代が変わること\n\n■ 理解確認\n「先輩、本当に分かりました？」\n\n「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」\n\nQ1. **隔世の感** を一言で説明すると？\n→ **以前と比べて世の中が大きく変わり、まるで別の時代になったように感じること**\n\nQ2. 核イメージは？\n→ **昔と今の間に一世代分ほどの大きな断絶を感じる**\n\nQ3. **時代の変化** とは何が違う？\n→ **最も中立的な説明**\n\n「はい、それで合ってます。」\n\n■ 30秒復習\n「はい、あと30秒です。これで本当に最後ですから。」\n\n① 何の話？ → **隔世の感**\n② 一番重要なのは？ → **昔と今の間に一世代分ほどの大きな断絶を感じる**\n③ なぜ？ → その焦点がこの言葉らしさを作るから\n④ どういう流れ？ → **場面 → 核 → 隔世の感**\n⑤ 具体例は？ → 上の2例\n⑥ 間違えやすいところは？ → **単に『懐かしい』という意味ではありません。昔と今の大きな変化・隔たりへの驚きや感慨が必要です。**\n\n【一文で覚える】\n**「隔世の感 ＝ 昔と今の間に一世代分ほどの大きな断絶を感じる」**\n\n「全部丸暗記しなくてもいいです。」\n\n「でも、この一文から今日の場面と近い表現の違いまで戻せるようにはしておいてください。」\n\n「……はい。これで286項目の最後まで来ました。」"}</script><script type="application/json" id="x2">{"A": "A【要点｜まず全体を掴みましょう】\n\n「先輩、最後の6個でもやることは同じです。最初に芯を一本作ります。」\n\n■ 読み・品詞\n**風合い**\n読み：**ふうあい**\n品詞：**名詞**\n\n■ 一言でいうと\n**素材の手触り・見た目・質感などが合わさって生まれる独特の感じ**\n\n■ 核イメージ\n**色だけでも手触りだけでもなく、素材全体から伝わる『この物らしい感じ』**\n\n「まずここです。細かい説明より、この核を頭に残してください。」\n\n■ 3つのポイント\n① 基本意味：**素材の手触り・見た目・質感などが合わさって生まれる独特の感じ**\n② 核：**色だけでも手触りだけでもなく、素材全体から伝わる『この物らしい感じ』**\n③ 似た表現は『焦点の違い』まで分けて覚える。\n\n【一文で先に固定】\n**風合い ＝ 色だけでも手触りだけでもなく、素材全体から伝わる『この物らしい感じ』**\n\n「はい。これで土台はできました。」", "B": "B【詳しい解説｜似た言葉とどう違うの？】\n\n「じゃあ、ここから境界線を引きますよ。」\n\n■ 風合い の中心\n**色だけでも手触りだけでもなく、素材全体から伝わる『この物らしい感じ』**\n\n【近い表現1：質感】\n「**質感** も近いですね。でも、同じものとして覚えるのはなしです。」\n\nイメージ：**表面・材質から受ける感じ**\nニュアンス：視覚・触覚の性質を比較的客観的に表す\n例：**木の質感を生かす。**\n→ Make use of the texture of the wood.\n\n【近い表現2：手触り】\n「**手触り** も近いですね。でも、同じものとして覚えるのはなしです。」\n\nイメージ：**触ったときの感覚**\nニュアンス：触覚に限定される\n例：**柔らかな手触りだ。**\n→ It has a soft feel.\n\n【近い表現3：風格】\n「**風格** も近いですね。でも、同じものとして覚えるのはなしです。」\n\nイメージ：**品位・重みのある雰囲気**\nニュアンス：人・建物などの威厳にも使う\n例：**歴史ある建物には風格がある。**\n→ The historic building has dignity.\n\n■ 選択の流れ\n場面・文章を見る\n↓\n何を中心に表したいか考える\n↓\n**色だけでも手触りだけでもなく、素材全体から伝わる『この物らしい感じ』**\n↓\n**風合い**\n\n「ほら、訳語だけで覚えるよりずっと整理しやすいでしょう？」\n\n■ 間違えやすいところ\n**『風合い』は単なる触り心地ではありません。見た目、色、手触りなどが合わさった総合的な素材感を指します。**\n\n「ここを説明できれば、似た言葉が出ても迷いにくくなります。」", "C": "C【イメージ理解｜一回、想像してみてください】\n\n「先輩、今度は文字から離れますよ。」\n\n■ 場面\n新品の革と、長年使って少し柔らかく色艶が変わった革を触り比べ、後者に独特の味を感じる場面です。\n\n「この場面を一枚の絵にしたら、何が中心に残ります？」\n\n……\n\n「そうです。**色だけでも手触りだけでもなく、素材全体から伝わる『この物らしい感じ』**。」\n\n場面\n↓\n特徴を抜き出す\n↓\n**色だけでも手触りだけでもなく、素材全体から伝わる『この物らしい感じ』**\n↓\n**風合い**\n\n「次にこの言葉を見たとき、今の映像から意味が戻ればOKです。」\n\n「つまり、難しい語でも『映像→核→言葉』の順なら記憶に引っかかりやすいんです。」", "D": "D【具体例｜実際の使い方で確認しましょう】\n\n「じゃあ先輩、最後に文で仕上げます。」\n\n例1：**洗うほど布の風合いが増す。**\n→ 洗うほど布独特の柔らかな質感や見た目が深まる。\n\n「どうしてここで **風合い** なのか、説明できます？」\n……\n「はい。**素材全体から感じる味わいが変化するから**からです。」\n\n例2：**木の自然な風合いを残した家具だ。**\n→ 木材本来の見た目や質感を生かした家具だ。\n\n「どうしてここで **風合い** なのか、説明できます？」\n……\n「はい。**色・木目・触感をまとめた素材感を表すから* 味を塩と時間で液体へ凝縮した調味料**\n↓\n**しょっつる**\n\n「ほら、訳語だけで覚えるよりずっと整理しやすいでしょう？」\n\n■ 間違えやすいところ\n**『魚醤』はカテゴリー名で、『しょっつる』は秋田の伝統的な魚醤です。ハタハタがよく知られますが、魚醤という性質と特定の魚種を完全に同一視しないようにしてください。**\n\n「ここを説明できれば、似た言葉が出ても迷いにくくなります。」", "C": "C【イメージ理解｜一回、想像してみてください】\n\n「先輩、今度は文字から離れますよ。」\n\n■ 場面\n寒い日に鍋から湯気が上がり、ハタハタや野菜を煮た汁へ、魚のうま味が濃いしょっつるを加えて味を整える場面です。\n\n「この場面を一枚の絵にしたら、何が中心に残ります？」\n\n……\n\n「そうです。**魚のうま味を塩と時間で液体へ凝縮した調味料**。」\n\n場面\n↓\n特徴を抜き出す\n↓\n**魚のうま味を塩と時間で液体へ凝縮した調味料**\n↓\n**しょっつる**\n\n「次にこの言葉を見たとき、今の映像から意味が戻ればOKです。」\n\n「つまり、難しい語でも『映像→核→言葉』の順なら記憶に引っかかりやすいんです。」", "D": "D【具体例｜実際の使い方で確認しましょう】\n\n「じゃあ先輩、最後に文で仕上げます。」\n\n例1：**しょっつるで鍋の味を調える。**\n→ 秋田の魚醤を使って鍋に塩味とうま味を加える。\n\n「どうしてここで **しょっつる** なのか、説明できます？」\n……\n「はい。**しょっつるが魚由来の発酵調味料だから**からです。」\n\n例2：**秋田の郷土料理として、しょっつる鍋が知られている。**\n→ 秋田ではしょっつるを使った鍋料理が知られている。\n\n「どうしてここで **しょっつる** なのか、説明できます？」\n……\n「はい。**地域の魚醤文化と結びついた代表的な料理だから**からです。」\n\n■ 最終比較\n**しょっつる** → 魚のうま味を塩と時間で液体へ凝縮した調味料\n**魚醤** → 魚介を原料にした発酵調味料の総称\n\n■ 理解確認\n「先輩、本当に分かりました？」\n\n「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」\n\nQ1. **しょっつる** を一言で説明すると？\n→ **秋田県の伝統的な魚醤。魚を塩とともに発酵・熟成させて作る液体調味料**\n\nQ2. 核イメージは？\n→ **魚のうま味を塩と時間で液体へ凝縮した調味料**\n\nQ3. **魚醤** とは何が違う？\n→ **しょっつるを含む上位概念**\n\n「はい、それで合ってます。」\n\n■ 30秒復習\n「はい、あと30秒です。これで本当に最後ですから。」\n\n① 何の話？ → **しょっつる**\n② 一番重要なのは？ → **魚のうま味を塩と時間で液体へ凝縮した調味料**\n③ なぜ？ → その焦点がこの言葉らしさを作るから\n④ どういう流れ？ → **場面 → 核 → しょっつる**\n⑤ 具体例は？ → 上の2例\n⑥ 間違えやすいところは？ → **『魚醤』はカテゴリー名で、『しょっつる』は秋田の伝統的な魚醤です。ハタハタがよく知られますが、魚醤という性質と特定の魚種を完全に同一視しないようにしてください。**\n\n【一文で覚える】\n**「しょっつる ＝ 魚のうま味を塩と時間で液体へ凝縮した調味料」**\n\n「全部丸暗記しなくてもいいです。」\n\n「でも、この一文から今日の場面と近い表現の違いまで戻せるようにはしておいてください。」\n\n「……はい。これで286項目の最後まで来ました。」"}</script><script>let S,M=document.getElementById('m'),P=document.getElementById('p');function show(k){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.k===k));P.textContent=S[k]}document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{S=JSON.parse(document.getElementById(c.dataset.id).textContent);document.getElementById('title').textContent=c.querySelector('b').textConte

m** → 問題を発見する\n- **detect an error** → エラーを検出する\n- **detect cancer** → がんを発見する\n- **detect a virus** → ウイルスを検出する\n\n### 📌 **detect と discover の違い**\n\n- **detect**：**隠れているもの・異常を感知して見つける**\n  - *The software detected a virus.*\n  - （ソフトがウイルスを検出した。）\n\n- **discover**：**新しい事実や未知のものを発見する**\n  - *Columbus discovered America.*\n  - （コロンブスはアメリカ大陸を発見した。）\n\nつまり、\n\n- **detect** = **「センサー・機械・観察によって検知する」**\n- **discover** = **「新しいものを初めて発見する」**\n\nという違いを押さえておくと使い分けやすいです。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「detect」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「detect」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「detect」と「detect」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 発見する、検出する、感知する\n\n**A2.** The system detected an error immediately.\n\n**A3.** 「detect」は「発見する、検出する、感知する」、一方「detect」は「「センサー・機械・観察によって検知する」」です。\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### ① 発見する・見つける\n\n- **detect a mistake**\n  → 間違いを見つける\n- **detect a problem**\n  → 問題を発見する\n\n### ② 検出する・感知する\n\n- **detect a virus**\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Detect』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Detect → detect\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. detect a mistake\n2. detect a problem\n3. detect a virus\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. detect の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\ndetect ＝ Detect\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_26">{"A": "【A｜単語・核】\ndevelop\n読み・発音：—\n基本意味：Develop\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：Develop\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：develop ＝ Develop", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【単語】\n\n# **Develop**\n**verb. 発達する、発展させる、開発する、身につける**\n\n👉 核となるイメージ：**「何もない状態から、時間をかけて形・能力・機能を成長させる」**\n\n---\n\n## B【日本語訳・類義語・対義語】\n\n### ① 発達する・成長する\n\n- **Children develop at different rates.**  \n  → 子どもはそれぞれ異なる速さで発達する。\n\n### ② 開発する・作り出す\n\n- **develop a new product**  \n  → 新製品を開発する\n- **develop new software**  \n  → 新しいソフトウェアを開発する\n\n### ③ 能力・習慣を身につける\n\n- **develop a skill**  \n  → スキルを身につける\n- **develop good habits**  \n  → 良い習慣を身につける\n\n### 類義語\n\n- **grow**：成長する\n- **expand**：拡大する\n- **improve**：改善する\n- **create**：作り出す\n- **cultivate**：能力・関係などを育てる\n\n### 対義語\n\n- **decline**：衰退する\n- **deteriorate**：悪化する\n- **destroy**：破壊する\n- **neglect**：放置する\n\n💡 **develop** は、単に「作る」のではなく、**時間をかけて成長・発展させる**イメージが強い。\n\n---\n\n## C【イメージ記憶】\n\n🌱 **小さな種が、時間をかけて成長する**\n\n```text\n   🌱\n    ↓\n   🌿\n    ↓\n   🌳\n    ↓\n  🌳🍎\n```\n\n最初は何もなかったものが、\n\n> 時間をかけて、少しずつ形や能力を持つようになる\n\n👉 **develop = 中にある可能性を成長させて、形にする**\n\nだから、\n\n- **develop a skill**  \n  → 能力を成長させる\n- **develop a product**  \n  → 製品として形にする\n- **develop a disease**  \n  → 病気が発症する\n\nとなる。\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **She developed a strong interest in artificial intelligence.**\n\n**彼女は人工知能に強い興味を持つようになった。**\n\n最初は興味が小さくても、時間とともに大きくなる。\n\n> **small interest → develop → strong interest**\n\n---\n\n### 🔑 核を一言で覚えるなら\n\n> **develop = 時間をかけて、成長・発展させる**\n\n📌 **develop a skill**  \n→ スキルを身につける\n\n📌 **develop a product**  \n→ 製品を開発する\n\n📌 **develop an interest in ～**  \n→ ～に興味を持つようになる\n\n📌 **develop a problem**  \n→ 問題が発生する\n\n**develop** は、**「成長させる」だけでなく「成長して結果として何かが現れる」**場合にも使えるのがポイント。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「develop」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「develop」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「develop」と「grow」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 発達する、発展させる、開発する、身につける\n\n**A2.** She developed a strong interest in artificial intelligence.\n\n**A3.** 「develop」は「発達する、発展させる、開発する、身につける」、一方「grow」は「成長する」です。 元の解説では、💡 develop は、単に「作る」のではなく、時間をかけて成長・発展させるイメージが強い。\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### ① 発達する・成長する\n\n- **Children develop at different rates.**  \n  → 子どもはそれぞれ異なる速さで発達する。\n\n### ② 開発する・作り出す\n\n- **develop a new product**  \n  → 新製品を開発する\n- **develop new software**  \n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Develop』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Develop → develop\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. Children develop at different rates.\n2. develop a new product\n3. develop new software\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. develop の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\ndevelop ＝ Develop\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_27">{"A": "【A｜単語・核】\ndispense\n読み・発音：—\n基本意味：Dispense\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：Dispense\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：dispense ＝ Dispense", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【単語】\n\n# **Dispense**（**ディスペンス**）\n\n**verb. 分配する、提供する、（薬を）調剤する**\n\n👉 核となるイメージ：**「必要なものを、必要な分だけ取り出して渡す」**\n\n---\n\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 分配する\n- 提供する\n- （薬を）調剤して渡す\n- （機械が）～を出す\n\n### 類義語とニュアンスの違い\n\n- **dispense**：必要な量を出して渡す  \n  → **決められたもの・量を取り出して提供する**イメージ。薬や自動販売機などでよく使う。  \n  *The machine dispenses water.*  \n  → その機械は水を供給します。\n\n- **distribute**：配布する、分配する  \n  → **複数の人・場所に広く配る**ことに重点がある。  \n  *They distributed food to the residents.*  \n  → 住民に食料を配った。\n\n- **provide**：提供する  \n  → 相手が必要としているものを**用意して与える**という広い表現。  \n  *The hotel provides free Wi-Fi.*  \n  → そのホテルは無料Wi-Fiを提供しています。\n\n- **supply**：供給する  \n  → 必要なものを**継続的・大量に供給する**イメージ。  \n  *The company supplies electricity to the city.*  \n  → その会社は市に電力を供給しています。\n\n- **administer**：投与する  \n  → 薬などを**実際に患者に与える・投与する**ことに重点がある。  \n  *The nurse administered the medicine.*  \n  → 看護師が薬を投与した。\n\n### 🔑 ざっくり区別すると\n\n> **dispense** → 💊 必要な分を取り出して渡す  \n> **distribute** → 📦 多くの人に配る  \n> **provide** → 🤲 必要なものを提供する  \n> **supply** → 🚚 継続的に供給する  \n> **administer** → 💉 薬を実際に投与する\n\n### 対義語\n\n- **withhold**：与えずに差し控える\n- **retain**：保持する\n- **collect**：集める\n- **take back**：取り戻す\n\n---\n\n## C【イメージ記憶】\n\n🧴 **ディスペンサーを押すと、必要な量だけ出てくる**\n\n```text\n   🧴\n   ↓ 押す\n  💧\n  💧\n   ↓\n必要な分だけ出る\n   ↓\n dispense\n```\n\n日本語でも、\n\n> **soap dispenser（ソープディスペンサー）**\n\nと言います。\n\n👉 **dispense = 中にあるものを必要な分だけ出して渡す**\n\nと考えると覚えやすい。\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **This machine dispenses hot and cold water.**\n\n**この機械は温水と冷水を供給します。**\n\n機械の中に水がある  \n↓  \nボタンを押す  \n↓  \n🥤 必要な量が出てくる\n\n👉 **dispense**\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **dispense = 必要なものを、必要な分だけ出して渡す**\n\n### 📌 よく出る表現\n\n- **dispense medicine**：薬を調剤して渡す\n- **dispense medication**：薬を調剤する\n- **dispense water**：水を供給する\n- **dispense cash**：現金を払い出す\n- **dispense advice**：助言を与える\n- **dispense with ～**：～なしで済ませる\n\n---\n\n## ⚠️ 重要：**dispense with ～**\n\n**dispense with ～** になると意味が大きく変わり、\n\n> **「～なしで済ませる・～を不要とする」**\n\nになります。\n\n### **We can dispense with this procedure.**\n\n**この手続きは省くことができます。**\n\nイメージは、\n\n> 「これはなくても大丈夫」  \n> → 🗑️ **取り除いてしまう**\n\n### 類似表現との違い\n\n- **dispense with ～**：不要なので省く\n- **do without ～**：～なしで済ませる（日常的）\n- **omit ～**：文章・手順などから省略する\n- **skip ～**：順番・工程などを飛ばす\n\n---\n\n### 📖 読み方\n\ngenui{\"pronunciation_block_widget_v4_audio_fix_v2_realtime_audio_mini\":{\"content\":\"dispense\",\"pronunciation_hint\":\"ディスペンス\",\"pronunciation_language\":\"en\"}}\n\n**dispense** → **ディスペンス**  \n発音：/dɪˈspens/\n\n📌 後半の **「スペンス」** を強めに発音します。\n\n**dispenser（ディスペンサー）= 中身を一定量ずつ出す装置**を知っていれば、\n\n> **dispenser → 出す装置**  \n> **dispense → 出して与える**\n\n *。\n\n---\n\n## D【ストーリー暗記・例文】\n\n**The company will pay your travel expenses.**\n\n**会社があなたの旅費を負担します。**\n\n💼 出張では、\n\n🚄 新幹線代  \n🏨 ホテル代  \n🍽️ 食事代\n\nこれらはすべて **travel expenses（旅費・出張経費）** と呼ばれる。\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **expense = 出ていくお金（費用・経費）**\n\n---\n\n### 📌 よく出る表現\n\n- **travel expenses**：旅費\n- **business expenses**：事業経費\n- **living expenses**：生活費\n- **medical expenses**：医療費\n- **at someone's expense**：～の負担で\n- **cut expenses**：経費を削減する\n\n---\n\n## 📌 expense と cost の違い\n\n### **expense**\n➡ **実際に支払った（支払う）お金・経費**\n\n> **The company reimbursed my travel expenses.**\n> （会社が旅費を精算してくれた。）\n\n### **cost**\n➡ **何かに必要な費用・値段**\n\n> **The cost of the hotel was $200.**\n> （ホテル代は200ドルだった。）\n\nつまり、\n\n- **cost** = 値段・コスト\n- **expense** = 実際の出費・経費\n\nという違いがあります。\n\n---\n\n### 📖 読み方（カタカナ）\n\ngenui{\"pronunciation_block_widget_v4_audio_fix_v2_realtime_audio_mini\":{\"content\":\"expense\",\"pronunciation_hint\":\"イクスペンス\",\"pronunciation_language\":\"en\"}}\n\n**expense** → **イクスペンス**（第2音節「**スペ**」にアクセント）\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「expense」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「expense」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「expense」と「medical expenses」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 費用、経費、出費\n\n**A2.** The company will pay your travel expenses.\n\n**A3.** 「expense」は「費用、経費、出費」という意味で、「medical expenses」は「医療費」です。📌 expense と cost の違い\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 費用\n- 経費\n- 出費\n\n### 類義語\n\n- **cost**：費用（最も一般的）\n- **fee**：料金（サービスへの支払い）\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Expense』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Expense → expense\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰します ・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nfade into ＝ fade into\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_36">{"A": "【A｜単語・核】\nfeel free to\n読み・発音：—\n基本意味：Feel free to ～\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：Feel free to ～\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：feel free to ＝ Feel free to ～", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【表現】\n\n# **Feel free to ～**（**フィール・フリー・トゥ**）\n\n**phrase. 遠慮なく～してください、自由に～してください、気軽に～してください**\n\n👉 核となるイメージ：**「気を遣わなくていいから、自由にやってね」**\n\n相手に**許可を与えたり、遠慮しなくていいと伝えたりする**ときによく使います。\n\n---\n\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 遠慮なく～してください\n- 気軽に～してください\n- 自由に～してください\n- どうぞ～してください\n\n### 類義語とニュアンスの違い\n\n- **feel free to ～**：遠慮なく～してください  \n  → **「気を遣わず、自由にしていいですよ」**という相手への配慮がある。  \n  *Feel free to ask questions.*  \n  → 遠慮なく質問してください。\n\n- **please ～**：～してください  \n  → 丁寧に何かを**依頼・案内する**一般的な表現。  \n  *Please ask me if you have any questions.*  \n  → 質問があれば聞いてください。\n\n- **don't hesitate to ～**：遠慮なく～してください  \n  → **「ためらわないでください」**という意味。feel free to より少しフォーマルで、ビジネスメールでもよく使う。  \n  *Don't hesitate to contact us.*  \n  → 遠慮なくお問い合わせください。\n\n- **go ahead and ～**：どうぞ～してください  \n  → 相手が何かをしようとしているときに、**「いいですよ、やってください」**と許可する感じ。  \n  *Go ahead and use my computer.*  \n  → どうぞ私のパソコンを使ってください。\n\n- **you're welcome to ～**：自由に～して構いません  \n  → **「～してもらって構いませんよ」**と許可・歓迎する表現。  \n  *You're welcome to stay here.*  \n  → ここにいてもらって構いませんよ。\n\n### 🔑 ざっくり区別すると\n\n> **feel free to** → 😊 気軽に・遠慮なくどうぞ  \n> **please** → 🙏 丁寧に「～してください」  \n> **don't hesitate to** → 👔 ためらわず～してください  \n> **go ahead** → 👍 いいですよ、やってください  \n> **you're welcome to** → 🚪 自由に～して構いません\n\n### 対義語・反対のイメージ\n\n- **refrain from ～**：～を控える\n- **avoid ～ing**：～するのを避ける\n- **don't ～**：～しないでください\n- **be prohibited from ～ing**：～することを禁止されている\n\n---\n\n## C【イメージ記憶】\n\n🏢 新しい職場で質問したいけど……\n\n```text id=\"pkr2zq\"\n新人 🙋\n「質問していいのかな…」\n       ↓\n上司 👨‍💼\n「気にしなくていいよ！\n  何でも聞いて！」\n       ↓\nFeel free to ask.\n```\n\n**feel = 感じる**  \n**free = 自由な**\n\nなので、\n\n> **feel free →「自由な気持ちでいて」**  \n> ↓  \n> **遠慮しないで**\n\nという感覚です。\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **Feel free to ask me any questions.**\n\n**遠慮なく何でも質問してください。**\n\n相手が、\n\n> 🤔「こんなこと聞いて大丈夫かな？」\n\nと思っているところに、\n\n> 😊「全然気にしなくていいですよ！」\n\nと伝える。\n\n👉 **Feel free to ～**\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **feel free to ～ = 気を遣わず、遠慮なく～してね**\n\n### 📌 基本文型\n\n**feel free to + 動詞の原形**\n\n> **Feel free to ask.**  \n> 遠慮なく質問してください。\n\n> **Feel free to contact me.**  \n> お気軽にご連絡ください。\n\n> **Feel free to use this room.**  \n> この部屋は自由に使ってください。\n\n### 📌 よく出る表現\n\n- **Feel free to ask.**：遠慮なく聞いてください\n- **Feel free to contact me.**：お気軽にご連絡ください\n- **Feel free to join us.**：気軽に参加してください\n- **Feel free to use it.**：自由に使ってください\n- **Please feel free to ～**：どうぞお気軽に～してください\n\n---\n\n## 📌 feel free to と don't hesitate to の違い\n\n### **feel free to**\n→ 😊 **親しみのある「気軽に～してね」**\n\n> **Feel free to ask me anything.**  \n> 気軽に何でも聞いてください。\n\n### **don't hesitate to**\n→ 👔 **「ためらわず～してください」**\n\n少しフォーマルなので、ビジネスメールでもよく登場します。\n\n> **Please don't hesitate to contact us if you have any questions.**  \n> ご質問がございましたら、どうぞお気軽にお問い合わせください。\n\n👉 **feel free to** = 😊「気軽にどうぞ」  \n👉 **don't hesitate to** = 👔「ご遠慮なく～してください」\n\n---\n\n### 📖 読み方\n\n**feel free to** → **フィール・フリー・トゥ**  \n発音：/fiːl friː tə/\n\n📌 会話では最後の **to** は弱くなり、**「フィール・フリー・タ」**に近く聞こえることがあります。\n\n**Feel free to ask.** はそのまま一つのフレーズとして覚えておくと、英会話でも非常に使いやすいです。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「feel free to」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「feel free to」を使った短い英文を1つ作ってみてください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 遠慮なく～してください、自由に～してください、気軽に～してください\n\n**A2.** Feel free to ask me any questions.\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 遠慮なく～してください\n- 気軽に～してください\n- 自由に～してください\n- どうぞ～してください\n\n### 類義語とニュアンスの違い\n\n- **feel free to ～**：遠慮なく～してください  \n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Feel free to ～』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Feel free to ～ → feel free to\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. feel free to ～**：遠慮なく～してください\n2. Feel free to ask questions.\n3. Please ask me if you have any questions.\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. feel free to の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nfeel free to ＝ Feel free to ～\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_37">{"A": "【A｜単語・核】\nfierce\n読み・発音：—\n基本意味：Fierce\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：Fierce\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：fierce ＝ Fierce", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【単語】\n\n# **Fierce**\n**adj. 激しい、猛烈な、どう猛な、勇猛な**\n\n👉 核となるイメージ：**「強い力や攻撃性が、激しく前面に出ている」**\n\n---\n\n## B【日本語訳・類義語・対義語】\n\n### 類義語\n\n- **ferocious**：どう猛な、猛烈な\n- **aggressive**：攻撃的な\n- **intense**：激しい、強烈な\n- **violent**：暴力的な、猛烈な\n- **strong**：強い\n\n### 対義語\n\n- **gentle**：穏やかな、優しい\n- **mild**：穏やかな、軽い\n- **calm**：落ち着いた\n- **weak**：弱い\n\n💡 **fierce** は「強い」だけでなく、**激しさ・攻撃性・闘争心**が感じられる。\n\n---\n\n## C【イメージ記憶】\n\n🦁 **獲物に向かって激しく襲いかかるライオン**\n\n```text\n      🦁\n   ╲  ⚡  ╱\n    ╲    ╱\n     🔥🔥\n      ↓\n    fierce\n```\n\nただ「強い」のではなく、\n\n> **「絶対に負けない！」という激しい力が出ている**\n\nイメージ。\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **The two teams had a fierce competition.**\n\n**その2つのチームは激しい競争を繰り広げた。**\n\n---\n\n### 🔑 核を一言で覚えるなら\n\n> **fierce = 激しい力・攻撃性・闘争心が前面に出ている**\n\n📌 **fierce competition**  \n→ 激しい競争\n\n📌 **a fierce animal**  \n→ どう猛な動物\n\n📌 **a fierce warrior**  \n→ 勇猛な戦士\n\n📌 **fierce wind**  \n→ 猛烈な風\n\n**fierce** は、人や動物だけでなく、**競争・戦い・風などの勢いが激しいもの**にも使える。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「fierce」の日本語の意味を、答えを見ずに言えますか？**\n\n s。ゲームで体力を表す数値。』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → hit points / health points。ゲームで体力を表す数値。 → HP\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. HP ＝ hit points / health points。ゲームで体力を表す数値。\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. HP の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nHP ＝ hit points / health points。ゲームで体力を表す数値。\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_48">{"A": "【A｜単語・核】\nI mean\n読み・発音：アイ・ミーン\n基本意味：I mean\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：I mean\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：I mean ＝ I mean", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【表現】\n\n# **I mean**（**アイ・ミーン**）\n\n**phrase. つまり、というか、私が言いたいのは、だって**\n\n👉 核となるイメージ：**「今言ったことを、もう少し正確に言い直す」**\n\n英会話では非常によく使われ、**言い直し・補足・説明・強調**などに使います。\n\n---\n\n## B【日本語訳・類似表現】\n\n### ① 「つまり・というか」【言い直し】\n\n> **He's really young. I mean, he's only 20.**  \n> 彼は本当に若いよ。**というか、まだ20歳なんだ。**\n\n👉 前の発言を**より具体的に言い直す**。\n\n---\n\n### ② 「私が言いたいのは～」【説明】\n\n> **What I mean is that we need more time.**  \n> **私が言いたいのは、もっと時間が必要だということです。**\n\n👉 自分の意図をはっきり説明する。\n\n---\n\n### ③ 「だって・ほら」【理由・補足】\n\n> **I don't want to go. I mean, it's already midnight.**  \n> 行きたくないよ。**だって、もう夜中の12時だよ。**\n\n👉 自分の発言に**理由を付け加える**。\n\n---\n\n## 類似表現とニュアンスの違い\n\n- **I mean**：というか、つまり  \n  → 自分の発言を**言い直したり、補足したりする**。会話で非常によく使う。  \n  *It's difficult. I mean, it'll take a lot of time.*  \n  → 難しいよ。というか、かなり時間がかかる。\n\n- **in other words**：言い換えると  \n  → 同じ内容を**別の言葉で分かりやすく説明する**。I mean より整理された表現。  \n  *In other words, we need to start again.*  \n  → 言い換えると、最初からやり直す必要があります。\n\n- **that is**：つまり、すなわち  \n  → 前の内容を**正確に説明・定義する**。ややフォーマル。  \n  *We have one option—that is, to wait.*  \n  → 選択肢は一つ、つまり待つことです。\n\n- **what I mean is ～**：私が言いたいのは～  \n  → **自分の意図を明確に説明したい**ときに使う。  \n  *What I mean is, we shouldn't rush.*  \n  → 私が言いたいのは、急ぐべきではないということです。\n\n### 🔑 ざっくり区別すると\n\n> **I mean** → 💬「というかさ・つまりね」  \n> **in other words** → 🔄「別の言い方をすると」  \n> **that is** → 📝「すなわち」  \n> **what I mean is** → 🎯「私が言いたいのは～」\n\n---\n\n## C【イメージ記憶】\n\n話している途中で……\n\n```text\n🗣️「あの映画よかったよ」\n        ↓\n🤔「よかった、というか…」\n        ↓\n🗣️「映像がすごかった！」\n        ↑\n      I mean\n```\n\n👉 最初の言葉では少し足りない  \n↓  \n**「いや、正確に言うとね……」**  \n↓  \n**I mean, ～**\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **He's not a bad person. I mean, he can be difficult sometimes.**\n\n**彼は悪い人じゃないよ。というか、たまに付き合いにくいことはあるけど。**\n\n最初に発言する  \n↓  \n「ちょっと言い方が正確じゃないな」  \n↓  \n💬 **I mean...**  \n↓  \n説明を追加する\n\n👉 日本語の**「というか」「つまりね」「ほら」**に近い感覚です。\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **I mean = 「というか、私が言いたいのはね…」**\n\n### 📌 よく出る形\n\n- **I mean, ～**：というか、つまり～\n- **What I mean is ～**：私が言いたいのは～\n- **I mean it.**：本気だよ\n- **Do you know what I mean?**：言いたいこと分かる？\n- **You know what I mean?**：言ってる意味分かる？／分かるでしょ？\n\n---\n\n## ⚠️ **I mean it.** は意味が違う\n\n### **I mean it.**\n\n**本気だよ。／冗談じゃないよ。**\n\nここでの **mean** は、\n\n> **「本気でそういう意味で言っている」**\n\nという感覚。\n\n> **I'll help you. I mean it.**  \n> 手伝うよ。本気だからね。\n\n---\n\n## 📌 実際の会話では「つなぎ言葉」にもなる\n\nネイティブの会話では、\n\n> **Well, I mean, I don't know.**\n\nのようにも使います。\n\n**「うーん、というか、分からないな」**\n\nこの場合、**I mean をきれいに日本語訳しなくてもOK**です。\n\n👉 **I mean = 話しながら考えたり、言葉を修正したりするためのクッション**\n\nという使い方も非常に重要です。\n\n---\n\n### 📖 読み方\n\n**I mean** → **アイ・ミーン**  \n発音：/aɪ miːn/\n\n📌 **mean** は「意味する」が基本。\n\n> **I mean ～**  \n> ↓  \n> 「私が意味しているのは～」  \n> ↓  \n> **「つまりね／というかね」**\n\nと考えると覚えやすいです。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「I mean」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「I mean」を使った短い英文を1つ作ってみてください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** つまり、というか、私が言いたいのは、だって\n\n**A2.** He's not a bad person. I mean, he can be difficult sometimes.\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## 類似表現とニュアンスの違い\n\n- **I mean**：というか、つまり  \n  → 自分の発言を**言い直したり、補足したりする**。会話で非常によく使う。  \n  *It's difficult. I mean, it'll take a lot of time.*  \n  → 難しいよ。というか、かなり時間がかかる。\n\n- **in other words**：言い換えると  \n  → 同じ内容を**別の言葉で分かりやすく説明する**。I mean より整理された表現。  \n  *In other words, we need to start again.*  \n  → 言い換えると、最初からやり直す必要があります。\n\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『I mean』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → I mean → I mean\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. He's really young. I mean, he's only 20.\n2. What I mean is that we need more time.\n3. I don't want to go. I mean, it's already midnight.\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. I mean の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nI mean ＝ I mean\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_49">{"A": "【A｜単語・核】\nimperfect\n読み・発音：—\n基本意味：Imperfect\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：Imperfect\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：imperfect ＝ Imperfect", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【単語】\n\n# **Imperfect**\n**adj. 不完全な、完璧ではない**\n\n👉 核となるイメージ：**「完全（perfect）ではない」**\n\n---\n\n## B【日本語訳・関連語】\n\n### **imperfect**\n＝ **完全ではない、欠点がある**\n\n- **an imperfect system**  \n  → 不完全なシステム\n- **an imperfect solution**  \n  → 完璧ではない解決策\n- **human beings are imperfect**  \n  → 人間は不完全だ\n\n💡 **im-** は「〜でない」という意味を加える接頭辞。\n\n> **im + perfect**  \n> → **perfect ではない**\n\n**関連語**\n- **perfect**：完全な\n- **imperfection**：不完全さ、欠点\n- **imperfectly**：不完全に\n\n---\n\n## C【イメージ記憶】\n\n💎 **完璧なダイヤモンドに少し傷がある**\n\n```text\nPERFECT 💎\n     ↓\n   ✨ 傷 ✨\n     ↓\nIMPERFECT\n```\n\n完全ではない。\n\nでも、\n\n> **imperfect = worthless（価値がない）**\n\nではない。\n\n👉 **「完璧ではないが、価値はある」**\n\nというニュアンスで使われることも多い。\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **Nobody is perfect. We are all imperfect.**\n\n**完璧な人はいない。私たちはみんな不完全だ。**\n\n---\n\n### 🔑 核を一言で覚えるなら\n\n> **imperfect = perfect ではない**\n\n📌 スペルは **inperfect** ではなく、**imperfect** です。\n\n**im-** は、後ろの音に合わせて **in-** が変化した形です。\n\n- **perfect → imperfect**\n- **possible → impossible**\n- **patient → impatient**\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「imperfect」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「imperfect」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「imperfect」と「imperfect」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 不完全な、完璧ではない\n\n**A2.** Nobody is perfect. We are all imperfect.\n\n**A3.** 「imperfect」は「不完全な、完璧ではない」、一方「imperfect」は「worthless（価値がない）」です。\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・関連語】\n\n### **imperfect**\n＝ **完全ではない、欠点がある**\n\n- **an imperfect system**  \n  → 不完全なシステム\n- **an imperfect solution**  \n  → 完璧ではない解決策\n- **human beings are imperfect**  \n  → 人間は不完全だ\n\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Imperfect』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Imperfect → imperfect\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. an imperfect system\n2. an imperfect solution\n3. human beings are imperfect\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. imperfect の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nimperfect ＝ Imperfect\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_50">{"A": "【A｜単語・核】\nintensity\n読み・発音：インテンシティ\n基本意味：Intensity\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：Intensity\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：intensity ＝ Intensity", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【単語】\n\n# **Intensity**（**インテンシティ**）\n\n**noun. 強度、激しさ、強烈さ、集中度**\n\n👉 核となるイメージ：**「どれくらい強いか、その“強さの度合い”」**\n\n運動・光・感情・痛み・仕事など、さまざまなものの**「強さのレベル」**を表します。\n\n---\n\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 強度\n- 激しさ\n- 強烈さ\n- 集中度\n\n### 類義語とニュアンスの違い\n\n- **intensity**：強度、激しさ  \n  → **「どのくらい強いか」という程度**に注目する言葉。  \n  *The intensity of the exercise increased.*  \n  → 運動の強度が上がった。\n\n- **strength**：強さ、力  \n  → 人の筋力・物の強度・能力など、**そのものが持っている力**に重点がある。  \n  *He has great physical strength.*  \n  → 彼は非常に強い筋力を持っている。\n\n- **power**：力、パワー  \n  → **何かを動かしたり、影響を与えたりする能力・力**を表す。  \n  *This engine has a lot of power.*  \n  → このエンジンは非常にパワーがある。\n\n- **severity**：深刻さ、激しさ  \n  → 病気・事故・天候・問題など、**悪いものがどれほど深刻か**を表す。  \n  *The severity of the storm increased.*  \n  → 嵐の激しさが増した。\n\n- **degree**：程度、度合い  \n  → 強さに限らず、**「どの程度なのか」**を広く表す中立的な言葉。  \n  *The degree of difficulty varies.*  \n  → 難しさの程度は異なります。\n\n### 🔑 ざっくり区別すると\n\n> **intensity** → 🔥 どれくらい「強烈か」  \n> **strength** → 💪 どれくらい「力があるか」  \n> **power** → ⚡ 何かを動かす・影響させる「力」  \n> **severity** → ⚠️ どれくらい「深刻か」  \n> **degree** → 📊 どのくらいの「程度か」\n\n### 対義語\n\n- **weakness**：弱さ\n- **mildness**：穏やかさ、軽度\n- **moderation**：適度、節度\n- **low intensity**：低強度\n\n---\n\n## C【イメージ記憶】\n\n🏃 **同じランニングでも「どれくらいキツいか」が違う**\n\n```text\n🚶 低強度\n   ↓\n🏃 中強度\n   ↓\n🏃💨 高強度\n   ↓\nintensity\n```\n\n例えば、\n\n> ゆっくり走る → **low intensity**  \n> 全力で走る → **high intensity**\n\n👉 **intensity = 強さ・激しさのレベル**\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **You should gradually increase the intensity of your workout.**\n\n**運動の強度を徐々に上げるべきです。**\n\n軽い運動  \n↓  \n少し負荷を上げる  \n↓  \nさらに負荷を上げる  \n↓  \n🔥 **intensity が上がる**\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **intensity = 「どれくらい強いか」という強さの度合い**\n\n### 📌 よく出る表現\n\n- **high intensity**：高強度\n- **low intensity**：低強度\n- **exercise intensity**：運動強度\n- **increase the intensity**：強度を上げる\n- **reduce the intensity**：強度を下げる\n- **the intensity of pain**：痛みの強さ\n- **the intensity of light**：光の強度\n- **emotional intensity**：感情の激しさ\n\n---\n\n## 📌 intensity と strength の違い\n\n### **strength**\n→ **そのものが持っている「力・強さ」**\n\n> **He has great strength.**  \n> 彼には強い力があります。\n\n💪「どれだけ力を持っているか」\n\n### **intensity**\n→ **活動・現象などが「どれくらい激しいか」**\n\n> **The intensity of the workout was high.**  \n> そのトレーニングの強度は高かった。\n\n🔥「どれだけ激しく行われているか」\n\n👉 **strength** = 💪 持っている「力」  \n👉 **intensity** = 🔥 発揮されている「強さ・激しさの度合い」\n\n---\n\n## 🌱 intense とのつながり\n\nセットで覚えると簡単です。\n\n> **intense**【形容詞】→ 激しい、強烈な  \n> **intensity**【名詞】→ 激しさ、強度  \n> **intensify**【動詞】→ 強める、激しくなる\n\n例えば、\n\n> **intense exercise**  \n> 激しい運動\n\n↓ 名詞にすると\n\n> **exercise intensity**  \n> 運動強度\n\n---\n\n### 📖 読み方\n\n**intensity** → **インテンシティ**  \n発音：/ɪnˈtensəti/\n\n📌 **「テン」**の部分を強く読みます。\n\n**intense（インテンス）→ intensity（インテンシティ）** とセットで覚えると定着しやすいです。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「intensity」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「intensity」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「intensity」と「the intensity of pain」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 強度、激しさ、強烈さ、集中度\n\n**A2.** You should gradually increase the intensity of your workout.\n\n**A3.** 「intensity」は「強度、激しさ、強烈さ、集中度」という意味で、「the intensity of pain」は「痛みの強さ」です。📌 intensity と strength の違い\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 強度\n- 激しさ\n- 強烈さ\n- 集中度\n\n### 類義語とニュアンスの違い\n\n- **intensity**：強度、激しさ  \n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Intensity』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Intensity → intensity\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. intensity**：強度、激しさ\n2. The intensity of the exercise increased.\n3. He has great physical strength.\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語 rary**：旅行日程\n- **flight itinerary**：フライト日程\n- **detailed itinerary**：詳細な旅程\n- **planned itinerary**：計画された旅程\n- **change the itinerary**：旅程を変更する\n- **confirm your itinerary**：旅程を確認する\n\n---\n\n## 📌 itinerary と schedule の違い\n\n### **itinerary**\n→ **旅行・出張の行程表**\n\n> **Here's our itinerary for the trip.**  \n> こちらが旅行の旅程です。\n\n### **schedule**\n→ 仕事・学校・旅行など、**あらゆる予定**\n\n> **I have a busy schedule today.**  \n> 今日は予定が詰まっています。\n\n👉 **itinerary** = ✈️ **旅行の行程表**  \n👉 **schedule** = 📅 **予定全般**\n\n---\n\n### 📖 読み方\n\ngenui{\"pronunciation_block_widget_v4_audio_fix_v2_realtime_audio_mini\":{\"content\":\"itinerary\",\"pronunciation_hint\":\"アイティネラリー\",\"pronunciation_language\":\"en\"}}\n\n**itinerary** → **アイティネラリー**  \n発音：/aɪˈtɪnəˌreri/\n\n📌 スペルが長くて読みづらいですが、**「アイ・ティネ・ラリー」**くらいに分けると覚えやすいです。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「itinerary」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「itinerary」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「itinerary」と「planned itinerary」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 旅行日程、旅程、旅行計画\n\n**A2.** I'll send you the travel itinerary tomorrow.\n\n**A3.** 「itinerary」は「旅行日程、旅程、旅行計画」という意味で、「planned itinerary」は「計画された旅程」です。📌 itinerary と schedule の違い\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 旅程\n- 旅行日程\n- 旅行の予定表\n\n### 類義語\n\n- **schedule**：予定、スケジュール\n- **travel plan**：旅行計画\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Itinerary』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Itinerary → itinerary\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. 💡 **itinerary** は普通の予定ではなく、特に**旅行・出張の詳しいスケジュール**に使われる。\n2. 📋 ITINERARY\n3. ＝ itinerary\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. itinerary の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nitinerary ＝ Itinerary\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_55">{"A": "【A｜単語・核】\nlay off\n読み・発音：—\n基本意味：Lay off\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：Lay off\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：lay off ＝ Lay off", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【表現】\n\n# **Lay off**（**レイ・オフ**）\n\n**phrasal verb. ～を解雇する、人員整理する**\n\n👉 核となるイメージ：**「会社の事情で、従業員を仕事から外す」**\n\n特に重要なのは、**本人の能力や不祥事が理由とは限らない**ことです。\n\n会社の業績悪化・コスト削減・事業縮小などによる解雇によく使います。\n\n---\n\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- ～を解雇する\n- 人員整理する\n- レイオフする\n\n### 類義語とニュアンスの違い\n\n- **lay off**：会社都合で解雇する  \n  → **業績悪化・事業縮小・組織再編など、会社側の事情で従業員を解雇する**ときによく使う。  \n  *The company laid off 200 employees.*  \n  → 会社は200人の従業員を解雇した。\n\n- **fire**：クビにする、解雇する  \n  → **本人の成績・勤務態度・問題行動などを理由に解雇する**場合によく使う。日常的な表現。  \n  *He was fired for being late repeatedly.*  \n  → 彼は何度も遅刻したため解雇された。\n\n- **dismiss**：解雇する  \n  → **fire よりフォーマルな「解雇する」**。会社の正式な文書などでも使われる。  \n  *He was dismissed from his position.*  \n  → 彼は職を解かれた。\n\n- **terminate**：雇用を終了する  \n  → **契約・雇用関係を正式に終了させる**という非常に事務的・フォーマルな表現。  \n  *The company terminated his employment.*  \n  → 会社は彼との雇用関係を終了した。\n\n- **make someone redundant**：余剰人員として解雇する  \n  → **その人ではなく「そのポジション自体が不要になった」ため解雇する**。特にイギリス英語でよく使う。  \n  *He was made redundant last year.*  \n  → 彼は昨年、人員整理で解雇された。\n\n### 🔑 ざっくり区別すると\n\n> **lay off** → 📉 会社事情で人員整理  \n> **fire** → ❌ 本人側の問題などでクビ  \n> **dismiss** → 📄 フォーマルな「解雇する」  \n> **terminate** → 📝 雇用契約を正式に終了  \n> **make redundant** → 🪑 ポジション自体が不要になって解雇\n\n### 対義語\n\n- **hire**：雇う\n- **employ**：雇用する\n- **recruit**：採用する\n- **retain**：従業員などを引き留める、雇用し続ける\n\n---\n\n## C【イメージ記憶】\n\n📉 **会社の業績が悪化**\n\n```text\n🏢 会社\n   ↓\n📉 売上減少\n   ↓\n💰 コスト削減\n   ↓\n👥👥👥\n   ↓\n人員を減らす\n   ↓\n lay off\n```\n\nポイントは、\n\n> **「この人が悪いからクビ！」**\n\nではなく、\n\n> **「会社の事情で人を減らさないといけない」**\n\n👉 これが典型的な **lay off**。\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **The company laid off hundreds of employees.**\n\n**その会社は数百人の従業員を解雇しました。**\n\n会社の売上が悪化  \n↓  \nコスト削減が必要  \n↓  \n👥 人員削減  \n↓  \n**lay off employees**\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **lay off = 会社事情で従業員を仕事から外す**\n\n### 📌 よく出る表現\n\n- **lay off employees**：従業員を解雇する\n- **lay off workers**：労働者を解雇する\n- **be laid off**：解雇される\n- **get laid off**：解雇される\n- **mass layoffs**：大量解雇\n- **announce layoffs**：人員削減を発表する\n\n---\n\n## ⚠️ lay off の活用\n\n**lay → laid → laid**\n\nなので、\n\n> **lay off → laid off → laid off**\n\nです。\n\n❌ **The company layed off workers.**  \n⭕ **The company laid off workers.**\n\n### **I got laid off.**\n\n**私は会社都合で解雇されました。**\n\nこの **get laid off** は非常によく使われます。\n\n---\n\n## 📌 lay off と resign の違い\n\n前に出てきた **resign** とセットで覚えると分かりやすいです。\n\n### **resign**\n→ 🙋 **自分から辞める**\n\n> **He resigned from the company.**  \n> 彼は会社を退職した。\n\n### **lay off**\n→ 🏢 **会社側が人員整理で辞めさせる**\n\n> **The company laid him off.**  \n> 会社は彼を人員整理で解雇した。\n\n### **fire**\n→ ❌ **本人の問題などで会社がクビにする**\n\n> **The company fired him.**  \n> 会社は彼をクビにした。\n\nつまり、\n\n> 🙋 **resign** → 自分から辞める  \n> 📉 **be laid off** → 会社事情で辞めさせられる  \n> ❌ **be fired** → 問題などがあってクビになる\n\n---\n\n### 📖 読み方\n\n**lay off** → **レイ・オフ**  \n発音：/leɪ ɔːf/\n\n📌 名詞の **layoff** も重要です。\n\n> **lay off**【動詞】→ 解雇する  \n> **layoff**【名詞】→ 人員削減、解雇\n\n**The company announced layoffs.**  \n→ **会社は人員削減を発表しました。**\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「lay off」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「lay off」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「lay off」と「fire」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** ～を解雇する、人員整理する\n\n**A2.** The company laid off hundreds of employees.\n\n**A3.** 「lay off」は「～を解雇する、人員整理する」、一方「fire」は「クビにする、解雇する」です。\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- ～を解雇する\n- 人員整理する\n- レイオフする\n\n### 類義語とニュアンスの違い\n\n- **lay off**：会社都合で解雇する  \n  → **業績悪化・事業縮小・組織再編など、会社側の事情で従業員を解雇する**ときによく使う。  \n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Lay off』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Lay off → lay off\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. lay off**：会社都合で解雇する\n2. The company laid off 200 employees.\n3. He was fired for being late repeatedly.\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. lay off の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nlay off ＝ Lay off\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_56">{"A": "【A｜単語・核】\nlet out a breath\n読み・発音：—\n基本意味：let out a breath\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：let out a breath\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：let out a breath ＝ let out a breath", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【単語】\n\n# **let out a breath**\n\n意味： 息を吐く、息を漏らす。\n\n---\n\n## B【意味・使い方】\n\n**意味： 息を吐く、息を漏らす。**\n\n英語では、この意味を表したい場面で使います。単語だけでなく、前後の語との組み合わせで意味を捉えるのがポイントです。\n\n---\n\n## C【イメージ記憶】\n\n🧠 **let out a breath**\n\n↓  \n\n**意味： 息を吐く、息を漏らす。**\n\nこの中心イメージを先に覚えて、日本語訳はそこから思い出すようにすると定着しやすくなります。\n\n---\n\n## D【一言で覚えるなら】\n\n**let out a breath ＝ 意味： 息を吐く、息を漏らす。**\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「let out a breath」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「let out a breath」を使った短い英文を1つ作ってみてください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 息を吐く、息を漏らす。\n\n**A2.** let out a breath ＝ 意味： 息を吐く、息を漏らす。\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n近い語は、意味だけでなく「焦点・強さ・使う場面」の違いまで比較して覚えます。\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\ かってる！」\n      ↓\n    make sure\n```\n\nただ見るだけではなく、\n\n> **「間違いなく大丈夫！」という状態にする**\n\n👉 これが **make sure**\n\n**make + sure（確かな）**  \n→ **確かな状態にする**\n\nと考えると覚えやすい。\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **Make sure you turn off the lights before you leave.**\n\n**出かける前に、必ず電気を消してください。**\n\n💡 電気を確認  \n↓  \n消えていなければ消す  \n↓  \n「よし、これで大丈夫」\n\n👉 **make sure = 忘れないように必ず～する**\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **make sure = 「間違いない状態」にする**\n\n### 📌 よく出る形\n\n**① make sure + 文**\n\n> **Make sure the door is locked.**  \n> ドアに鍵がかかっていることを確認して。\n\n**② make sure to + 動詞**\n\n> **Make sure to call me.**  \n> 必ず私に電話してね。\n\n**③ make sure of + 名詞**\n\n> **Make sure of the facts.**  \n> 事実をしっかり確認してください。\n\n---\n\n## 📌 make sure と confirm の違い\n\n### **make sure**\n日常的な**「ちゃんと確認する・忘れずに～する」**。\n\n> **Make sure you have your passport.**  \n> パスポートを持っているかちゃんと確認してね。\n\n### **confirm**\n情報・予約・予定などを**「間違いないと確認する」**。ビジネスでもよく使う。\n\n> **Please confirm your flight details.**  \n> フライトの詳細を確認してください。\n\n👉 **make sure** = ☑️「ちゃんとね・忘れずにね」  \n👉 **confirm** = ✅「内容に間違いないと確認」\n\n---\n\n### 📖 読み方\n\ngenui{\"pronunciation_block_widget_v4_audio_fix_v2_realtime_audio_mini\":{\"content\":\"make sure\",\"pronunciation_hint\":\"メイク シュア\",\"pronunciation_language\":\"en\"}}\n\n**make sure** → **メイク・シュア**\n\n📌 会話で非常によく出るので、**「確認する」だけでなく「必ず～してね」**という意味も覚えておくのがポイントです。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「make sure」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「make sure」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「make sure」と「confirm」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 確かめる、確認する、必ず～するようにする\n\n**A2.** Make sure you turn off the lights before you leave.\n\n**A3.** 「make sure」は「確かめる、確認する、必ず～するようにする」という意味で、「confirm」は「確認する、確定する」です。→ すでにある情報・予定について、「これで間違いない」と確認する。make sure よりフォーマル。\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- ～を確かめる\n- ～を確認する\n- 必ず～する\n- ～するよう念を押す\n\n### 類義語とニュアンスの違い\n\n- **make sure**：確かめる、必ず～する  \n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3 mediately after**：直後に  \n  → **ほとんど時間を空けずに**起こる。not long after より時間的に近い。  \n  *Immediately after the meeting, he left.*  \n  → 会議の直後、彼は出て行った。\n\n### 🔑 ざっくり区別すると\n\n> **immediately after** → ⚡ 直後に  \n> **shortly after** → ⏱️ ほどなくして【ややフォーマル】  \n> **soon after** → 🕐 その後すぐに  \n> **not long after** → 🕐 **それほど経たないうちに**  \n> **a little later** → 🕑 少し後で\n\n### 対義語・反対の表現\n\n- **long after**：ずっと後に\n- **much later**：ずっと後で\n- **a long time later**：長い時間が経ってから\n- **long before**：ずっと前に\n\n---\n\n## C【イメージ記憶】\n\n🕐 **出来事Aから、それほど時間を空けずにBが起こる**\n\n```text\n出来事 A\n   ↓\n●────────●\n        出来事 B\n\n  長くは空いていない\n        ↓\n not long after\n```\n\n例えば、\n\n> 🎓 大学を卒業  \n> ↓  \n> ⏱️ それほど経たない  \n> ↓  \n> 💼 就職\n\n**Not long after graduating, he found a job.**\n\n👉 **卒業して間もなく、彼は仕事を見つけた。**\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **Not long after, he decided to resign.**\n\n**その後まもなく、彼は辞職することを決めました。**\n\n何か出来事が起こる  \n↓  \nそれほど時間が経たない  \n↓  \n📄 辞職を決意\n\n👉 **not long after = その後まもなく**\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **not long after = 「その後、長く経たないうちに」**\n\n### 📌 よく出る形\n\n**① Not long after, + 文**\n\n> **Not long after, she moved abroad.**  \n> その後まもなく、彼女は海外へ引っ越した。\n\n**② not long after + 名詞**\n\n> **Not long after the meeting, he called me.**  \n> 会議の後まもなく、彼は私に電話した。\n\n**③ not long after + ～ing**\n\n> **Not long after joining the company, he became a manager.**  \n> 入社して間もなく、彼は管理職になった。\n\n---\n\n## 📌 not long after と shortly after の違い\n\n### **not long after**\n→ **「それほど時間が経たないうちに」**という自然な語り口。\n\n> **Not long after, they got married.**  \n> その後まもなく、彼らは結婚した。\n\n### **shortly after**\n→ 意味はかなり近いが、**より簡潔で少しフォーマル**。\n\n> **Shortly after the announcement, the stock price rose.**  \n> 発表後まもなく、株価が上昇した。\n\n👉 **not long after** = 📖「それからそんなに経たないうちに」  \n👉 **shortly after** = 📰「その後まもなく」\n\n---\n\n### 📖 読み方\n\n**not long after** → **ノット・ロング・アフター**\n\n📌 単語をそのまま分解すると非常に覚えやすいです。\n\n> **not long** = 長くない  \n> **after** = ～の後  \n> ↓  \n> **「～の後、長く経たない」**  \n> ↓  \n> **「その後まもなく」**\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「not long after」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「not long after」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「not long after」と「shortly after」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** その後まもなく、それから間もなく、ほどなくして\n\n**A2.** Not long after, he decided to resign.\n\n**A3.** 「not long after」は「その後まもなく、それから間もなく、ほどなくして」、一方「shortly after」は「その直後・ほどなくして」です。 元の解説では、→ ほとんど時間を空けずに起こる。not long after より時間的に近い。\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- その後まもなく\n- それから間もなく\n- ～して間もなく\n- ほどなくして\n\n### 類義語とニュアンスの違い\n\n- **not long after**：その後まもなく  \n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Not long after』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Not long after → not long after\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. not long after**：その後まもなく\n2. Not long after, he moved to London.\n3. → not long after とかなり近い。**「比較的すぐ」という時間の近さ**をシンプルに表す。\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. not long after の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nnot long after ＝ Not long after\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_60">{"A": "【A｜単語・核】\nnotify\n読み・発音：—\n基本意味：Notify\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：Notify\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：notify ＝ Notify", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【単語】\n\n# **Notify**（**ノウティファイ**）\n\n**verb. 知らせる、通知する**\n\n👉 核となるイメージ：**「必要な情報を、相手に正式に知らせる」**\n\n---\n\n## B【日本語訳・類義語・対義語】\n\n### ① 人に知らせる・通知する\n\n- **notify employees**\n  → 従業員に通知する\n- **notify the police**\n  → 警察に知らせる\n- **notify customers of the change**\n  → 顧客に変更を知らせる\n\n### 類義語\n\n- **inform**：知らせる\n- **tell**：伝える、教える\n- **announce**：発表する\n- **alert**：警告する、注意を促す\n- **advise**：正式に知らせる\n\n### 対義語\n\n- **conceal**：隠す\n- **withhold**：情報を知らせずにおく\n- **hide**：隠す\n- **keep secret**：秘密にしておく\n\n💡 **notify** は **tell よりフォーマル**で、会社・役所・システムなどからの**「正式な通知」**によく使われる。\n\n---\n\n## C【イメージ記憶】\n\n📱 **「重要な情報があります！」と通知が届く**\n\n```text\n🏢 会社\n   │\n   │ 🔔「営業時間が変わります」\n   ↓\n📱 従業員\n   ↓\n情報を知る\n\n  notify\n```\n\n👉 **notify = 相手が知る必要のある情報を届ける**\n\nスマホの **notification（通知）** と結びつけると覚えやすい。\n\n> **notify** → 通知する  \n> **notification** → 通知\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **We will notify you when your order is ready.**\n\n**ご注文の準備ができましたら、お知らせします。**\n\n📦 準備完了  \n↓  \n🔔 お客さんに通知  \n↓  \n**notify**\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **notify = 必要な情報を正式に知らせる**\n\n### 📌 よく出る表現\n\n- **notify someone of ～**：人に～を知らせる\n- **notify someone about ～**：人に～について知らせる\n- **notify someone that ～**：人に～だと知らせる\n- **notify employees**：従業員に通知する\n- **notify customers**：顧客に通知する\n\n---\n\n## 📌 notify と inform の違い\n\n### **notify**\n→ **変更・決定・出来事などを正式に通知する**\n\n> **We notified customers of the change.**  \n> 顧客に変更を通知しました。\n\n### **inform**\n→ 相手に**情報を伝えて、知ってもらう**\n\n> **Please inform me of any changes.**  \n> 変更があれば知らせてください。\n\n👉 **notify** = 🔔「正式な通知」  \n👉 **inform** = 💬「情報を伝える」\n\n---\n\n### 📖 読み方\n\ngenui{\"pronunciation_block_widget_v4_audio_fix_v2_realtime_audio_mini\":{\"content\":\"notify\",\"pronunciation_hint\":\"ノウティファイ\",\"pronunciation_language\":\"en\"}}\n\n**notify** → **ノウティファイ**  \n発音：/ˈnoʊtɪfaɪ/\n\n📌 **「ノウ」**の部分を強く発音します。\n\n**note（知らせる・注意するイメージ）→ notify（知らせる）→ notification（通知）** とセットで覚えると定着しやすいです。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「notify」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「notify」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「notify」と「notify employees」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 知らせる、通知する\n\n**A2.** We will notify you when your order is ready.\n\n**A3.** 「notify」は「知らせる、通知する」という意味で、「notify employees」は「従業員に通知する」です。📌 notify と inform の違い\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### ① 人に知らせる・通知する\n\n- **notify employees**\n  → 従業員に通知する\n- **notify the police**\n  → 警察に知らせる\n- **notify customers of the change**\n  → 顧客に変更を知らせる\n\n### 類義語\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Notify』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Notify → notify\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. notify employees\n2. notify the police\n3. notify customers of the change\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. notify の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nnotify ＝ Notify\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_61">{"A": "【A｜単語・核】\nobtain\n読み・発音：—\n基本意味：Obtain\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：Obtain\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：obtain ＝ Obtain", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【単語】\n\n# **Obtain**（**アブテイン**）\n\n**verb. 手に入れる、取得する、獲得する**\n\n👉 核となるイメージ：**「努力・手続きなどを経て、必要なものを手に入れる」**\n\n---\n\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 手に入れる\n- 取得する\n- 獲得する\n\n### 類義語とニュアンスの違い\n\n- **get**：手に入れる  \n  → 最も一般的でカジュアル。入手方法は特に意識しない。  \n  *I got a new computer.*  \n  → 新しいパソコンを手に入れた。\n\n- **obtain**：取得する、手に入れる  \n  → **手続き・努力などを経て入手する**フォーマルな表現。  \n  *You need to obtain permission.*  \n  → 許可を得る必要があります。\n\n- **acquire**：獲得する、身につける  \n  → **時間をかけて自分のものにする**イメージ。知識・技術・会社などにもよく使う。  \n  *She acquired new skills.*  \n  → 彼女は新しいスキルを身につけた。\n\n- **gain**：得る、獲得する  \n  → **経験・知識・利益・信頼などが増えていく**イメージ。  \n  *He gained experience.*  \n  → 彼は経験を積んだ。\n\n- **receive**：受け取る  \n  → **誰かから送られたものを受け取る**ことに焦点がある。  \n  *I received an email.*  \n  → メールを受け取った。\n\n### 🔑 ざっくり区別すると\n\n> **get** → 🤲 とにかく「手に入れる」  \n> **obtain** → 📋 手続きなどをして「取得する」  \n> **acquire** → 🌱 時間をかけて「獲得する」  \n> **gain** → 📈 経験・利益などを「増やして得る」  \n> **receive** → 📩 誰かから「受け取る」\n\n### 対義語\n\n- **lose**：失う\n- **give up**：手放す、諦める\n- **forfeit**：権利などを失う\n\n---\n\n## C【イメージ記憶】\n\n📋 **必要なものを、手続きをしてGETする**\n\n```text\n🚗 運転したい\n      ↓\n📝 申請・試験\n      ↓\n     合格\n      ↓\n🪪 免許を取得！\n      ↓\n    obtain\n```\n\n単にポンと手に入るのではなく、\n\n> **必要な手順を踏む → 正式に手に入れる**\n\n👉 これが **obtain**\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **You must obtain approval before starting the project.**\n\n**プロジェクトを始める前に承認を得なければなりません。**\n\n📄 申請する  \n↓  \n👔 上司が確認  \n↓  \n✅ 承認を得る\n\n👉 **obtain approval = 承認を得る**\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **obtain = 努力・手続きを経て、必要なものを手に入れる**\n\n### 📌 よく出る表現\n\n- **obtain approval**：承認を得る\n- **obtain permission**：許可を得る\n- **obtain information**：情報を入手する\n- **obtain a license**：免許・資格を取得する\n- **obtain a visa**：ビザを取得する\n- **obtain evidence**：証拠を入手する\n\n---\n\n## 📌 obtain と get の違い\n\n### **get**\n日常会話で使う普通の「手に入れる」。\n\n> **I got a ticket.**  \n> チケットを手に入れた。\n\n### **obtain**\n**手続き・努力などを経て正式に取得する**感じで、ややフォーマル。\n\n> **You must obtain a visa.**  \n> ビザを取得しなければなりません。\n\n👉 日常会話なら **get**  \n👉 ビジネス・公的手続き・説明文なら **obtain**\n\n---\n\n### 📖 読み方\n\ngenui{\"pronunciation_block_widget_v4_audio_fix_v2_realtime_audio_mini\":{\"content\":\"obtain\",\"pronunciation_hint\":\"アブテイン\",\"pronunciation_language\":\"en\"}}\n\n**obtain** → **アブテイン**  \n発音：/əbˈteɪn/\n\n📌 後半の **「テイン」** を強く発音します。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「obtain」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「obtain」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「obtain」と「get」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 手に入れる、取得する、獲得する\n\n**A2.** You must obtain approval before starting the project.\n\n**A3.** 「obtain」は「手に入れる、取得する、獲得する」、一方「get」は「手に入れる」です。\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 手に入れる\n- 取得する\n- 獲得する\n\n### 類義語とニュアンスの違い\n\n- **get**：手に入れる  \n  → 最も一般的でカジュアル。入手方法は特に意識しない。  \n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Obtain』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Obtain → obtain\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. I got a new computer.\n2. obtain**：取得する、手に入れる\n3. You need to obtain permission.\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. obtain の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nobtain ＝ Obtain\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_62">{"A": "【A｜単語・核】\noccasion\n読み・発音：—\n基本意味：Occasion\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：Occasion\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：occasion ＝ Occasion", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【単語】\n\n# **Occasion**\n**noun. 機会、場合、特別な出来事**\n\n👉 核となるイメージ：**「ある出来事が起こる特定のタイミング」**\n\n---\n\n## B【日本語訳・関連語】\n\n### ① **機会・チャンス**\n- **on occasion**  \n  → 時々\n- **on one occasion**  \n  → ある時、一度\n- **take the occasion to ～**  \n  → この機会を利用して〜する\n\n### ② **特別な行事・出来事**\n- **a special occasion**  \n  → 特別な機会・祝い事\n- **a formal occasion**  \n  → 公式な場\n\n💡 **occasion** は **「いつでも」ではなく、特定のタイミング・場面**に焦点がある。\n\n---\n\n## C【イメージ記憶】\n\n📅 **特別な日・特定のタイミング**\n\n```text\n普段 ──────── 🎂 ──────── 普段\n                 ↑\n              occasion\n```\n\n誕生日や結婚式など、\n\n> 「今日は特別な日だ」\n\nというときの **occasion**。\n\n一方、\n\n### **on occasion**\n＝ **特定の機会に**\n→ そこから **時々**\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **We wear formal clothes on special occasions.**\n\n**私たちは特別な機会にはフォーマルな服を着ます。**\n\n---\n\n### 🔑 核を一言で覚えるなら\n\n> **occasion = ある特定のタイミング・場面**\n\n- **a special occasion** → 特別な機会\n- **on occasion** → 時々\n- **on this occasion** → 今回は、この機会に\n\n### **occasion と opportunity の違い**\n\n- **occasion**：ある**特定の出来事・場面**\n- **opportunity**：何かをするための**チャンス**\n\n> **a special occasion**  \n> → 特別な祝い事・場面\n\n> **a good opportunity**  \n> → 良い機会・チャンス\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「occasion」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「occasion」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「occasion」と「occasion」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 機会、場合、特別な出来事\n\n**A2.** We wear formal clothes on special occasions.\n\n**A3.** 「occasion」は「機会、場合、特別な出来事」という意味で、「occasion」は「ある特定のタイミング・場面」です。occasion と opportunity の違い\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・関連語】\n\n### ① **機会・チャンス**\n- **on occasion**  \n  → 時々\n- **on one occasion**  \n  → ある時、一度\n- **take the occasion to ～**  \n  → この機会を利用して〜する\n\n### ② **特別な行事・出来事**\n- **a special occasion**  \n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Occasion』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Occasion → occasion\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. on occasion\n2. on one occasion\n3. take the occasion to ～\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. occasion の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\noccasion ＝ Occasion\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_63">{"A": "【A｜単語・核】\noccur\n読み・発音：—\n基本意味：Occur\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：Occur\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：occur ＝ Occur", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【単語】\n\n# **Occur**（**アカー**）\n\n**verb. 起こる、発生する、生じる、（考えが）思い浮かぶ**\n\n📌 スペルは **occure ❌** ではなく、**occur ⭕️** です。\n\n👉 核となるイメージ：**「ある出来事・現象が発生する」**\n\n事故・問題・変化・自然現象などが**「起こる」**ときによく使います。\n\n---\n\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 起こる\n- 発生する\n- 生じる\n- 思い浮かぶ\n\n### 類義語とニュアンスの違い\n\n- **occur**：起こる、発生する  \n  → 出来事・事故・問題・現象などが**発生する**。**happen よりややフォーマル**。  \n  *The accident occurred at night.*  \n  → その事故は夜に発生した。\n\n- **happen**：起こる  \n  → 日常会話で最も一般的な「起こる」。良いこと・悪いことを問わず幅広く使える。  \n  *What happened?*  \n  → 何があったの？\n\n- **take place**：行われる、開催される  \n  → 会議・イベント・式典など、**予定・計画された出来事が行われる**ときによく使う。  \n  *The meeting will take place tomorrow.*  \n  → 会議は明日行われます。\n\n- **arise**：生じる、発生する  \n  → **問題・困難・必要性などが状況から生じる**ニュアンス。  \n  *A problem arose during the meeting.*  \n  → 会議中に問題が生じた。\n\n- **emerge**：現れる、明らかになる  \n  → それまで見えていなかった**問題・傾向・事実などが表面に出てくる**。  \n  *New problems emerged.*  \n  → 新たな問題が浮上した。\n\n### 🔑 ざっくり区別すると\n\n> **occur** → ⚠️ 出来事・現象が「発生する」  \n> **happen** → 💥 普通に「起こる」  \n> **take place** → 📅 予定されたことが「行われる」  \n> **arise** → 🌱 問題などが「生じる」  \n> **emerge** → 🌊 隠れていたものが「表面化する」\n\n### 対義語\n\n明確な対義語はありませんが、\n\n- **prevent**：防ぐ\n- **avoid**：避ける\n- **cease**：止む、終了する\n\nなどが反対のイメージです。\n\n---\n\n## C【イメージ記憶】\n\n⚠️ **何もなかったところに出来事が発生**\n\n```text\nいつもの道路\n🚗　🚙　🚕\n\n     ↓\n\n突然！\n🚗💥🚙\n\n事故が発生した\n     ↓\n   occur\n```\n\n👉 **occur = 出来事が「発生する」**\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **The accident occurred at around 10 p.m.**\n\n**その事故は午後10時ごろに発生しました。**\n\n普通に車が走っている  \n↓  \n💥 事故発生  \n↓  \n**An accident occurred.**\n\n📌 ニュース・報告書では **happen** より **occur** がよく使われます。\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **occur = 出来事・現象が発生する**\n\n### 📌 よく出る表現\n\n- **an accident occurs**：事故が発生する\n- **a problem occurs**：問題が発生する\n- **an error occurs**：エラーが発生する\n- **occur frequently**：頻繁に起こる\n- **occur naturally**：自然に発生する\n- **occur at ～**：～で／～時に発生する\n\n---\n\n## 📌 occur と happen の違い\n\n### **happen**\n→ 日常的な普通の**「起こる」**\n\n> **What happened yesterday?**  \n> 昨日何があったの？\n\n### **occur**\n→ **「発生する・生じる」**という少しフォーマルで客観的な表現。\n\n> **The accident occurred at 8 a.m.**  \n> 事故は午前8時に発生しました。\n\n👉 **happen** = 💬 会話的な「起こる」  \n👉 **occur** = 📰 報告・ニュース的な「発生する」\n\n---\n\n## ⚠️ もう一つ重要：**occur to 人**\n\n**occur to + 人** で、\n\n> **「人の頭にふと思い浮かぶ」**\n\nという意味になります。\n\n### **It occurred to me that I had forgotten my wallet.**\n\n**財布を忘れたことに、ふと気づいた。**\n\nイメージは、\n\n> 🧠 ← 💡  \n> 「あっ、そういえば！」\n\n### よく使う形\n\n> **It occurred to me that ～**  \n> → **ふと～だと気づいた／～という考えが思い浮かんだ**\n\n---\n\n### 📖 読み方\n\n**occur** → **アカー**  \n発音：/əˈkɜːr/\n\n📌 後半の **「カー」** を強く発音します。\n\nスペルにも注意です。\n\n> ❌ **occure**  \n> ⭕ **occur**  \n> ⭕ **occurred**（起こった）  \n> ⭕ **occurrence**（出来事・発生）\n\n特に **occur → occurred** では **r が2つになる**のもポイントです。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「occur」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「occur」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「occur」と「happen」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 起こる、発生する、生じる、（考えが）思い浮かぶ\n\n**A2.** The accident occurred at around 10 p.m.\n\n**A3.** 「occur」は「起こる、発生する、生じる、（考えが）思い浮かぶ」という意味で、「happen」は「起こる」です。→ 出来事・事故・問題・現象などが発生する。happen よりややフォーマル。\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 起こる\n- 発生する\n- 生じる\n- 思い浮かぶ\n\n### 類義語とニュアンスの違い\n\n- **occur**：起こる、発生する  \n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Occur』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Occur → occur\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. 📌 スペルは **occure ❌** ではなく、**occur ⭕️** です。\n2. occur**：起こる、発生する\n3. The accident occurred at night.\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. occur の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\no # ② ～のおかげである\n\n> **I owe my success to my family.**  \n> 私の成功は家族のおかげです。\n\n「成功について、家族に借りがある」\n\n↓　\n\n👉 **家族のおかげ**\n\nという感覚です。\n\n---\n\n### 類義語とニュアンスの違い\n\n- **owe**：借りている、支払う義務がある  \n  → **返すべきお金・恩などが残っている状態**に重点がある。  \n  *I owe you $20.*  \n  → あなたに20ドル借りています。\n\n- **borrow**：借りる  \n  → お金・物などを**相手から一時的に受け取る行為**に重点がある。  \n  *I borrowed $20 from him.*  \n  → 彼から20ドル借りました。\n\n- **be in debt**：借金がある  \n  → **借金を抱えている状態全体**を表す。  \n  *He is deeply in debt.*  \n  → 彼は多額の借金を抱えています。\n\n- **be obligated to**：～する義務がある  \n  → 契約・法律・道徳などによって**何かをする責任がある**。かなりフォーマル。  \n  *We are obligated to pay the fee.*  \n  → 私たちにはその料金を支払う義務があります。\n\n- **be indebted to**：～に恩義がある  \n  → お金よりも、誰かに**深く感謝・恩義を感じている**場合によく使う。  \n  *I'm deeply indebted to my teacher.*  \n  → 私は先生に深く恩義を感じています。\n\n### 🔑 ざっくり区別すると\n\n> **owe** → 💰 まだ返すものがある  \n> **borrow** → 🤲 借りるという行為  \n> **be in debt** → 💸 借金を抱えている  \n> **be obligated to** → 📋 ～する義務がある  \n> **be indebted to** → 🙏 ～に恩義がある\n\n### 対義語\n\n- **repay**：返済する\n- **pay back**：お金を返す\n- **settle**：借金・請求などを清算する\n- **be debt-free**：借金がない\n\n---\n\n## C【イメージ記憶】\n\n💰 **友達から1,000円借りた**\n\n```text\n👤 友達\n │\n │ 1,000円\n ↓\n🙋 自分\n\n「まだ返してない！」\n      ↓\n    I owe him\n     ¥1,000.\n```\n\nポイントは、\n\n> **「借りる瞬間」ではなく「まだ返していない状態」**\n\n👉 これが **owe**。\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **I owe you $50.**\n\n**私はあなたに50ドル借りています。**\n\n💵 以前50ドル借りた  \n↓  \nまだ返していない  \n↓  \n相手に50ドルを返す必要がある\n\n👉 **owe**\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **owe = 相手に「まだ返すべきもの」がある**\n\n### 📌 よく出る表現\n\n- **owe someone money**：人にお金を借りている\n- **owe $100**：100ドルの支払い義務がある\n- **owe money to ～**：～にお金を借りている\n- **owe A to B**：AはBのおかげである\n- **owe someone an apology**：人に謝るべきである\n- **owe someone a favor**：人に借り・恩がある\n\n特に、\n\n> **I owe you one.**\n\nは日常会話でよく使われ、\n\n**「恩に着るよ」「今度お返しするよ」**\n\nという意味になります。\n\n---\n\n## 📌 owe と borrow の違い\n\nここはかなり重要です。\n\n### **borrow**\n→ 🤲 **借りるという行為**\n\n> **I borrowed $100 from Tom.**  \n> トムから100ドル借りました。\n\n### **owe**\n→ 💰 **借りた結果、まだ返す義務がある状態**\n\n> **I owe Tom $100.**  \n> トムに100ドル借りています。\n\n時間の流れで考えると、\n\n> **borrow（借りる）**  \n> ↓  \n> 💰 まだ返していない  \n> ↓  \n> **owe（借りがある）**  \n> ↓  \n> **repay / pay back（返す）**\n\nと覚えると、とても分かりやすいです。\n\n---\n\n### 📖 読み方\n\n**owe** → **オウ**  \n発音：/oʊ/\n\n📌 **owe** の **w は発音しません**。\n\n> **owe → オウ**  \n> **own → オウン（所有する）**\n\nスペルが似ていますが、発音も意味も違うので注意です。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「owe」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「owe」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「owe」と「be indebted to」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** ～を借りている、～を支払う義務がある、～のおかげである\n\n**A2.** I owe you one.\n\n**A3.** 「owe」は「～を借りている、～を支払う義務がある、～のおかげである」、一方「be indebted to」は「～に恩義がある」です。\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### ① お金を借りている・支払う義務がある\n\n> **I owe him $100.**  \n> 私は彼に100ドル借りています。\n\n「100ドルを借りた」ではなく、\n\n👉 **今も100ドルを返す義務が残っている**という状態です。\n\n### ② ～のおかげである\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Owe』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Owe → owe\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. I owe him $100.\n2. I owe my success to my family.\n3. owe**：借りている、支払う義務がある\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. owe の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nowe ＝ Owe\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_68">{"A": "【A｜単語・核】\nparcel\n読み・発音：—\n基本意味：Parcel\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：Parcel\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：parcel ＝ Parcel", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【単語】\n\n# **Parcel**\n**noun. 小包、荷物、一区画**  \n**verb. 小包にする、分割する**\n\n👉 核となるイメージ： rb. ～するつもりである、～を予定している、～を見込んでいる**\n\n👉 核となるイメージ：**「～することを自分の計画に入れている」**\n\n単に「いつかやりたい」ではなく、**「そうするつもりで考えている」**というニュアンスです。\n\n---\n\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- ～するつもりである\n- ～を予定している\n- ～を計画に入れている\n- ～を見込んでいる\n\n### 類義語とニュアンスの違い\n\n- **plan on ～ing**：～するつもりでいる  \n  → **自分の予定・計画として考えている**。会話でよく使う。  \n  *I plan on staying here for a week.*  \n  → ここに1週間滞在するつもりです。\n\n- **plan to do**：～する予定である  \n  → **具体的に～する計画がある**という最も標準的な表現。  \n  *I plan to visit Osaka next week.*  \n  → 来週大阪を訪れる予定です。\n\n- **intend to do**：～する意図がある  \n  → **「そうする意思がある」ことに重点**。planよりややフォーマル。  \n  *I intend to finish the work today.*  \n  → 今日その仕事を終えるつもりです。\n\n- **be going to do**：～するつもりだ  \n  → すでに決めている**近い将来の予定**を日常会話で表す。  \n  *I'm going to study tonight.*  \n  → 今夜勉強するつもりです。\n\n- **expect to do**：～する見込みである  \n  → 自分の意思よりも、状況から**「おそらくそうなる」**という予想に重点がある。  \n  *We expect to finish by Friday.*  \n  → 金曜日までに終わる見込みです。\n\n### 🔑 ざっくり区別すると\n\n> **plan on ～ing** → 📅 計画に入れている  \n> **plan to do** → 📝 ～する計画がある  \n> **intend to do** → 🎯 ～する意思がある  \n> **be going to do** → 🗣️ ～するつもり  \n> **expect to do** → 📈 ～する見込み\n\n### 対義語・反対の表現\n\n- **have no plans to ～**：～する予定はない\n- **decide against ～ing**：～しないことに決める\n- **cancel plans to ～**：～する計画を中止する\n- **avoid ～ing**：～するのを避ける\n\n---\n\n## C【イメージ記憶】\n\n📅 **予定表の中に入れておく**\n\n```text\n来週の予定 📅\n\n月　仕事\n火　仕事\n水　ジム\n木　仕事\n金　旅行 ✈️\n      ↑\n「旅行するつもり」\n      ↓\nplan on traveling\n```\n\n👉 **plan on ～ = ～を自分の計画の中に置いている**\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **I plan on staying there for three days.**\n\n**そこに3日間滞在するつもりです。**\n\n旅行を考える  \n↓  \n🏨 3泊する予定を立てる  \n↓  \n📅 自分の計画に入れる\n\n👉 **plan on staying**\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **plan on ～ = ～することを計画に入れている**\n\n### 📌 重要な文型\n\n**① plan on + ～ing**\n\n> **I plan on buying a new car.**  \n> 新しい車を買うつもりです。\n\n📌 **on の後なので動名詞（～ing）**になります。\n\n❌ **plan on buy**  \n⭕ **plan on buying**\n\n---\n\n**② plan on + 名詞**\n\n> **We're planning on a trip to Kyoto.**  \n> 京都旅行を計画しています。\n\n---\n\n**③ plan on + 人・物 + ～ing**\n\n> **I didn't plan on him coming.**  \n> 彼が来るとは思っていませんでした。\n\nここでは **plan on = ～を想定する** に近い意味になります。\n\n---\n\n## 📌 plan on と plan to の違い\n\nこの2つは意味がかなり近いです。\n\n### **plan to + 動詞**\n→ **「～する計画がある」**という標準的な言い方。\n\n> **I plan to move next year.**  \n> 来年引っ越す予定です。\n\n### **plan on + ～ing**\n→ **「～するつもりで考えている」**という、やや会話的な表現。\n\n> **I plan on moving next year.**  \n> 来年引っ越すつもりです。\n\n👉 **plan to do** = 📝「～する予定だ」  \n👉 **plan on doing** = 📅「～するつもりで考えている」\n\n実際には、かなりの場面で置き換え可能です。\n\n---\n\n## ⚠️ plan on には「見込む」の意味もある\n\n### **We didn't plan on this many people coming.**\n\n**こんなに多くの人が来るとは想定していませんでした。**\n\nこの場合は、\n\n> **plan on = 計画する**\n\nというより、\n\n> **「～が起こることを計算に入れる・見込む」**\n\nという意味。\n\n👉 **plan on = 予定する → 計算に入れておく**\n\nという核のイメージは同じです。\n\n---\n\n### 📖 読み方\n\n**plan on** → **プラン・オン**  \n発音：/plæn ɑːn/\n\n📌 まずはこの形をそのまま覚えるのがおすすめです。\n\n> **plan to do**  \n> **plan on doing**\n\n**to の後 → 動詞の原形**  \n**on の後 → ～ing**\n\nこの違いが重要です。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「plan on」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「plan on」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「plan on」と「intend to do」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** ～するつもりである、～を予定している、～を見込んでいる\n\n**A2.** I plan on staying there for three days.\n\n**A3.** 「plan on」は「～するつもりである、～を予定している、～を見込んでいる」、一方「intend to do」は「～する意図がある」です。\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n単に「いつかやりたい」ではなく、**「そうするつもりで考えている」**というニュアンスです。\n\n---\n\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- ～するつもりである\n- ～を予定している\n- ～を計画に入れている\n- ～を見込んでいる\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Plan on ～』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Plan on ～ → plan on\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. plan on ～ing**：～するつもりでいる\n2. I plan on staying procedure**。\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **Please follow the correct procedure.**\n\n**正しい手順に従ってください。**\n\n📌 ビジネスでは特によく使われる表現です。\n\n- **follow the procedure**：手順に従う\n- **change the procedure**：手順を変更する\n- **safety procedures**：安全手順\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **procedure = 決められた順番・手続き**\n\n### 📌 よく出る表現\n\n- **application procedure** → 申請手続き\n- **reimbursement procedure** → 精算手続き\n- **safety procedure** → 安全手順\n- **follow the procedure** → 手順に従う\n\n---\n\n## 📌 **procedure と process の違い**\n\n- **procedure**：**「どうやるか」という決められた手順・ルール**\n  - *Please follow the procedure.*\n  - （手順に従ってください。）\n\n- **process**：**「物事が進む流れ・工程全体」**\n  - *The hiring process takes about two weeks.*\n  - （採用プロセスには約2週間かかります。）\n\n### 覚え方\n\n- 📋 **procedure** = **手順書・マニュアル**\n- 🔄 **process** = **最初から最後までの流れ・工程**\n\n今回の文にあった\n\n> **There has been a change in the procedure for reimbursement of travel expenses.**\n\nは、\n\n> **旅費精算の手続き（やり方・流れ）が変更されました。**\n\nという意味になります。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「procedure」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「procedure」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「procedure」と「process」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 手順、手続き、方法\n\n**A2.** Please follow the correct procedure.\n\n**A3.** 「procedure」は「手順、手続き、方法」、一方「process」は「工程、流れ」です。\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### ① 手順\n\n- **follow the procedure**\n  → 手順に従う\n- **standard operating procedure (SOP)**\n  → 標準作業手順\n\n### ② 手続き\n\n- **application procedure**\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Procedure』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Procedure → procedure\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. follow the proce > **field** → 🎓 学問・仕事の「専門分野」  \n> **area** → 📍 一般的な「分野・範囲」  \n> **domain** → 🏛️ 専門的な「領域」  \n> **sphere** → ⭕ 活動・影響が及ぶ「範囲」\n\n### 対義語\n\n**realm** 自体には明確な対義語はありませんが、\n\n- **outside**：外部\n- **beyond**：範囲を超えて\n- **outside the realm of ～**：～の領域外で\n\nなどが対照的な表現です。\n\n---\n\n## C【イメージ記憶】\n\n🏰 **それぞれ別々の「世界」がある**\n\n```text\n┌─────────────┐\n│  🎨 ART     │\n│             │\n│ 芸術の世界   │\n└─────────────┘\n       ↓\n realm of art\n```\n\nその枠の中には、\n\n🎨 絵画  \n🎵 音楽  \n🎭 演劇\n\nなどが存在している。\n\n👉 **realm = あるものが属している「ひとつの世界・領域」**\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **AI is expanding into the realm of art.**\n\n**AIは芸術の領域にも広がっています。**\n\n🤖 AIの世界  \n↓  \n🎨 芸術の世界へ  \n↓  \n**the realm of art**\n\n👉 「芸術という一つの世界・領域」という感覚です。\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **realm = あるものが属する「世界・領域」**\n\n### 📌 よく出る表現\n\n- **the realm of science**：科学の領域\n- **the realm of politics**：政治の世界\n- **the realm of possibility**：可能性の範囲\n- **within the realm of ～**：～の領域内で\n- **outside the realm of ～**：～の領域外で\n- **in the realm of ～**：～の分野では\n\n---\n\n## 📌 realm と field の違い\n\n### **field**\n→ **仕事・研究・学問などの具体的な専門分野**\n\n> **He is an expert in the field of AI.**  \n> 彼はAI分野の専門家です。\n\n### **realm**\n→ もっと広く、**「～という世界・領域」**と捉える表現。\n\n> **AI has entered the realm of creative art.**  \n> AIは創造芸術の世界に進出しました。\n\n👉 **field** = 🎓「専門分野」  \n👉 **realm** = 🌎「ひとつの世界・領域」\n\n**realm** のほうが少し抽象的で、「世界」という感覚が強いです。\n\n---\n\n### 📖 読み方\n\ngenui{\"pronunciation_block_widget_v4_audio_fix_v2_realtime_audio_mini\":{\"content\":\"realm\",\"pronunciation_hint\":\"レルム\",\"pronunciation_language\":\"en\"}}\n\n**realm** → **レルム**  \n発音：/relm/\n\n📌 **realm** の **a はほぼ発音しません**。\n\nまた、もともと **「王国」**という意味があるので、\n\n> 🏰 **王国 = ひとつの支配された世界**  \n> ↓  \n> 🌎 **ある分野の世界・領域**\n\nとイメージすると、「領域」という意味も覚えやすいです。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「realm」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「realm」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「realm」と「sphere」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 領域、分野、世界、王国\n\n**A2.** AI is expanding into the nager.**\n\n**私は上司に承認を求めました。**\n\n📌 **request + 名詞**\n\n> **request approval**  \n> 承認を求める\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **request = 「お願いします」と正式に求める**\n\n### 📌 よく出る表現\n\n- **request approval**：承認を求める\n- **request information**：情報を求める\n- **request permission**：許可を求める\n- **make a request**：依頼する\n- **at someone's request**：～の依頼で\n- **upon request**：要望に応じて\n\n---\n\n## 📌 request と require の違い\n\nこの2つはかなり重要。\n\n**request**  \n→ 相手に**「お願いします」**\n\n> **The employee requested approval.**  \n> 従業員は承認を求めた。\n\n**require**  \n→ **「必須です・必要です」**\n\n> **The company requires approval.**  \n> 会社は承認を必須としている。\n\nイメージにすると、\n\n> 🙏 **request = お願いする**  \n> 📋 **require = 必須にする**\n\n---\n\n### 📖 読み方\n\ngenui{\"pronunciation_block_widget_v4_audio_fix_v2_realtime_audio_mini\":{\"content\":\"request\",\"pronunciation_hint\":\"リクエスト\",\"pronunciation_language\":\"en\"}}\n\n**request** → **リクエスト**  \n発音：/rɪˈkwest/\n\n📌 **「クエ」**の部分を強めに発音します。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「request」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「request」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「request」と「make a request」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 要求、依頼、要請\n\n**A2.** I requested approval from my manager.\n\n**A3.** 「request」は「要求、依頼、要請」という意味で、「make a request」は「依頼する」です。📌 request と require の違い\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 依頼する\n- 要請する\n- 求める\n- 依頼、要請\n\n### 類義語\n\n- **ask**：頼む、尋ねる\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Request』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Request → request\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. 💡 **request** は **ask よりフォーマルな「お願いします」**というイメージ。\n2. 👉 **request = 相手に何かをしてもらうよう求める\n3. - 辞任する\n\n### 類義語とニュアンスの違い\n\n- **resign**：辞職する、辞任する  \n  → **自分の意思で正式に仕事・役職を辞める**。ビジネスやニュースでよく使うフォーマルな表現。  \n  *He resigned as president.*  \n  → 彼は社長を辞任した。\n\n- **quit**：辞める  \n  → **仕事・学校・習慣などをやめる**日常的な表現。resignよりカジュアル。  \n  *I quit my job.*  \n  → 仕事を辞めました。\n\n- **retire**：退職する、引退する  \n  → **年齢やキャリアの終了を理由に仕事を離れる**イメージ。  \n  *He retired at the age of 65.*  \n  → 彼は65歳で退職した。\n\n- **step down**：辞任する、退く  \n  → **重要な役職・地位から身を引く**ことに重点がある。ニュースでもよく使う。  \n  *The CEO decided to step down.*  \n  → CEOは辞任することを決めた。\n\n- **leave**：辞める、去る  \n  → 「その会社・組織を離れる」という**中立的で柔らかい表現**。  \n  *She left the company last year.*  \n  → 彼女は昨年会社を辞めました。\n\n### 🔑 ざっくり区別すると\n\n> **resign** → 📄 正式に「辞職・辞任する」  \n> **quit** → 🚪 普通に「辞める」  \n> **retire** → 👴 キャリアを終えて「退職・引退する」  \n> **step down** → 👔 役職から「身を引く」  \n> **leave** → 👋 会社・組織を「離れる」\n\n### 対義語\n\n- **join**：加わる、入社する\n- **accept a position**：役職を引き受ける\n- **take office**：就任する\n- **remain in office**：職にとどまる\n\n---\n\n## C【イメージ記憶】\n\n👔 **自分から役職を手放す**\n\n```text\n👔 CEO\n  ↓\n📄「辞任します」\n  ↓\n役職を手放す\n  ↓\n👋\nresign\n```\n\n会社から「クビです」と言われるのではなく、\n\n> **「自分から辞めます」**\n\n👉 これが **resign**\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **He resigned from the company last month.**\n\n**彼は先月、その会社を退職しました。**\n\n🙋「会社を辞めます」  \n↓  \n📄 正式に退職  \n↓  \n👋 会社を離れる\n\n👉 **resign from ～ = ～を辞職・退職する**\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **resign = 自分の意思で正式に仕事・役職を手放す**\n\n### 📌 よく出る表現\n\n- **resign from a company**：会社を退職する\n- **resign from one's position**：役職を辞任する\n- **resign as CEO**：CEOを辞任する\n- **resign as president**：社長・大統領などを辞任する\n- **decide to resign**：辞任を決める\n- **be forced to resign**：辞任を余儀なくされる\n- **resignation**：辞職、辞任、退職\n\n---\n\n## 📌 resign と fire の違い\n\nここは重要です。\n\n### **resign**\n→ **自分から辞める**\n\n> **The CEO resigned.**  \n> CEOは辞任した。\n\n### **fire**\n→ **会社側がその人を辞めさせる**\n\n> **The company fired the manager.**  \n> 会社はその管理職を解雇した。\n\nつまり、\n\n> 🙋 → 🚪 **resign** = 自分から辞める  \n> 🏢 → 🙋🚪 **fire** = 会社から辞めさせられる\n\n---\n\n## ⚠️ resign と re-sign は別物\n\nスペルが非常に紛らわしいです。\n\n**resign**  \n→ **辞職する**\n\n**re-sign**  \n→ **再契約する、再び署名する**\n\n> **The player resigned.**  \n> 選手は辞任・退団した。\n\n> **The player re-signed with the team.**  \n> 選手はそのチームと再契約した。\n\n**ハイフン1つで意味がほぼ逆方向になる**ので注意です。\n\n---\n\n### 📖 読み方\n\n**resign** → **リザイン**  \n発音：/rɪˈzaɪn/\n\n📌 **g は発音しません。**\n\n> **resign** → リザイン  \n> **resignation** → レジグネイション（辞職・辞任）\n\n**sign（サインする）**とは発音が違い、**resign の s は「ズ」の音**になるのがポイントです。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「resign」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「resign」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「resign」と「decide to resign」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 辞職する、退職する、辞任する\n\n**A2.** He resigned from the company last month.\n\n**A3.** 「resign」は「辞職する、退職する、辞任する」という意味で、「decide to resign」は「辞任を決める」です。📌 resign と fire の違い\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 辞職する\n- 退職する\n- 辞任する\n\n### 類義語とニュアンスの違い\n\n- **resign**：辞職する、辞任する  \n  → **自分の意思で正式に仕事・役職を辞める**。ビジネスやニュースでよく使うフォーマルな表現。  \n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Resign』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Resign → resign\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. resign**：辞職する、辞任する\n2. He resigned as president.\n3. → **仕事・学校・習慣などをやめる**日常的な表現。resignよりカジュアル。\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. resign の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nresign ＝ Resign\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_84">{"A": "【A｜単語・核】\nretrieve\n読み・発音：—\n基本意味：retrieve\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：retrieve\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：retrieve ＝ ret る\n- 回復させる\n- よみがえる\n- 再び活気づける\n\n### 類義語とニュアンスの違い\n\n- **revive**：復活させる、よみがえる  \n  → **弱った・廃れた・止まったものに、再び活気を戻す**。人だけでなく、経済・文化・記憶などにも使える。  \n  *The new project revived the local economy.*  \n  → 新しいプロジェクトが地域経済を復活させた。\n\n- **recover**：回復する  \n  → 病気・損失・悪い状態などから**元の正常な状態に戻る**ことに重点。  \n  *He recovered from his illness.*  \n  → 彼は病気から回復した。\n\n- **restore**：元の状態に戻す  \n  → 壊れたり失われたりしたものを**以前の良い状態に戻す**。建物・データ・秩序などにも使う。  \n  *They restored the old building.*  \n  → 彼らは古い建物を修復した。\n\n- **resurrect**：復活させる、よみがえらせる  \n  → **死んだものを生き返らせる**という強い意味。比喩的に、完全に消えた計画などの復活にも使う。  \n  *They resurrected the old plan.*  \n  → 彼らは昔の計画を復活させた。\n\n- **renew**：新しくする、再開する  \n  → 古くなったものを**新しい状態にする・期間を延長する**。  \n  *I renewed my membership.*  \n  → 会員資格を更新した。\n\n### 🔑 ざっくり区別すると\n\n> **revive** → 🌱 活気・命を取り戻して「復活」  \n> **recover** → ❤️‍🩹 悪い状態から「回復」  \n> **restore** → 🔧 元の状態に「戻す」  \n> **resurrect** → ⚰️➡️🧍 死んだ・消えたものを「復活」  \n> **renew** → ✨ 古いものを「新しくする・更新する」\n\n### 対義語\n\n- **decline**：衰える、衰退する\n- **weaken**：弱まる\n- **deteriorate**：悪化する\n- **kill**：殺す\n- **suppress**：抑える、鎮圧する\n\n---\n\n## C【イメージ記憶】\n\n🥀 **しおれていた花に、もう一度元気が戻る**\n\n```text\n🥀 元気がない\n     ↓\n    💧☀️\n     ↓\n   🌷✨\n「元気が戻った！」\n     ↓\n   revive\n```\n\n👉 **revive = 一度弱ったものに、もう一度生命・活気を吹き込む**\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **The festival helped revive the local economy.**\n\n**その祭りは地域経済の復活に役立ちました。**\n\n📉 お客さんが減る  \n↓  \n🎆 お祭りを開催  \n↓  \n👨‍👩‍👧‍👦 人が戻ってくる  \n↓  \n📈 お店が活気づく\n\n👉 **revive the economy = 経済を再び活気づける**\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **revive = 弱ったものに、もう一度「命・活気」を戻す**\n\n### 📌 よく出る表現\n\n- **revive the economy**：経済を復活させる\n- **revive a tradition**：伝統を復活させる\n- **revive an old plan**：昔の計画を復活させる\n- **revive interest in ～**：～への関心を再び高める\n- **revive memories**：記憶をよみがえらせる\n- **revive a person**：人を意識回復させる\n\n---\n\n## 📌 revive と recover の違い\n\n### **revive**\n→ **一度弱った・止まったものが再び活気を取り戻す**\n\n> **Tourism revived after the pandemic.**  \n> パンデミック後、観光業が復活した。\n\n### **recover**\n→ **悪い状態から正常な状態へ回復する**\n\n> **The economy is recovering.**  \n> 経済は回復しつ

n\n場面 → 状態を言葉にする → Shave → shave\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. shave my face\n2. shave my beard\n3. shave my legs\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. shave の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nshave ＝ Shave\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_90">{"A": "【A｜単語・核】\nsignificance\n読み・発音：—\n基本意味：Significance\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：Significance\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：significance ＝ Significance", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【単語】\n\n# **Significance**（**シグニフィカンス**）\n\n**noun. 重要性、意義、意味**\n\n👉 核となるイメージ：**「その物事が、どれくらい重要な意味・価値を持っているか」**\n\n---\n\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 重要性\n- 意義\n- 意味\n- 重大さ\n\n### 類義語とニュアンスの違い\n\n- **significance**：重要性、意義  \n  → 単に「重要」ではなく、**その物事が持つ意味や影響まで含めた重要性**。  \n  *We didn't understand the significance of the discovery.*  \n  → 私たちはその発見の重要性を理解していなかった。\n\n- **importance**：重要性  \n  → 最も一般的な「重要性」。**どれくらい大切か**に焦点がある。  \n  *We understand the importance of teamwork.*  \n  → 私たちはチームワークの重要性を理解しています。\n\n- **meaning**：意味  \n  → 言葉・行動・出来事が**何を表しているのか**に焦点がある。  \n  *What is the meaning of this word?*  \n  → この単語の意味は何ですか？\n\n- **value**：価値  \n  → 物事が**どれくらい役立つ・価値があるか**に重点がある。  \n  *This experience has great value.*  \n  → この経験には大きな価値があります。\n\n- **impact**：影響  \n  → 物事が人・社会などに**どれほど大きな変化を与えるか**に焦点がある。  \n  *The decision had a major impact on the company.*  \n  → その決定は会社に大きな影響を与えた。\n\n### 🔑 ざっくり区別すると\n\n> **significance** → 💡「どんな重要な意味・意義があるか」  \n> **importance** → ⭐「どれくらい重要か」  \n> **meaning** → 📖「何を意味するか」  \n> **value** → 💎「どれくらい価値があるか」  \n> **impact** → 💥「どれくらい影響を与えるか」\n\n### 対義語\n\n- **insignificance**：重要でないこと\n- **unimportance**：重要でないこと\n- **triviality**：ささいなこと\n- **meaninglessness**：無意味さ\n\n---\n\n## C【イメージ記憶】\n\n📜 一見すると「ただの出来事」でも……\n\n```text\n    ある発見 🔍\n       ↓\n「これって何がすごいの？」\n       ↓\n社会を大きく変える可能性！\n       ↓\n  💡 significance\n   重要な意味・意義\n```\n\n👉 **表面的な出来事の奥にある「重要な意味・価値」**\n\nこれが **significance**。\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **At first, nobody understood the significance of the discovery.**\n\n**最初は、誰もその発見の重要性を理解していませんでした。**\n\n🔬 新しい発見  \n↓  \n最初は「ふーん」  \n↓  \n後に大発明につながる  \n↓  \n😲「こんなに重要な発見だったのか！」\n\n👉 その発見が持っていた**重要な意味・意義** = **significance**\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **significance = その物事が持つ「重要な意味・意義」**\n\n### 📌 よく出る表現\n\n- **the significance of ～**：～の重要性・意義\n- **historical significance**：歴史的意義\n- **cultural significance**：文化的意義\n- **great significance**：大きな重要性\n- **be of significance**：重要である\n- **statistical significance**：統計的有意性\n\n---\n\n## 📌 significance と importance の違い\n\n### **importance**\n→ シンプルに**「どれくらい大切か」**\n\n> **the importance of exercise**  \n> 運動の重要性\n\n### **significance**\n→ **「その物事にはどんな重要な意味・意義があるのか」**\n\n> **the historical significance of the event**  \n> その出来事の歴史的意義\n\n👉 **importance** = ⭐ **重要度**  \n👉 **significance** = 💡 **重要な意味・意義**\n\nたとえば歴史的な出来事について、\n\n> 「これは重要です」→ **importance**  \n> 「これは後の社会を変えたという重要な意味があります」→ **significance**\n\nという感覚です。\n\n---\n\n### 📖 読み方\n\ngenui{\"pronunciation_block_widget_v4_audio_fix_v2_realtime_audio_mini\":{\"content\":\"significance\",\"pronunciation_hint\":\"シグニフィカンス\",\"pronunciation_language\":\"en\"}}\n\n**significance** → **シグニフィカンス**  \n発音：/sɪɡˈnɪfɪkəns/\n\n📌 関連語をセットで覚えると便利です。\n\n> **significant** → 重要な・重大な  \n> **significance** → 重要性・意義  \n> **insignificant** → 重要でない・取るに足らない\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「significance」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「significance」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「significance」と「great significance」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 重要性、意義、意味\n\n**A2.** At first, nobody understood the significance of the discovery.\n\n**A3.** 「significance」は「重要性、意義、意味」という意味で、「great significance」は「大きな重要性」です。📌 significance と importance の違い\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 重要性\n- 意義\n- 意味\n- 重大さ\n\n### 類義語とニュアンスの違い\n\n- **significance**：重要性、意義  \n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Significance』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Significance → significance\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. significance**：重要性、意義\n2. We didn't understand the significance of the discovery.\n3. We understand the importance of teamwork.\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. significance の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nsignificance ＝ Significance\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_91">{"A": "【A｜単語・核】\nsignify\n読み・発音：—\n基本意味：Signify\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：Signify\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：signify ＝ Signify", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【単語】\n\n# **Signify**（**シグニファイ**）\n\n**verb. 意味する、示す、表す**\n\n👉 核となるイメージ：**「あるサインが、何かの意味を示している」**\n\n---\n\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- ～を意味する\n- ～を示す\n- ～を表す\n\n### 類義語とニュアンスの違い\n\n- **signify**：意味する、示す  \n  → ある物・行動・変化などが、**「何らかの意味を持っている・何かを示している」**というややフォーマルな表現。  \n  *A red light signifies danger.*  \n  → 赤い光は危険を意味します。\n\n- **mean**：意味する  \n  → 最も一般的な「～という意味である」。**言葉の意味から行動の意味まで幅広く使える**。  \n  *What does this word mean?*  \n  → この単語はどういう意味ですか？\n\n- **indicate**：示す、指し示す  \n  → データ・兆候などが、**ある事実や状態を示している**ことに重点がある。  \n  *The data indicates an increase in sales.*  \n  → データは売上の増加を示しています。\n\n- **represent**：表す、象徴する  \n  → あるものが**別のものの代わり・象徴として表している**。  \n  *The dove represents peace.*  \n  → ハトは平和を象徴しています。\n\n- **symbolize**：象徴する  \n  → 色・物・人物などが、**抽象的な考えや価値を象徴する**。  \n  *White symbolizes purity.*  \n  → 白は純粋さを象徴します。\n\n### 🔑 ざっくり区別すると\n\n> **signify** → 💡 それが「ある意味を持つ・示す」  \n> **mean** → 💬 普通に「意味する」  \n> **indicate** → 📊 データ・兆候が「示す」  \n> **represent** → 🖼️ 何かを「表す・代表する」  \n> **symbolize** → 🕊️ 抽象的なものを「象徴する」\n\n### 対義語\n\n明確な対義語は少ないですが、\n\n- **conceal**：隠す\n- **obscure**：意味などを分かりにくくする\n- **misrepresent**：誤って表現する\n\nなどが反対のイメージです。\n\n---\n\n## C【イメージ記憶】\n\n🚦 **赤信号が「止まれ」という意味を持つ**\n\n```text\n       🔴\n       ↓\n「この赤は何を意味する？」\n       ↓\n     🛑 STOP\n       ↓\n     signify\n```\n\n赤色そのものではなく、\n\n> 🔴 → **「止まれ・危険」という意味を示している**\n\n👉 これが **signify**\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **A red light usually signifies danger.**\n\n**赤い光は通常、危険を意味します。**\n\n🔴 赤い光  \n↓  \n⚠️ 危険のサイン  \n↓  \n**signify danger**\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **signify = サインとして「～を意味する・示す」**\n\n### 📌 よく出る表現\n\n- **signify a change**：変化を意味する\n- **signify approval**：承認を示す\n- **signify agreement**：同意を示す\n- **signify the beginning of ～**：～の始まりを意味する\n- **What does ～ signify?**：～は何を意味しますか？\n\n---\n\n## 📌 signify と mean の違い\n\n### **mean**\n→ 最も普通の**「意味する」**\n\n> **What does this word mean?**  \n> この単語はどういう意味ですか？\n\n### **signify**\n→ 物・行動・出来事などが**「何かのサインとして意味を持つ」**。ややフォーマル。\n\n> **His silence signified agreement.**  \n> 彼の沈黙は同意を意味していた。\n\n👉 **mean** = 💬 普通に「意味する」  \n👉 **signify** = 🚦 **何かがサインとなって意味を示す**\n\n---\n\n## 🌱 significant・significance とのつながり\n\nこの3つはセットで覚えると分かりやすいです。\n\n> **signify** → 意味する・示す【動詞】  \n> **significant** → 意味がある → **重要な**【形容詞】  \n> **significance** → 意味があること → **重要性・意義**【名詞】\n\nつまり、\n\n**「意味を持つ」→「意味がある」→「重要である」**\n\nという感覚でつながっています。\n\n---\n\n### 📖 読み方\n\ngenui{\"pronunciation_block_widget_v4_audio_fix_v2_realtime_audio_mini\":{\"content\":\"signify\",\"pronunciation_hint\":\"シグニファイ\",\"pronunciation_language\":\"en\"}}\n\n**signify** → **シグニファイ**  \n発音：/ˈsɪɡnɪfaɪ/\n\n📌 最後の **-fy** は「ファイ ---\n\n## 📌 slightly と a little の違い\n\n**slightly** は、**客観的な小さな差・変化**を表すのが得意。\n\n> **Sales increased slightly.**  \n> 売上がわずかに増加した。\n\n**a little** はもっと日常的で、**感情や状態にも自然に使える**。\n\n> **I'm a little nervous.**  \n> 少し緊張しています。\n\n👉 **slightly** = 📊「わずかに」  \n👉 **a little** = 💬「ちょっと・少し」\n\n---\n\n### 📖 読み方\n\ngenui{\"pronunciation_block_widget_v4_audio_fix_v2_realtime_audio_mini\":{\"content\":\"slightly\",\"pronunciation_hint\":\"スライトリー\",\"pronunciation_language\":\"en\"}}\n\n**slightly** → **スライトリー**  \n発音：/ˈslaɪtli/\n\n📌 **slight（わずかな）＋ -ly → slightly（わずかに）** とセットで覚えると簡単です。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「slightly」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「slightly」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「slightly」と「slightly」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** わずかに、少し、ほんの少し\n\n**A2.** The new model is slightly faster than the old one.\n\n**A3.** 「slightly」は「わずかに、少し、ほんの少し」という意味で、「slightly」は「違い・程度がほんの少し」です。slightly = 違い・程度がほんの少し\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 少し\n- わずかに\n- ほんの少し\n\n### 類義語とニュアンスの違い\n\n- **slightly**：わずかに  \n  → **程度や変化が小さい**ことを表す。比較・数値・状態の変化によく使う。  \n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Slightly』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Slightly → slightly\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. slightly**：わずかに\n2. The price increased slightly.\n3. I'm a little tired.\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. slightly の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nslightly ＝ Slightly\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/j e**（**ストライク**）\n\n**verb. 打つ、襲う、ぶつかる、（考えが）ふと思い浮かぶ**  \n**noun. ストライキ、攻撃、一撃**\n\n👉 核となるイメージ：**「何かに強く・突然ぶつかる」**\n\nこのイメージから、**「打つ → 襲う → 心に響く → ストライキをする」**など、かなり多くの意味に広がります。\n\n---\n\n## B【日本語訳・類義語・対義語】\n\n### ① 打つ・たたく\n\n> **He struck the ball.**  \n> 彼はボールを打った。\n\n### ② 災害・病気などが襲う\n\n> **The earthquake struck the city.**  \n> 地震がその街を襲った。\n\n### ③ ふと思いつく・印象を与える\n\n> **An idea suddenly struck me.**  \n> ある考えが突然思い浮かんだ。\n\n### ④ ストライキをする\n\n> **The workers went on strike.**  \n> 労働者たちはストライキに入った。\n\n---\n\n### 類義語とニュアンスの違い\n\n- **strike**：強く打つ・突然襲う  \n  → **強さや突然の衝撃**を感じさせる言葉。物理的な打撃だけでなく、災害・感情などにも使える。  \n  *Lightning struck the tree.*  \n  → 雷が木に落ちた。\n\n- **hit**：打つ、ぶつかる  \n  → 日常会話で最も一般的な「打つ・当たる」。**strikeより幅広くカジュアル**。  \n  *The ball hit the window.*  \n  → ボールが窓に当たった。\n\n- **beat**：何度もたたく  \n  → **繰り返し打つ**ことに重点がある。また「相手を負かす」の意味もある。  \n  *He beat the drum.*  \n  → 彼は太鼓をたたいた。\n\n- **attack**：攻撃する  \n  → 人・国・組織などに対して**意図的に攻撃を仕掛ける**。  \n  *The enemy attacked the city.*  \n  → 敵が街を攻撃した。\n\n- **slam**：強くたたきつける  \n  → ドアなどを**バタン！と激しくぶつける**イメージ。  \n  *He slammed the door.*  \n  → 彼はドアをバタンと閉めた。\n\n### 🔑 ざっくり区別すると\n\n> **strike** → ⚡ 強く・突然「打つ／襲う」  \n> **hit** → 👊 普通に「打つ／当たる」  \n> **beat** → 🥁 繰り返し「たたく」  \n> **attack** → ⚔️ 意図的に「攻撃する」  \n> **slam** → 💥 激しく「たたきつける」\n\n### 対義語\n\n意味によって異なりますが、\n\n- **miss**：打ち損なう、外す\n- **defend**：守る\n- **protect**：保護する\n- **avoid**：避ける\n\nなどがあります。\n\n---\n\n## C【イメージ記憶】\n\n⚡ **突然、強い衝撃が「ドン！」**\n\n```text\n        ⚡\n        ↓\n       🌳\n     ドーン！\n        ↓\n      strike\n```\n\nこの**「突然ぶつかる」**感覚を持っておくと、\n\n> ⚾ ボールを打つ  \n> ⚡ 雷が落ちる  \n> 🌊 災害が襲う  \n> 💡 アイデアが頭に飛び込んでくる\n\nすべて **strike** でつながります。\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **A powerful earthquake struck the area.**\n\n**強い地震がその地域を襲いました。**\n\n平穏な街  \n↓  \n突然地震が発生  \n↓  \n💥 街に強い衝撃\n\n👉 **strike = 突然・強く襲う**\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **strike = 強く・突然「ぶつかる」**\n\n### 📌 よく出る表現\n\n- **strike the ball**：ボールを打つ\n- **lightning strikes**：雷が落ちる\n- **an earthquake strikes**：地震が襲う\n- **go on strike**：ストライキに入る\n- **air strike**：空爆\n- **strike a deal**：契約・取引をまとめる\n- **strike a balance**：バランスを取る\n- **It struck me that ～**：ふと～だと気づく\n\n---\n\n## 📌 strike と hit の違い\n\n### **hit**\n→ 最も普通の**「打つ・当たる」**\n\n> **The ball hit the wall.**  \n> ボールが壁に当たった。\n\n### **strike**\n→ **強さ・突然の衝撃**を感じさせる「打つ・襲う」。hitよりフォーマルな場合もあります。\n\n> **Lightning struck the building.**  \n> 雷がその建物に落ちた。\n\n👉 **hit** = 👊 一般的な「打つ・当たる」  \n👉 **strike** = ⚡ **強く・突然ぶつかる**\n\n---\n\n## ⚠️ 不規則変化も重要\n\n**strike** は不規則動詞です。\n\n> **strike → struck → struck / stricken**\n\n- **The earthquake struck the city.**  \n  → 地震が街を襲った。\n\n**stricken** は特に「病気・災害・悲しみなどに襲われた」という形で使われます。\n\n> **a disaster-stricken area**  \n> 災害に見舞われた地域\n\n---\n\n### 📖 読み方\n\n**strike** → **ストライク**  \n発音：/straɪk/\n\n📌 野球の「ストライク」と同じ発音なので覚えやすいです。\n\nただし英語では野球だけでなく、**「打つ・襲う・ストライキ・ふと思いつく」**など非常に広く使われる重要単語です。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「strike」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「strike」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「strike」と「attack」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 打つ、襲う、ぶつかる、（考えが）ふと思い浮かぶ\n\n**A2.** A powerful earthquake struck the area.\n\n**A3.** 「strike」は「打つ、襲う、ぶつかる、（考えが）ふと思い浮かぶ」、一方「attack」は「攻撃する」です。 元の解説では、→ 日常会話で最も一般的な「打つ・当たる」。strikeより幅広くカジュアル。\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### ① 打つ・たたく\n\n> **He struck the ball.**  \n> 彼はボールを打った。\n\n### ② 災害・病気などが襲う\n\n> **The earthquake struck the city.**  \n> 地震がその街を襲った。\n\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Strike』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Strike → strike\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. He struck the ball.\n2. The earthquake struck the city.\n3. An idea suddenly struck me.\n\n■ 自 rice**  \n  → 通常の価格\n- **as usual**  \n  → いつものように\n- **than usual**  \n  → いつもより\n\n**関連語**\n- **usually**：たいてい、普通は\n- **unusual**：普通ではない、珍しい\n\n💡 **usual** は「一般的」というより、  \n**「普段のパターンとしていつもある」**という感覚が強い。\n\n---\n\n## C【イメージ記憶】\n\n🔁 **毎回同じパターン**\n\n```text\n月 → ☕\n火 → ☕\n水 → ☕\n木 → ☕\n金 → ☕\n      ↓\n   my usual\n```\n\n毎朝いつも同じコーヒーを注文しているなら、\n\n### **I'll have my usual.**\n\n**いつものをお願いします。**\n\n👉 **usual = いつものパターン**\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **He arrived late as usual.**\n\n**彼はいつものように遅れて到着した。**\n\n😅  \n**as usual** は、\n\n> 「今回もいつもと同じだ」\n\nというイメージ。\n\n---\n\n### 🔑 核を一言で覚えるなら\n\n> **usual = 普段どおり**\n\n- **as usual** → いつものように\n- **my usual** → いつものもの\n- **than usual** → いつもより\n\n### **usual と normal の違い**\n\n- **usual**：**いつもそうである**\n- **normal**：**普通・正常である**\n\n例えば、\n\n> **He is late as usual.**  \n> 彼はいつものように遅刻した。\n\nこれは「遅刻するのが正常」という意味ではなく、**いつも遅刻している**ということ。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「usual」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「usual」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「usual」と「usual」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** いつもの、普通の、一般的な\n\n**A2.** He arrived late as usual.\n\n**A3.** 「usual」は「いつもの、普通の、一般的な」という意味で、「usual」は「普段どおり」です。usual と normal の違い\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・関連語】\n\n### **usual**\n＝ **普段からよくある・いつもどおりの**\n\n- **my usual routine**  \n  → いつもの習慣\n- **the usual price**  \n  → 通常の価格\n- **as usual**  \n  → いつものように\n- **than usual**  \n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Usual』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Usual → usual\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. my usual routine\n2. the usual price\n3. as usual\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. usual の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nusual ＝ Usual\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_110">{"A": "【A｜単語・核】\nvent\n読み・発音：—\n基本意味：読み方：ヴェント\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：読み方：ヴェント\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：vent ＝ 読み方：ヴェント", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\nA【意味】\n\n### vent\n**読み方：ヴェント**\n**発音：/vent/**\n\n主な意味は、\n\n1. **通気口・換気口・排気口**\n2. **（感情などを）吐き出す・発散する**\n\nです。\n\n特に日常会話では、\n\n- air vent = 通気口・換気口\n- vent your anger = 怒りをぶちまける\n- vent your frustration = 不満を吐き出す\n\nのように使われます。\n\n---\n\nB【イメージ】\n\nvent の中心イメージは、\n\n**「中にたまっているものを外へ逃がす」**\n\nです。\n\nたとえば部屋の中に熱い空気がたまっているとき、\n換気口から外へ逃がします。\n\n同じように、\n\n- 空気\n- 熱\n- 蒸気\n- ガス\n\nだけでなく、\n\n- 怒り\n- 不満\n- ストレス\n- フラストレーション\n\nなどの感情を「外に出す」という意味でも使われます。\n\nつまり、\n\n**物理的に外へ逃がす → 感情を外へ吐き出す**\n\nというつながりで覚えると分かりやすいです。\n\n---\n\nC【例文】\n\n### ① 名詞：通気口・換気口\n\n**The air is coming through the vent.**\n空気が換気口から入ってきています。\n\n**Don't block the air vent.**\n通気口をふさがないでください。\n\n**Hot air comes out of the vent.**\n換気口から暖かい空気が出てきます。\n\n車でも、\n\n**air vent**\n＝ エアコンの吹き出し口\n\nという意味でよく使われます。\n\n---\n\n### ② 動詞：感情を吐き出す\n\n**I just need to vent.**\nちょっと愚痴を吐き出したいだけなんだ。\n\nこの表現はかなり自然です。\n\n「問題を解決してほしい」というより、\n\n**とりあえず話を聞いてほしい**\n\nというニュアンスがあります。\n\n---\n\n**She vented her frustration to her friend.**\n彼女は友達に不満をぶちまけました。\n\n- vent\n- her frustration\n- to her friend\n\nという構造です。\n\n**vent + 感情 + to 人**\n＝ 人に感情を吐き出す\n\n---\n\n**He vented his anger on his coworkers.**\n彼は同僚に怒りをぶつけました。\n\nここでは、\n\n**vent A on B**\n＝ Aという感情をBにぶつける\n\nという形です。\n\nただしこの言い方は、\n単に愚痴を聞いてもらうよりも、\n\n**相手に怒りをぶつけてしまう**\n\nという少し悪いニュアンスになることがあります。\n\n---\n\nD【よく使う形】\n\n### vent about ～\n～について愚痴を言う\n\n**She was venting about work.**\n彼女は仕事について愚痴を言っていました。\n\n---\n\n### vent to 人\n人に愚痴を聞いてもらう\n\n**Can I vent to you for a minute?**\nちょっと愚痴を聞いてもらっていい？\n\n日常会話で非常に使いやすい表現です。\n\n---\n\n### vent your anger\n怒りを吐き出す\n\n### vent your frustration\n不満・フラストレーションを吐き出す\n\n### vent your feelings\n感情を吐き出す\n\n---\n\nE【類義語との違い】\n\n### vent\n**たまった感情を外に吐き出す**\n\n必ずしも相手を攻撃するわけではありません。\n\n**I need to vent.**\n＝ 愚痴を聞いてほしい。\n\n---\n\n### complain\n**不満を言う・文句を言う**\n\nvent よりも「何かに対して不満を述べる」という意味が中心です。\n\n**He complained about the service.**\n彼はサービスについて文句を言いました。\n\nvent は感情の発散、\ncomplain は不満の表明、\nという違いがあります。\n\n---\n\n### express\n**表現する**\n\nもっと中立的な言葉です。\n\n**She expressed her feelings.**\n彼女は自分の気持ちを表現しました。\n\nvent には、\n「たまっていたものを一気に出す」\nという感覚があります。\n\n---\n\n### let off steam\n**ストレスを発散する**\n\n口語的な表現です。\n\n**I went for a run to let off steam.**\nストレスを発散するために走りに行きました。\n\nvent は「話すことで吐き出す」場面でもよく使われますが、\nlet off steam は運動などによるストレス発散にも使えます。\n\n---\n\nF【反対のイメージ】\n\n### bottle up\n感情を内側にため込む\n\n**Don't bottle up your feelings.**\n感情をため込まないで。\n\nvent が\n\n**外へ出す**\n\nなのに対して、\n\nbottle up は\n\n**中に閉じ込める**\n\nという反対のイメージです。\n\n---\n\nG【覚え方】\n\nvent は、\n\n**ventilation（換気）**\n\nと関連する単語です。\n\n換気とは、\n中にこもった空気を外に逃がすこと。\n\nそこから、\n\n**「中にたまったものを外へ出す」**\n\nと覚えます。\n\n空気なら\n→ 換気口\n\n感情なら\n→ 愚痴・怒りを吐き出す\n\nという2つの意味につながります。\n\n---\n\nH【日常会話で特に覚えたい表現】\n\n**I just need to vent.**\nただちょっと愚痴を吐き出したいだけ。\n\n**Can I vent to you?**\n愚痴を聞いてもらっていい？\n\n**She was venting about her job.**\n彼女は仕事の愚痴を言っていた。\n\n**Don't vent your anger on me.**\n私に怒りをぶつけないで。\n\n---\n\nI【一言で覚える】\n\n**vent = 中にたまったものを外へ逃がす**\n\n物なら\n→ 通気口・換気口\n\n感情なら\n→ 愚痴や怒りを吐き出す\n\nというイメージです。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「vent」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「vent」を使った短い英文を1つ作ってみてください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 1. 通気口・換気口・排気口\n\n**A2.** She was venting about work.\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\nというニュアンスがあります。\n\n---\n\n**She vented her frustration to her friend.**\n彼女は友達に不満をぶちまけました。\n\n- vent\n- her frustration\n- to her friend\n\nという構造です。\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『読み方：ヴェント』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → 読み方：ヴェント → vent\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. 発音：/vent/\n2. air vent = 通気口・換気口\n3. vent your anger = 怒りをぶちまける\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. vent の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nvent ＝ 読み方：ヴェント\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_111">{"A": "【A｜単語・核】\nvivid\n読み・発音：—\n基本意味：Vivid\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：Vivid\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：vivid ＝ Vivid", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【単語】\n\n# **Vivid**（**ヴィヴィッド**）\n\n**adj. 鮮やかな、生き生きとした、鮮明な**\n\n👉 核となるイメージ：**「まるで目の前にあるように、強く・はっきり感じられる」**\n\n---\n\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 鮮やかな\n- 生き生きとした\n- 鮮明な\n- 強烈な\n\n### 類義語とニュアンスの違い\n\n- **vivid**：鮮やかな、鮮明な  \n  → 色・記憶・描写などが、**強くはっきりしていて印象に残る**。  \n  *I have vivid memories of my childhood.*  \n  → 子どもの頃の鮮明な記憶があります。\n\n- **bright**：明るい、鮮やかな  \n  → 特に**光や色の明るさ**に重点がある。  \n  *She wore a bright yellow dress.*  \n  → 彼女は明るい黄色のドレスを着ていた。\n\n- **clear**：明瞭な、はっきりした  \n  → **曖昧さや見えにくさがない**ことを表す。vividほど「強烈・生き生き」の感じはない。  \n  *I have a clear memory of that day.*  \n  → その日のことをはっきり覚えています。\n\n- **lively**：生き生きとした、活気のある  \n  → **人・場所・会話などに活気やエネルギーがある**。  \n  *It was a lively discussion.*  \n  → 活発な議論だった。\n\n- **graphic**：生々しい、詳細な  \n  → 描写が**非常に具体的で、目に浮かぶほど生々しい**。事故など不快な内容にも使う。  \n  *The book contains graphic descriptions.*  \n  → その本には生々しい描写が含まれている。\n\n### 🔑 ざっくり区別すると\n\n> **vivid** → 🌈 強く鮮明で「目に浮かぶ」  \n> **bright** → ☀️ 色・光が「明るい」  \n> **clear** → 🔍 曖昧でなく「はっきり」  \n> **lively** → 🎉 活気があって「生き生き」  \n> **graphic** → 🎥 描写が「生々しい」\n\n### 対義語\n\n- **dull**：くすんだ、つまらない\n- **faint**：かすかな、ぼんやりした\n- **vague**：曖昧な\n- **blurry**：ぼやけた\n- **lifeless**：生気のない\n\n---\n\n## C【イメージ記憶】\n\n🌫️ **ぼんやり → くっきり鮮やか**\n\n```text\nぼんやりした記憶\n🌫️ 🏖️ 🌫️\n      ↓\n   VIVID\n      ↓\n☀️🌊🏖️🌴✨\n\n「まるで昨日のことみたい！」\n```\n\n例えば10年前の旅行なのに、\n\n> 海の色 🌊  \n> 景色 🌴  \n> そのときの会話 💬\n\nまで、**まるで目の前にあるようにはっきり思い出せる**。\n\n👉 **vivid memory = 鮮明な記憶**\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **I still have vivid memories of my first trip abroad.**\n\n**私は初めての海外旅行のことを今でも鮮明に覚えています。**\n\n単に「覚えている」のではなく、\n\n> **そのときの景色や出来事が、今でも目に浮かぶ**\n\nというのが **vivid**。\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **vivid = 目に浮かぶほど、鮮やか・鮮明**\n\n### 📌 よく出る表現\n\n- **vivid colors**：鮮やかな色\n- **a vivid memory**：鮮明な記憶\n- **a vivid image**：鮮明なイメージ\n- **a vivid description**：生き生きとした描写\n- **vivid imagination**：豊かで鮮明な想像力\n- **remember vividly**：鮮明に覚えている\n\n---\n\n## 📌 vivid と clear の違い\n\n### **clear**\n→ **ぼやけていない・曖昧ではない**\n\n> **I have a clear memory of the event.**  \n> その出来事をはっきり覚えています。\n\n### **vivid**\n→ はっきりしているうえに、**色・感情・場面まで生き生きと蘇る**\n\n> **I have a vivid memory of the event.**  \n> その出来事を鮮明に覚えています。\n\n👉 **clear** = 🔍「はっきりしている」  \n👉 **vivid** = 🌈「目に浮かぶほど鮮明」\n\n---\n\n### 📖 読み方\n\ngenui{\"pronunciation_block_widget_v4_audio_fix_v2_realtime_audio_mini\":{\"content\":\"vivid\",\"pronunciation_hint\":\"ヴィヴィッド\",\"pronunciation_language\":\"en\"}}\n\n**vivid** → **ヴィヴィッド**  \n発音：/ˈvɪvɪd/\n\n📌 日本語でも「ビビッドカラー」と言いますが、英語では**色だけでなく「記憶・描写・イメージが鮮明」**という意味でも非常によく使います。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「vivid」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「vivid」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「vivid」と「a vivid description」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 鮮やかな、生き生きとした、鮮明な\n\n**A2.** I still have vivid memories of my first trip abroad.\n\n**A3.** 「vivid」は「鮮やかな、生き生きとした、鮮明な」という意味で、「a vivid description」は「生き生きとした描写」です。📌 vivid と clear の違い\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 鮮やかな\n- 生き生きとした\n- 鮮明な\n- 強烈な\n\n### 類義語とニュアンスの違い\n\n- **vivid**：鮮やかな、鮮明な  \n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Vivid』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Vivid → vivid\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. vivid**：鮮やかな、鮮明な\n2. I have vivid memories of my childhood.\n3. She wore a bright yellow dress.\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. vivid の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nvivid ＝ Vivid\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_112">{"A": "【A｜単語・核】\nwaste management\n読み・発音：—\n基本意味：waste management\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：waste management\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：waste management ＝ waste management", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【単語】\n\n# **waste management**\n\n**意味：廃棄物管理。ごみや廃棄物を収集・処理・再利用・処分する仕組み。**\n\n---\n\n## B【意味・使い方】\n\n廃棄物管理。ごみや廃棄物を収集・処理・再利用・処分する仕組み。\n\n---\n\n## C【イメージ記憶】\n\n🧠 **waste management**\n\n↓  \n\nwaste＝廃棄物、management＝管理。ごみを出して終わりではなく、回収から処理まで管理するイメージです。\n\n---\n\n## D【例文・一言で覚える】\n\n**Waste management is important for cities. = 廃棄物管理は都市にとって重要だ。**\n\n**waste management ＝ 廃棄物管理。ごみや廃棄物を収集・処理・再利用・処分する仕組み。**\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「waste management」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「waste management」を使った短い英文を1つ作ってみてください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 廃棄物管理。ごみや廃棄物を収集・処理・再利用・処分する仕組み。\n\n**A2.** Waste management is important for cities. = 廃棄物管理は都市にとって重要だ。\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n近い語は、意味だけでなく「焦点・強さ・使う場面」の違いまで比較して覚えます。\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『waste management』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → waste management → waste management\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. 🧠 **waste management\n2. Waste management is important for cities. = 廃棄物管理は都市にとって重要だ。\n3. waste management ＝ 廃棄物管理。ごみや廃棄物を収集・処理・再利用・処分する仕組み。\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. waste management の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nwaste management ＝ waste management\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_113">{"A": "【A｜単語・核】\nweigh in\n読み・発音：—\n基本意味：Weigh in\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：Weigh in\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：weigh in ＝ Weigh in", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【表現】\n\n# **Weigh in**（**ウェイ・イン**）\n\n**phrasal verb. 意見を述べる、議論に加わる、口を挟む**\n\n👉 核となるイメージ：**「議論に自分の意見という“重み”を加える」**\n\nニュースや会議では、**「ある話題について意見・見解を述べる」**という意味で非常によく使われます。\n\n---\n\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 意見を述べる\n- 議論に加わる\n- 見解を示す\n- 口を挟む\n\n### 類義語とニュアンスの違い\n\n- **weigh in**：意見を述べる、議論に加わる  \n  → **すでに話し合われている問題について、自分の意見を加える**イメージ。ニュースでもよく使う。  \n  *The CEO weighed in on the debate.*  \n  → CEOはその議論について意見を述べた。\n\n- **comment on**：～についてコメントする  \n  → ある出来事・問題について**意見や感想を述べる**一般的な表現。  \n  *She commented on the new policy.*  \n  → 彼女は新しい政策についてコメントした。\n\n- **give one's opinion**：意見を述べる  \n  → 最もストレートな「自分の意見を言う」。  \n  *He gave his opinion on the issue.*  \n  → 彼はその問題について意見を述べた。\n\n- **speak up**：声を上げる、はっきり意見を言う  \n  → **黙っていないで勇気を出して発言する**ニュアンスがある。  \n  *Employees should speak up when they see a problem.*  \n  → 従業員は問題を見つけたら声を上げるべきだ。\n\n- **chime in**：会話に加わる、口を挟む  \n  → 他の人が話しているところに**自分も一言加える**カジュアルな表現。  \n  *She chimed in with her opinion.*  \n  → 彼女も自分の意見を付け加えた。\n\n### 🔑 ざっくり区別すると\n\n> **weigh in** → ⚖️ 議論に自分の意見を加える  \n> **comment on** → 💬 ～についてコメントする  \n> **give one's opinion** → 🗣️ 普通に意見を述べる  \n> **speak up** → 📢 黙らず声を上げる  \n> **chime in** → 🙋 会話に一言加わる\n\n### 対義語\n\n- **remain silent**：黙っている\n- **stay out of ～**：～に関わらない\n- **withhold one's opinion**：意見を控える\n- **keep quiet**：黙っている\n\n---\n\n## C【イメージ記憶】\n\n⚖️ **議論という「はかり」に、自分の意見を乗せる**\n\n```text\nAさんの意見 🗣️\nBさんの意見 🗣️\n       ↓\n      ⚖️\n       ↑\n「私も意見があります」\n       🗣️\n       ↓\n    weigh in\n```\n\n**weigh** はもともと「重さを量る」。\n\nそこから、\n\n> **自分の意見の「重み」を議論に加える**\n> ↓\n> **意見を述べる**\n\nとイメージすると覚えやすいです。\n\n---\n\n## D【ストーリー暗記・例文】\n\n### **The president weighed in on the debate.**\n\n**大統領はその議論について見解を示しました。**\n\nすでに世間で議論になっている  \n↓  \n大統領も発言する  \n↓  \n🗣️「私はこう考えます」  \n↓  \n👉 **weigh in**\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **weigh in = 議論に自分の意見を加える**\n\n### 📌 よく出る表現\n\n- **weigh in on ～**：～について意見を述べる\n- **weigh in on the debate**：議論に意見を述べる\n- **weigh in on the issue**：その問題について見解を示す\n- **weigh in on the controversy**：論争について意見を述べる\n- **experts weigh in on ～**：専門家が～について見解を示す\n\n📌 特に重要なのが、\n\n> **weigh in on + 話題**\n\nです。\n\n---\n\n## 📌 weigh in と comment on の違い\n\n### **comment on**\n→ 単純に**「～についてコメントする」**\n\n> **The minister commented on the incident.**  \n> 大臣はその事件についてコメントした。\n\n### **weigh in on**\n→ **すでに議論・論争になっている話題に、自分の立場や意見を加える**\n\n> **The minister weighed in on the debate.**  \n> 大臣はその議論に加わり、見解を示した。\n\n👉 **comment on** = 💬「コメントする」  \n👉 **weigh in on** = ⚖️ **「議論に参戦して意見を言う」**\n\nそのため、**政治・ニュース・社会問題の記事**でよく登場します。\n\n---\n\n## ⚠️ もう一つの意味：体重を量る\n\n**weigh in** には文字通り、\n\n> **（試合前などに）体重を量る**\n\nという意味もあります。\n\n> **The boxer weighed in at 75 kilograms.**  \n> そのボクサーは計量で75kgだった。\n\n🥊 ボクシングの**「計量」**が元々の意味です。\n\n---\n\n### 📖 読み方\n\n**weigh in** → **ウェイ・イン**  \n発音：/weɪ ɪn/\n\n📌 **weigh** の **gh は発音しません**。\n\n> **weigh** → ウェイ（重さを量る）  \n> **weight** → ウェイト（重さ）  \n> **weigh in on ～** → ～について意見を述べる\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「weigh in」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「weigh in」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「weigh in」と「speak up」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 意見を述べる、議論に加わる、口を挟む\n\n**A2.** The president weighed in on the debate.\n\n**A3.** 「weigh in」は「意見を述べる、議論に加わる、口を挟む」、一方「speak up」は「声を上げる、はっきり意見を言う」です。\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- 意見を述べる\n- 議論に加わる\n- 見解を示す\n- 口を挟む\n\n### 類義語とニュアンスの違い\n\n- **weigh in**：意見を述べる、議論に加わる  \n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Weigh in』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Weigh in → weigh in\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. weigh in**：意見を述べる、議論に加わる\n2. The CEO weighed in on the debate.\n3. She commented on the new policy.\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. weigh in の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nweigh in ＝ Weigh in\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p3_114">{"A": "【A｜単語・核】\nwould rather\n読み・発音：—\n基本意味：Would rather\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：Would rather\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：would rather ＝ Would rather", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n## A【表現】\n\n# **Would rather**（**ウッド・ラザー**）\n\n**phrase. むしろ～したい、どちらかといえば～したい**\n\n👉 核となるイメージ：**「いくつか選択肢がある中で、こっちのほうがいい」**\n\n単なる **want（～したい）** ではなく、**「AよりBを選びたい」**という比較の気持ちが入ります。\n\n---\n\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- むしろ～したい\n- どちらかといえば～したい\n- ～するほうがいい\n- ～するほうを選びたい\n\n### 基本形\n\n> **would rather + 動詞の原形**\n\n### **I'd rather stay home.**\n\n**私はどちらかといえば家にいたいです。**\n\n📌 **I'd = I would**\n\n---\n\n### 類義語とニュアンスの違い\n\n- **would rather**：どちらかといえば～したい  \n  → **選択肢を比べて「こっちのほうがいい」**という好みを表す。  \n  *I'd rather stay home.*  \n  → どちらかといえば家にいたい。\n\n- **prefer**：～を好む  \n  → **AよりBを好むという好み・選好**を表す。would ratherより一般的・中立的。  \n  *I prefer tea to coffee.*  \n  → コーヒーより紅茶のほうが好きです。\n\n- **would prefer**：～のほうがいい  \n  → would ratherと近いが、**少し丁寧でフォーマル**。  \n  *I'd prefer to sit here.*  \n  → こちらに座りたいです。\n\n- **want to**：～したい  \n  → 単純に**自分の希望・欲求**を表す。比較のニュアンスはない。  \n  *I want to go home.*  \n  → 家に帰りたい。\n\n- **feel like ～ing**：～したい気分だ  \n  → **今の気分として～したい**というカジュアルな表現。  \n  *I feel like staying home.*  \n  → 家にいたい気分です。\n\n### 🔑 ざっくり区別すると\n\n> **want to** → 🙋 単純に「～したい」  \n> **feel like** → 😊 今「～したい気分」  \n> **prefer** → ⚖️ 普段から「～のほうが好き」  \n> **would prefer** → 👔 丁寧に「～のほうがいい」  \n> **would rather** → 👉 **「だったら、こっちのほうがいい」**\n\n---\n\n## C【イメージ記憶】\n\n🍺 飲みに行く？それとも家にいる？\n\n```text\n🍺 Go out\n      VS\n🏠 Stay home\n      ↑\n「今日はこっちかな」\n      ↓\nI'd rather stay home.\n```\n\n👉 **「どちらか選ぶなら、こっち」**\n\nこれが **would rather**。\n\n---\n\n## D【ストーリー暗記・例文】\n\n友達から、\n\n> **Do you want to go out tonight?**  \n> 今夜出かけない？\n\nと聞かれたけれど、今日は疲れている。\n\n### **I'd rather stay home tonight.**\n\n**今夜はどちらかといえば家にいたいな。**\n\n👉 「家にいたい」というだけでなく、**「出かけるより家にいるほうを選ぶ」**というニュアンス。\n\n---\n\n## 🔑 核を一言で覚えるなら\n\n> **would rather = 「どっちかなら、こっちがいい」**\n\n---\n\n## 📌 重要な3つの文型\n\n### ① would rather + 動詞の原形\n\n> **I'd rather wait.**  \n> むしろ待ちたいです。\n\n⚠️ **to は付けません。**\n\n**I'd rather to wait. ❌**  \n**I'd rather wait. ⭕️**\n\n---\n\n### ② would rather A than B\n\n**「BするよりAしたい」**\n\n> **I'd rather walk than take a taxi.**  \n> タクシーに乗るより歩きたい。\n\nイメージは、\n\n> 🚶 walk **＞** 🚕 take a taxi\n\n📌 **rather A than B = BよりむしろA**\n\n---\n\n### ③ would rather + 人 + 過去形\n\n**「人には～してもらいたい」**\n\n> **I'd rather you stayed here.**  \n> あなたにはここにいてもらいたいです。\n\n「今・これから」の話なのに **stayed（過去形）** になるのがポイント。\n\n---\n\n## 📌 would rather と prefer の違い\n\n### **prefer**\n→ **一般的な好み**にも使いやすい。\n\n> **I prefer coffee to tea.**  \n> 私は紅茶よりコーヒーが好きです。\n\n☕ 普段からコーヒー派。\n\n### **would rather**\n→ **その状況で「どちらを選ぶ？」という選択**に使いやすい。\n\n> **I'd rather have coffee.**  \n> どちらかといえばコーヒーがいいです。\n\n☕ 「今選ぶならコーヒーかな」\n\n👉 **prefer** = ❤️「～のほうを好む」  \n👉 **would rather** = ⚖️ **「今選ぶなら～のほうがいい」**\n\n---\n\n### 📖 読み方\n\n**would rather** → **ウッド・ラザー**\n\n発音：/wʊd ˈræðər/\n\n📌 実際の会話では **I would rather → I'd rather** が非常によく使われます。\n\n> **I'd rather not.**  \n> **できればやめておきたいです／遠慮しておきます。**\n\nこの **I'd rather not.** は、誘いや提案を**「できればしたくないな」**とやんわり断るときにも便利な表現です。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「would rather」の日本語の意味を、答えを見ずに言えますか？**\n\n**Q2. 「would rather」を使った短い英文を1つ作ってみてください。**\n\n**Q3. 「would rather」と「want to」の違いを説明してください。**\n\n💡 **ポイント：意味だけでなく、「どんな場面で使うか」まで思い出せればOKです。**\n\n---\n\n## 📝【解答例】\n\n**A1.** むしろ～したい、どちらかといえば～したい\n\n**A2.** Do you want to go out tonight?\n\n**A3.** 「would rather」は「むしろ～したい、どちらかといえば～したい」、一方「want to」は「～したい」です。 元の解説では、→ AよりBを好むという好み・選好を表す。would ratherより一般的・中立的。\n\n※ A2は一例です。意味と使い方が合っていれば、別の英文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n## B【日本語訳・類義語・対義語】\n\n### 日本語訳\n\n- むしろ～したい\n- どちらかといえば～したい\n- ～するほうがいい\n- ～するほうを選びたい\n\n### 基本形\n\n> **would rather + 動詞の原形**\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Would rather』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Would rather → would rather\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. would rather + 動詞の原形\n2. would rather**：どちらかといえば～したい\n3. I'd rather stay home.\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. would rather の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nwould rather ＝ Would rather\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p4_0">{"A": "【A｜単語・核】\nC調\n読み・発音：シーちょう\n基本意味：調子がよく、軽いノリで、その場に合わせてうまいことを言ったり振る舞ったりすること。\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：調子がよく、軽いノリで、その場に合わせてうまいことを言ったり振る舞ったりすること。\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：C調 ＝ 調子がよく、軽いノリで、その場に合わせてうまいことを言ったり振る舞ったりすること。", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n# C調（シーちょう）\n\n### A【語彙】\n## C調\n### 名詞・形容動詞的表現\n**調子がよく、軽いノリで、その場に合わせてうまいことを言ったり振る舞ったりすること。**\n\n👉 **「ノリが軽くて、口がうまく、調子よく立ち回る」**というイメージです。\n\nたとえば、\n\n> 「任せてくださいよ！絶対大丈夫ですって！」\n\nと、深く考えず軽い調子で話す人を、\n\n> **「C調な人だ」**\n\nなどと言います。\n\n---\n\n### B【意味・関連語】\n\n**C調＝軽い・調子がいい・口がうまい**\n\n【よく使う形】\n- **C調な人**\n- **C調な男**\n- **C調なことを言う**\n- **C調なノリ**\n\n現在ではやや**古風・昭和っぽい表現**です。\n\n【類義語】\n\n- **調子がいい**：その場に合わせて都合のいいことを言う\n- **軽薄（けいはく）**：考えや態度に深みがなく、軽々しい。C調より否定的\n- **お調子者**：周囲の雰囲気に乗って、軽い言動をする人\n- **口がうまい**：相手をその気にさせるような話し方が得意\n- **ノリが軽い**：深刻にならず、軽快な雰囲気\n\n⚠️ **音楽の「C調」とは別の使い方があります。**\n\n音楽では、\n\n🎹 **C調＝C major（ハ長調）**\n\nですが、人の性格について「C調」と言う場合は、**「調子がいい」という意味**になります。\n\n---\n\n### C【イメージ記憶】連想イラスト・図\n\n👨「この仕事、本当にできる？」\n\n😎「余裕っすよ！任せてください！」\n\n👨「でも昨日は無理って言ってなかった？」\n\n😎「まあまあ、なんとかなりますって！」\n\n　　　　↓\n\n🎶 軽〜い調子で話す\n\n📌 **C調＝「ノリと口のうまさで、調子よく振る舞う」**\n\n---\n\n### D【ストーリー記憶】例文\n\n> 彼はいつも**C調なことばかり言っている**ので、どこまで本気なのか分からない。\n\nつまり、\n\n> **軽いノリで調子のいいことを言うので、本当にそう思っているのか信用しにくい。**\n\nという意味です。\n\n---\n\n💡 **なぜ「C調」というの？**\n\nこの表現を広く流行させたことで知られるのが、1960年代の**クレージーキャッツ**の楽曲『スーダラ節』などで活躍した植木等の時代です。\n\n「C調」は音楽の **C（ハ長調）** に、「調子がいい」という意味を掛けた俗語として広まりました。\n\nそのため、かなり**昭和の空気を感じさせる言葉**です。\n\n### 🧠 一言で覚えるなら\n\n**C調＝「軽いノリで、調子よくうまいことを言う感じ」**\n\n> 😎「任せて！大丈夫、大丈夫！」  \n> → **C調**\n\n> 🤔「根拠を確認してから判断します」  \n> → **C調ではない**\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「C調」とはどんな意味ですか？ 自分の言葉で説明してみてください。**\n\n**Q2. 「C調」を使った自然な例文を1つ作ってみてください。**\n\n**Q3. 「C調」と「調子がいい」の違いを説明してください。**\n\n💡 **ポイント：似た言葉との違いまで思い出せると、さらに定着しやすくなります。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 調子がよく、軽いノリで、その場に合わせてうまいことを言ったり振る舞ったりすること。\n\n**A2.** 彼はいつもC調なことばかり言っているので、どこまで本気なのか分からない。\n\n**A3.** 「C調」は「調子がよく、軽いノリで、その場に合わせてうまいことを言ったり振る舞ったりすること。」、一方「調子がいい」は「その場に合わせて都合のいいことを言う」です。 元の解説では、軽薄（けいはく）：考えや態度に深みがなく、軽々しい。C調より否定的\n\n※ A2は一例です。自然な使い方になっていれば、別の例文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n### B【意味・関連語】\n\n**C調＝軽い・調子がいい・口がうまい**\n\n【よく使う形】\n- **C調な人**\n- **C調な男**\n- **C調なことを言う**\n- **C調なノリ**\n\n現在ではやや**古風・昭和っぽい表現**です。\n\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『調子がよく、軽いノリで、その場に合わせてうまいことを言ったり振る舞ったりすること。』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → 調子がよく、軽いノリで、その場に合わせてうまいことを言ったり振る舞ったりすること。 → C調\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. C調＝軽い・調子がいい・口がうまい\n2. C調なことを言う\n3. 軽薄（けいはく）**：考えや態度に深みがなく、軽々しい。C調より否定的\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. C調 の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nC調 ＝ 調子がよく、軽いノリで、その場に合わせてうまいことを言ったり振る舞ったりすること。\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p4_1">{"A": "【A｜単語・核】\nうだるような\n読み・発音：—\n基本意味：暑さが非常に厳しく、体がぐったりするほどである様子。\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：暑さが非常に厳しく、体がぐったりするほどである様子。\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：うだるような ＝ 暑さが非常に厳しく、体がぐったりするほどである様子。", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n# うだるような\n\n### A【語彙】\n## うだるような\n### 連体表現\n**暑さが非常に厳しく、体がぐったりするほどである様子。**\n\n📌「うだる」＝暑さのために、ぐったりする・気力がなくなる\n\n👉 **ただ「暑い」のではなく、「暑すぎて何もする気になれない……」というレベルの暑さ**を表します。\n\n---\n\n### B【意味・関連語】\n**うだるような＝耐えがたいほど蒸し暑い・猛烈に暑い**\n\n【よく使う形】\n- **うだるような暑さ**\n- **うだるような真夏の日**\n- **うだるような熱気**\n\n【類義語】\n\n- **蒸し暑い**：湿度が高く、むしむしして暑い\n- **猛暑**：非常に厳しい暑さ\n- **酷暑（こくしょ）**：耐えがたいほどの厳しい暑さ\n- **灼熱（しゃくねつ）**：焼けつくように非常に熱いこと\n\n💡 **「うだるような」は気温そのものより、「暑さで人間がぐったりする感覚」に重点があります。**\n\n---\n\n### C【イメージ記憶】連想イラスト・図\n\n☀️☀️☀️  \n🔥 38℃ 🔥\n\n　　↓\n\n🥵💦  \n「暑すぎる……」\n\n　　↓\n\n🫠  \n**ぐったり……何もしたくない**\n\n📌 **うだるような＝「暑さで体が溶けそうなくらい、ぐったりする」**\n\n---\n\n### D【ストーリー記憶】例文\n\n> **うだるような暑さ**の中、駅まで歩いただけで汗びっしょりになった。\n\nつまり、\n\n> **体がぐったりするほどの猛烈な暑さの中を歩いたため、大量に汗をかいた。**\n\nという意味です。\n\n💡 **「うだる」と「茹（ゆ）だる」の関係**\n\n「うだる」はもともと**「茹だる」**とも書きます。\n\n🥚 お湯でゆでられる  \n　　↓  \n🥵 人間も暑さで「ゆでられている」ような状態\n\nというイメージです。\n\n> 「今日は暑いね」→ ☀️ 普通に暑い  \n> 「今日は**うだるような暑さ**だ」→ 🥵 **暑すぎてぐったりする**\n\n### 🧠 一言で覚えるなら\n\n**うだるような＝「暑すぎて、ぐったりするほどの」**\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「うだるような」とはどんな意味ですか？ 自分の言葉で説明してみてください。**\n\n**Q2. 「うだるような」を使った自然な例文を1つ作ってみてください。**\n\n**Q3. 「うだるような」と「蒸し暑い」の違いを説明してください。**\n\n💡 **ポイント：似た言葉との違いまで思い出せると、さらに定着しやすくなります。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 暑さが非常に厳しく、体がぐったりするほどである様子。\n\n**A2.** うだるような暑さの中、駅まで歩いただけで汗びっしょりになった。\n\n**A3.** 「うだるような」は「暑さが非常に厳しく、体がぐったりするほどである様子。」、一方「蒸し暑い」は「湿度が高く、むしむしして暑い」です。 元の解説では、💡 「うだるような」は気温そのものより、「暑さで人間がぐったりする感覚」に重点があります。\n\n※ A2は一例です。自然な使い方になっていれば、別の例文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n### B【意味・関連語】\n**うだるような＝耐えがたいほど蒸し暑い・猛烈に暑い**\n\n【よく使う形】\n- **うだるような暑さ**\n- **うだるような真夏の日**\n- **うだるような熱気**\n\n【類義語】\n\n- **蒸し暑い**：湿度が高く、むしむしして暑い\n- **猛暑**：非常に厳しい暑さ\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『暑さが非常に厳しく、体がぐったりするほどである様子。』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → 暑さが非常に厳しく、体がぐったりするほどである様子。 → うだるような\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. うだるような＝耐えがたいほど蒸し暑い・猛烈に暑い\n2. うだるような暑さ\n3. うだるような真夏の日\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. うだるような の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nうだるような ＝ 暑さが非常に厳しく、体がぐったりするほどである様子。\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p4_2">{"A": "【A｜単語・核】\nうっちゃる\n読み・発音：—\n基本意味：「面倒だから放置する・ほったらかす」\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：「面倒だから放置する・ほったらかす」\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：うっちゃる ＝ 「面倒だから放置する・ほったらかす」", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n# うっちゃる\n\n### A【語彙】\n## うっちゃる\n### 動詞\n**① 物事を放っておく・そのままにする。  \n② 相撲で、土俵際から相手を逆転して投げ倒す。**\n\n👉 日常では特に、**「面倒だから放置する・ほったらかす」**という意味で使われます。\n\n---\n\n### B【意味・関連語】\n**うっちゃる＝放っておく・ほったらかす・投げ出す**\n\n【よく使う形】\n- **仕事をうっちゃる**\n- **問題をうっちゃっておく**\n- **何もかもうっちゃる**\n- **土俵際でうっちゃる**\n\n【類義語】\n\n- **放置する**：手をつけず、そのままにする。中立的・事務的\n- **ほったらかす**：面倒を見ず、そのままにする。口語的\n- **投げ出す**：途中でやめてしまう\n- **放り出す**：仕事などを途中でやめたり、物を乱暴に外へ出したりする\n\n⚠️ **やや古風・くだけた表現**です。「放っておく」よりも、**「もう知らない、と脇にやってしまう」**ようなニュアンスがあります。\n\n---\n\n### C【イメージ記憶】連想イラスト・図\n\n📚📄「まだ仕事が残ってる……」\n\n　　↓\n\n😩「もういいや！」\n\n　　↓\n\n📄 ➡️ 🗑️  \n　　　👋\n\n📌 **うっちゃる＝「面倒なものを、えいっと放っておく」**\n\n---\n\n### D【ストーリー記憶】例文\n\n> やるべき仕事を**うっちゃって**、遊びに出かけてしまった。\n\nつまり、\n\n> **まだ仕事が残っているのに、それを放っておいて遊びに行ってしまった。**\n\nという意味です。\n\n💡 **相撲では別の意味があります。**\n\n土俵際まで追い込まれた力士が……\n\n🧍‍♂️💦｜土俵際  \n　↓  \n💪「まだ負けない！」  \n　↓  \n🔄 相手を逆転して投げる！\n\nこれを **「うっちゃり」** といいます。\n\nここから比喩的に、\n\n> **土壇場で相手をうっちゃった**\n\n＝ **最後の最後で大逆転した**\n\nという使い方もあります。\n\n### 🧠 一言で覚えるなら\n\n**うっちゃる＝「もういい、と放っておく」**\n\n相撲なら、**「土俵際から大逆転する」**です。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「うっちゃる」とはどんな意味ですか？ 自分の言葉で説明してみてください。**\n\n**Q2. 「うっちゃる」を使った自然な例文を1つ作ってみてください。**\n\n**Q3. 「うっちゃる」と「放置する」の違いを説明してください。**\n\n💡 **ポイント：似た言葉との違いまで思い出せると、さらに定着しやすくなります。**\n\n---\n\n## 📝【解答例】\n\n**A1.** ① 物事を放っておく・そのままにする。\n\n**A2.** やるべき仕事をうっちゃって、遊びに出かけてしまった。\n\n**A3.** 「うっちゃる」は「① 物事を放っておく・そのままにする。」、一方「放置する」は「手をつけず、そのままにする。中立的・事務的」です。\n\n※ A2は一例です。自然な使い方になっていれば、別の例文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n### B【意味・関連語】\n**うっちゃる＝放っておく・ほったらかす・投げ出す**\n\n【よく使う形】\n- **仕事をうっちゃる**\n- **問題をうっちゃっておく**\n- **何もかもうっちゃる**\n- **土俵際でうっちゃる**\n\n【類義語】\n\n- **放置する**：手をつけず、そのままにする。中立的・事務的\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『「面倒だから放置する・ほったらかす」』 ケチして、みみっちい」**\n\nまた、\n\n🏚️🥀「暗くて古くて、なんだか寂しい……」\n\nのような**貧相・みすぼらしい雰囲気**にも使います。\n\n---\n\n### D【ストーリー記憶】例文\n\n> せっかくの旅行なのに、数十円の違いばかり気にするなんて、**しみったれた話だ**。\n\nつまり、\n\n> **楽しむべき場面なのに、細かなお金ばかり気にしていて、ケチくさい。**\n\nという意味です。\n\n💡 **「しみったれた」と「うらぶれた」の違い**\n\n- **しみったれた**：ケチくさい・貧相でみすぼらしい\n- **うらぶれた**：活気を失って、寂しく落ちぶれている\n\n> 💰「数円でも絶対に損したくない」→ **しみったれた**  \n> 🏚️「昔は栄えていたが、今は寂れている」→ **うらぶれた**\n\n### 🧠 一言で覚えるなら\n\n**しみったれた＝「ケチくさくて、みみっちい・貧相」**\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「しみったれた」とはどんな意味ですか？ 自分の言葉で説明してみてください。**\n\n**Q2. 「しみったれた」を使った自然な例文を1つ作ってみてください。**\n\n**Q3. 「しみったれた」と「けち」の違いを説明してください。**\n\n💡 **ポイント：似た言葉との違いまで思い出せると、さらに定着しやすくなります。**\n\n---\n\n## 📝【解答例】\n\n**A1.** お金や物を出し惜しみして、けちけちしている様子。また、貧相で活気がなく、みすぼらしい様子。\n\n**A2.** せっかくの旅行なのに、数十円の違いばかり気にするなんて、しみったれた話だ。\n\n**A3.** 「しみったれた」は「お金や物を出し惜しみして、けちけちしている様子。また、貧相で活気がなく、みすぼらしい様子。」、一方「けち」は「お金や物を必要以上に出したがらない」です。\n\n※ A2は一例です。自然な使い方になっていれば、別の例文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n### B【意味・関連語】\n**しみったれた＝けちくさい・貧相な・みみっちい**\n\n【よく使う形】\n- **しみったれた話**\n- **しみったれたことを言う**\n- **しみったれた店**\n- **しみったれた生活**\n- **しみったれた格好**\n\n【類義語】\n\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『お金や物を出し惜しみして、けちけちしている様子。また、貧相で活気がなく、みすぼらしい様子。』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → お金や物を出し惜しみして、けちけちしている様子。また、貧相で活気がなく、みすぼらしい様子。 → しみったれた\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. しみったれた＝けちくさい・貧相な・みみっちい\n2. しみったれたことを言う\n3. しみったれた生活\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. しみったれた の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nしみったれた ＝ お金や物を出し惜しみして、けちけちしている様子。また、貧相で活気がなく、みすぼらしい様子。\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p4_7">{"A": "【A｜単語・核】\nしんみり\n読み・発音：—\n基本意味：静 \n\nという意味です。\n\n💡 **「なおざり」と「おざなり」の違い**\n\nこの2つは非常によく混同されます。\n\n- **なおざり**：真剣に取り組まず、**軽く扱う・放っておく**\n- **おざなり**：その場を済ませるために、**形だけ適当にやる**\n\nたとえば掃除なら、\n\n🧹 **なおざり**  \n→ 掃除を重要視せず、ほとんど手をつけない\n\n🧹 **おざなり**  \n→ とりあえず見えるところだけサッと掃除して「終わりました」\n\n### 🧠 一言で覚えるなら\n\n**なおざり＝「大事にせず、ほったらかし気味」**\n\n**おざなり＝「やるけど、形だけ」**\n\nこの2つはセットで覚えると使い分けやすいです。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「なおざり」とはどんな意味ですか？ 自分の言葉で説明してみてください。**\n\n**Q2. 「なおざり」を使った自然な例文を1つ作ってみてください。**\n\n**Q3. 「なおざり」と「おざなり」の違いを説明してください。**\n\n💡 **ポイント：似た言葉との違いまで思い出せると、さらに定着しやすくなります。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 物事を真剣に扱わず、いい加減に済ませること。\n\n**A2.** 忙しいからといって、安全確認をなおざりにしてはいけない。\n\n**A3.** 「なおざり」は「物事を真剣に扱わず、いい加減に済ませること。」という意味で、「おざなり」は「その場を済ませるために、形だけ適当にやる」です。💡 「なおざり」と「おざなり」の違い\n\n※ A2は一例です。自然な使い方になっていれば、別の例文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n### B【意味・関連語】\n**なおざり＝真剣に取り組まず、いい加減に扱うこと**\n\n【よく使う形】\n- **仕事をなおざりにする**\n- **安全対策をなおざりにする**\n- **基本をなおざりにする**\n- **問題をなおざりにできない**\n\n【類義語】\n\n- **おろそか**：十分に注意や努力を払わない\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『物事を真剣に扱わず、いい加減に済ませること。』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → 物事を真剣に扱わず、いい加減に済ませること。 → なおざり\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. 📌 漢字では **「等閑」** と書きますが、通常はひらがなで「なおざり」と書きます。\n2. なおざり＝真剣に取り組まず、いい加減に扱うこと\n3. 仕事をなおざりにする\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. なおざり の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nなおざり ＝ 物事を真剣に扱わず、いい加減に済ませること。\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p4_10">{"A": "【A｜単語・核】\nほおかむり\n読み・発音：—\n基本意味：「布を頭からかぶって頬まで隠す」\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：「布を頭からかぶって頬まで隠す」\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：ほおかむり ＝ 「布を頭からかぶって頬まで隠す」", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n# 頬被り（ほおかむり）\n\n### A【語彙】\n## 頬被り\n### 名詞・動詞\n**① 手ぬぐいや布などで、頭から頬にかけて覆うこと。  \n② 知っているのに知らないふりをして、責任や問題を避けること。**\n\n📌「頬」＝ほお  \n📌「被り」＝かぶること\n\n👉 もともとは**「布を頭からかぶって頬まで隠す」**という意味です。\n\nそこから、**都合の悪いことから顔を隠す → 知らないふりをする**という比喩的な意味が生まれました。\n\n---\n\n### B【意味・関連語】\n**頬被り＝① 頭・頬を布で覆う　② 知らないふりをする**\n\n【よく使う形】\n- **手ぬぐいで頬被りする**\n- **問題に頬被りする**\n- **責任を頬被りする**\n- **知っていながら頬被りを決め込む**\n\n【類義語】\n\n- **知らんぷり**：知っているのに知らないように振る舞う\n- **見て見ぬふり**：問題を認識しているのに無視する\n- **責任逃れ**：自分の責任を負わないようにする\n- **黙殺**：意見などを意図的に無視する\n\n💡 比喩的な意味では、**「頬被りを決め込む」**という表現がよく使われます。\n\n---\n\n### C【イメージ記憶】連想イラスト・図\n\n問題発生！ 🚨  \n　　↓  \n😨「自分も知ってるけど……」\n\n　　↓ 布をかぶる\n\n🥷「私は何も知りません」\n\n📌 **頬被り＝「顔を隠す」→「都合の悪いことを知らないふり」**\n\n---\n\n### D【ストーリー記憶】例文\n\n> 会社は以前から問題を把握していたにもかかわらず、長い間**頬被りを決め込んでいた**。\n\nつまり、\n\n> **問題があることを知っていたのに、知らないふりをして対応しなかった。**\n\nという意味です。\n\n💡 **「頬被り」と「見て見ぬふり」の違い**\n\n- **頬被り**：都合の悪いことについて、**知らないふりをして関わろうとしない**\n- **見て見ぬふり**：問題を目の前で認識しているのに、**あえて無視する**\n\n> 🙈「私は何も知りません」→ **頬被り**  \n> 👀「見えているけど関わらない」→ **見て見ぬふり**\n\n### 🧠 一言で覚えるなら\n\n**頬被り＝「都合の悪いことに、知らないふりをする」**\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「ほおかむり」とはどんな意味ですか？ 自分の言葉で説明してみてください。**\n\n**Q2. 「ほおかむり」を使った自然な例文を1つ作ってみてください。**\n\n**Q3. 「ほおかむり」と「頬被り」の違いを説明してください。**\n\n💡 **ポイント：似た言葉との違いまで思い出せると、さらに定着しやすくなります。**\n\n---\n\n## 📝【解答例】\n\n**A1.** ① 手ぬぐいや布などで、頭から頬にかけて覆うこと。\n\n**A2.** 会社は以前から問題を把握していたにもかかわらず、長い間頬被りを決め込んでいた。\n\n**A3.** 「ほおかむり」は「① 手ぬぐいや布などで、頭から頬にかけて覆うこと。」という意味で、「頬被り」は「都合の悪いことについて、知らないふりをして関わろうとしない」です。💡 「頬被り」と「見て見ぬふり」の違い\n\n※ A2は一例です。自然な使い方になっていれば、別の例文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n### B【意味・関連語】\n**頬被り＝① 頭・頬を布で覆う　② 知らないふりをする**\n\n【よく使う形】\n- **手ぬぐいで頬被りする**\n- **問題に頬被りする**\n- **責任を頬被りする**\n- **知っていながら頬被りを決め込む**\n\n【類義語】\n\n- **知らんぷり**：知っているのに知らないように振る舞う\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『「布を頭からかぶって頬まで隠す」』という状態が目の前で起きている場面を想像します。\n\n場面 \nとなります。\n\nつまりスマホ画面のマゼンタは、基本的に**赤と青の光を組み合わせて表現**しています。\n\n---\n\n# G【「ピンク」と何が違う？】\n\n日常会話ではかなり曖昧ですが、イメージとしては、\n\n### 🩷 ピンク\n\n赤を明るく・淡くしたような色。\n\n→ **柔らかい・淡い**\n\n### 🟣 マゼンタ\n\n赤紫系の非常に鮮やかな色。\n\n→ **強い・鮮やか**\n\n例えば、\n\n```text\n🌸 淡い桜色\n→ ピンクっぽい\n\n💄 鮮烈な赤紫\n→ マゼンタっぽい\n```\n\nと考えると区別しやすいです。\n\n---\n\n# H【名前の由来】\n\n「マゼンタ」という名前は、実は**イタリアの地名「マジェンタ（Magenta）」**に由来します。\n\n1859年、イタリア統一運動の時代に**マジェンタの戦い**が起こりました。\n\nそのころ登場した赤紫系の合成染料が、この戦い・地名にちなんで**magenta**と呼ばれるようになったとされています。\n\nつまり、\n\n> 🎨 色の名前  \n> ↓  \n> 🇮🇹 実はイタリアの地名が由来\n\nという面白い歴史があります。\n\n---\n\n# 🧠 一言で覚えるなら\n\n> **マゼンタ＝「鮮やかな赤紫色。CMYKではMを担当する基本色の一つ」**\n\n### 🔗 特に覚えておきたい関係\n\n**🖨️ 印刷**\n\nC → シアン 🩵  \n**M → マゼンタ 🩷**  \nY → イエロー 💛  \nK → ブラック 🖤\n\n一方、\n\n**📱 ディスプレイ**\n\n❤️ Red  \n💚 Green  \n💙 Blue  \n＝ **RGB**\n\n💡 **「プリンターのM＝マゼンタ」**までセットで覚えておくと、ExcelやPowerPoint、画像編集、印刷設定などでも役立ちます。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「マゼンタ」とはどんな意味ですか？ 自分の言葉で説明してみてください。**\n\n**Q2. 「マゼンタ」を使った自然な例文を1つ作ってみてください。**\n\n💡 **ポイント：似た言葉との違いまで思い出せると、さらに定着しやすくなります。**\n\n---\n\n## 📝【解答例】\n\n**A1.** Magenta（マゼンタ）\n\n**A2.** を組み合わせることで、多くの色を表現します。\n\n※ A2は一例です。自然な使い方になっていれば、別の例文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n💡 **ポイント：似た言葉との違いまで思い出せると、さらに定着しやすくなります。**\n\n---\n\n## 📝【解答例】\n\n**A1.** Magenta（マゼンタ）\n\n**A2.** を組み合わせることで、多くの色を表現します。\n\n※ A2は一例です。自然な使い方になっていれば、別の例文でもOKです。\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Magenta（マゼンタ）』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Magenta（マゼンタ） → マゼンタ\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. Magenta（マゼンタ）\n2. ※「マゼンダ」と呼ばれることもありますが、英語 *magenta* の一般的な日本語表記は**マゼンタ**です。\n3. ただし、「赤と紫の絵の具を単純に混ぜれば必ずマゼンタになる」という意味ではありません。\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. マゼンタ の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nマゼンタ ＝ Magenta（マゼンタ）\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p4_17">{"A": "【A｜単語・核】\nメレンゲ\n読み・発音：メレンゲ\n基本意味：Meringue（メレンゲ）\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：Meringue（メレンゲ）\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：メレンゲ ＝ Meringue（メレンゲ）", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n# 🍰 メレンゲ\n\n## A【用語】\n\n# メレンゲ\n**Meringue（メレンゲ）**\n\n基本的には、**卵白に砂糖などを加えて泡立てたもの**です。\n\nケーキや焼き菓子など、お菓子作りでよく使われます。\n\n> 🧠 **「卵白を泡立てて、たくさんの空気を含ませたもの」**\n\nと覚えると分かりやすいです。\n\n---\n\n# B【どうやって作るの？】\n\n基本的な材料はシンプルです。\n\n🥚 卵白  \n＋  \n🍬 砂糖  \n↓  \n🥣 泡立てる  \n↓  \n☁️ **白くふわふわになる**  \n↓  \n🍰 メレンゲ\n\n最初は透明っぽい液体だった卵白が、泡立てることで白くふわふわになります。\n\n---\n\n# C【なぜ卵白がふわふわになるの？】\n\nここがメレンゲの面白いところです。\n\n卵白には**タンパク質**が含まれています。\n\n泡立て器で激しく混ぜると、\n\n```text\n🥚 卵白\n↓\n🥣 泡立てる\n↓\n💨 空気が入り込む\n↓\n卵白のタンパク質が\n空気の泡を包み込む\n↓\n☁️ 泡がたくさんできる\n↓\nメレンゲ\n```\n\nとなります。\n\nつまりメレンゲのふわふわ感の正体は、**卵白の中に取り込まれた大量の細かい空気**です。\n\n---\n\n# D【砂糖は何のために入れる？】\n\n砂糖は甘くするだけではありません。\n\nメレンゲの**泡を安定させる**重要な役割があります。\n\n卵白だけでも泡立ちますが、泡は比較的不安定です。\n\nそこに砂糖を適切に加えることで、\n\n> ☁️ 泡がつぶれにくくなる  \n> ✨ なめらかになる  \n> 🍬 甘みがつく\n\nという効果があります。\n\nそのため、お菓子作りでは砂糖を何回かに分けて加えるレシピもよくあります。\n\n---\n\n# E【何に使うの？】\n\n代表的なのが**スポンジケーキ**です。\n\n```text\n🥚 卵白\n↓\n☁️ メレンゲを作る\n↓\n🥣 生地と合わせる\n↓\n🔥 オーブンで焼く\n↓\n🍰 ふわふわした生地\n```\n\nメレンゲに含まれている空気を利用して、ふんわりした食感を作ります。\n\nほかにも、\n\n🍰 シフォンケーキ  \n🥞 スフレ  \n🍋 レモンメレンゲパイ  \n🍪 メレンゲクッキー\n\nなどに使われます。\n\n---\n\n# F【「メレンゲ」というお菓子もある】\n\n少しややこしいポイントです。\n\n「メレンゲ」は**泡立てた卵白そのもの**を指すこともあれば、それを焼いて作った**メレンゲ菓子**を指すこともあります。\n\n例えば、\n\n> 「メレンゲを生地に混ぜる」\n\nなら、\n\n👉 ☁️ 泡立てた卵白。\n\n一方、\n\n> 「メレンゲを食べる」\n\nなら、\n\n👉 🍪 焼いて乾燥させたサクサクのお菓子\n\nを指している可能性があります。\n\n---\n\n# G【生クリームの泡立てとは違う？】\n\n見た目は似ていますが、別物です。\n\n|  | ☁️ メレンゲ | 🍦 ホイップクリーム |\n|---|---|---|\n| 主原料 | 卵白 | 生クリーム |\n| 主な成分 | タンパク質 | 脂肪 |\n| 見た目 | 白くふわふわ | 白くクリーミー |\n| 用途 | 生地、焼き菓子など | ケーキのデコレーションなど |\n\nどちらも「空気を取り込んでふわふわにする」という点は似ていますが、**泡を支えている仕組みが違います。**\n\n---\n\n# H【「角が立つ」って何？】\n\nメレンゲのレシピでは、\n\n> **「角が立つまで泡立てる」**\n\nという表現がよく出てきます。\n\n泡立て器を持ち上げたとき、\n\n```text\n🥣 メレンゲ\n     ↑\n     /\\  ← ツノのようになる\n    /  \\\n```\n\nこのように先端がツンと残る状態です。\n\nしっかり泡立っていることを確認する目安になります。\n\nただし、お菓子によって必要なメレンゲの硬さは違います。\n\n---\n\n# I【卵黄が入るとうまく泡立たないのはなぜ？】\n\nメレンゲ作りでは、\n\n> ⚠️ **卵白に卵黄を入れないようにする**\n\nと言われます。\n\n卵黄には脂質が含まれており、脂質が混ざると**卵白のタンパク質が安定した泡を作るのを邪魔しやすい**からです。\n\nそのため、\n\n🥣 ボウルに油が残っている  \n🥚 卵黄が混ざってしまった\n\nなども、メレンゲがうまく泡立たない原因になります。\n\n---\n\n# 🧠 一言で覚えるなら\n\n> **メレンゲ＝「卵白を泡立てて大量の空気を含ませ、ふわふわにしたもの」**\n\n### 🔗 流れで覚える\n\n🥚 **卵白**  \n＋  \n🍬 **砂糖**  \n↓  \n🥣 **泡立てる**  \n↓  \n💨 空気が入る  \n↓  \n☁️ **メレンゲ**  \n↓  \n🍰 生地に利用  \n↓  \n**ふわっとした食感**\n\n💡 メレンゲは単に「卵白を混ぜたもの」ではなく、**卵白のタンパク質を利用して細かい空気の泡を保持したもの**と理解すると、お菓子が膨らむ仕組みまでつながります。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「メレンゲ」とはどんな意味ですか？ 自分の言葉で説明してみてください。**\n\n**Q2. 「メレンゲ」を使った自然な例文を1つ作ってみてください。**\n\n💡 **ポイント：似た言葉との違いまで思い出せると、さらに定着しやすくなります。**\n\n---\n\n## 📝【解答例】\n\n**A1.** Meringue（メレンゲ）\n\n**A2.** 砂糖は甘くするだけではありません。\n\n※ A2は一例です。自然な使い方になっていれば、別の例文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n💡 **ポイント：似た言葉との違いまで思い出せると、さらに定着しやすくなります。**\n\n---\n\n## 📝【解答例】\n\n**A1.** Meringue（メレンゲ）\n\n**A2.** 砂糖は甘くするだけではありません。\n\n※ A2は一例です。自然な使い方になっていれば、別の例文でもOKです。\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『Meringue（メレンゲ）』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → Meringue（メレンゲ） → メレンゲ\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. Meringue（メレンゲ）\n2. ここがメレンゲの面白いところです。\n3. つまりメレンゲのふわふわ感の正体は、**卵白の中に取り込まれた大量の細かい空気**です。\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. メレンゲ の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\nメレンゲ ＝ Meringue（メレンゲ）\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p4_18">{"A": "【A｜単語・核】\nレッテル\n読み・発音：—\n基本意味：人や物に対して、特定のイメージや評価を一方的に決めつけること\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：人や物に対して、特定のイメージや評価を一方的に決めつけること\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：レッテル ＝ 人や物に対して、特定のイメージや評価を一方的に決めつけること", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n# レッテル\n\n### A【語彙】\n## レッテル\n### 名詞\n**人や物に対して、特定のイメージや評価を一方的に決めつけること**\n\n📌 もともとはオランダ語の **letter（文字・ラベル）** に由来  \n📌 本来は「商品などに貼るラベル」の意味\n\n👉 **人に「この人はこういう人だ」と決めつけるラベルを貼るイメージ**\n\n---\n\n### B【日本語訳・関連語】\n**レッテル＝人や物に対する固定的な評価・決めつけ**\n\n【よく使う形】  \n- **レッテルを貼る**\n- **レッテルを貼られる**\n- **勝手なレッテルを貼る**\n\n【類義語】  \n決めつけ・偏見・固定観念・先入観\n\n⚠️ **「レッテルを貼る」は、相手の一面だけを見て、その人全体を決めつけるという悪いニュアンスで使われることが多い**です。\n\n---\n\n### C【イメージ記憶】連想イラスト・図\n\n👤  \n　↓  \n🏷️「怠け者」  \n🏷️「変わった人」  \n🏷️「優等生」\n\n**人に勝手なラベルを貼る**\n\n📌 **レッテル＝「人や物に貼られた、固定的なイメージのラベル」**\n\n---\n\n### D【ストーリー記憶】例文\n\n> 一度失敗しただけで、彼に**「仕事ができない人」というレッテルを貼る**のは早すぎる。\n\nつまり、\n\n> **一度の失敗だけを理由に、その人全体を「仕事ができない人」と決めつけるのはよくない。**\n\nという意味です。\n\n💡 **「評価」と「レッテル」の違い**\n\n- **評価**：具体的な行動や結果をもとに判断する\n- **レッテル**：一面的な情報から、相手を固定的に決めつける\n\n> ❌「一度遅刻したから、あの人はだらしない人だ」  \n> → **レッテルを貼る**\n\n**「レッテルを貼る」＝「相手を一言で決めつける」**と覚えると分かりやすいです。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「レッテル」とはどんな意味ですか？ 自分の言葉で説明してみてください。**\n\n**Q2. 「レッテル」を使った自然な例文を1つ作ってみてください。**\n\n**Q3. 「レッテル」と「評価」の違いを説明してください。**\n\n💡 **ポイント：似た言葉との違いまで思い出せると、さらに定着しやすくなります。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 人や物に対して、特定のイメージや評価を一方的に決めつけること\n\n**A2.** 一度失敗しただけで、彼に「仕事ができない人」というレッテルを貼るのは早すぎる。\n\n**A3.** 「レッテル」は「人や物に対して、特定のイメージや評価を一方的に決めつけること」という意味で、「評価」は「具体的な行動や結果をもとに判断する」です。💡 「評価」と「レッテル」の違い\n\n※ A2は一例です。自然な使い方になっていれば、別の例文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n### B【日本語訳・関連語】\n**レッテル＝人や物に対する固定的な評価・決めつけ**\n\n【よく使う形】  \n- **レッテルを貼る**\n- **レッテルを貼られる**\n- **勝手なレッテルを貼る**\n\n【類義語】  \n決めつけ・偏見・固定観念・先入観\n\n⚠️ **「レッテルを貼る」は、相手の一面だけを見て、その人全体を決めつけるという悪いニュアンスで使われることが多い**です。\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」 用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. 与太話 の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\n与太話 ＝ 根拠のない、くだらない話や、でたらめな話\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p4_22">{"A": "【A｜単語・核】\n伊達\n読み・発音：—\n基本意味：見た目を華やか・かっこよく見せること。また、見栄を張ること。\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：見た目を華やか・かっこよく見せること。また、見栄を張ること。\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：伊達 ＝ 見た目を華やか・かっこよく見せること。また、見栄を張ること。", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n# 伊達（だて）\n\n### A【語彙】\n## 伊達\n### 名詞・形容動詞\n**見た目を華やか・かっこよく見せること。また、見栄を張ること。**\n\n👉 **実用性だけではなく、「見た目のかっこよさ」にこだわるイメージ**\n\n「伊達」は使われ方によって、**「おしゃれ・粋」**にも**「見栄・かっこつけ」**にもなります。\n\n---\n\n### B【意味・関連語】\n**伊達＝見た目を飾ること・しゃれていること・見栄を張ること**\n\n【よく使う形】\n- **伊達男（だておとこ）**\n- **伊達眼鏡（だてめがね）**\n- **伊達に〜していない**\n- **伊達や酔狂（すいきょう）ではない**\n\n【類義語】\nおしゃれ・粋・気取る・見栄を張る\n\n⚠️ 特に重要なのが、\n\n### 「伊達に〜していない」\n\nこれは、\n\n**「ただ格好だけで〜しているわけではない」  \n→「それだけの実力・経験がちゃんとある」**\n\nという意味です。\n\n> 彼は**伊達に10年間この仕事をしていない**。  \n→ 10年の経験にふさわしい実力がある。\n\n---\n\n### C【イメージ記憶】連想イラスト・図\n\n😎✨  \n👔⌚👞\n\n「実用性だけじゃなく、見た目もかっこよく！」\n\n　　　　↓\n\n🎩 **伊達＝見た目をしゃれて飾る**\n\nそこから……\n\n😎「格好だけじゃないぞ！」  \n　　　　↓  \n💪✨\n\n📌 **伊達に〜していない＝「見かけだけじゃない」**\n\n---\n\n### D【ストーリー記憶】例文\n\n> 彼は**伊達に毎日トレーニングしているわけではない**。かなりの重さを軽々と持ち上げた。\n\nつまり、\n\n> **毎日トレーニングしてきただけあって、ちゃんと実力が身についている。**\n\nという意味です。\n\n---\n\n💡 **「伊達」と「粋」の違い**\n\n- **伊達**：見た目を華やか・かっこよく飾ること。**見栄**のニュアンスを含むこともある\n- **粋**：振る舞いや服装が洗練されていて、**さりげなくかっこいい**\n\n> 😎✨ 派手にしゃれ込む → **伊達**  \n> 🍶👘 さりげなく気が利いている → **粋**\n\n### 🧠 一言で覚えるなら\n\n**伊達＝「見た目のかっこよさ・しゃれっ気」**\n\nそして、\n\n**「伊達に〜していない」＝「見かけだけじゃない、本物だ」**\n\nはセットで覚えると使いやすいです。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「伊達」とはどんな意味ですか？ 自分の言葉で説明してみてください。**\n\n**Q2. 「伊達」を使った自然な例文を1つ作ってみてください。**\n\n💡 **ポイント：似た言葉との違いまで思い出せると、さらに定着しやすくなります。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 見た目を華やか・かっこよく見せること。また、見栄を張ること。\n\n**A2.** 彼は伊達に毎日トレーニングしているわけではない。かなりの重さを軽々と持ち上げた。\n\n※ A2は一例です。自然な使い方になっていれば、別の例文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n### B【意味・関連語】\n**伊達＝見た目を飾ること・しゃれていること・見栄を張ること**\n\n【よく使う形】\n- **伊達男（だておとこ）**\n- **伊達眼鏡（だてめがね）**\n- **伊達に〜していない**\n- **伊達や酔狂（すいきょう）ではない**\n\n【類義語】\nおしゃれ・粋・気取る・見栄を張る\n\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『見た目を華やか・かっこよく見せること。また、見栄を張ること。』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → 見た目を華やか・かっこよく見せること。また、見栄を張ること。 → 伊達\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. 「伊達」は使われ方によって、**「おしゃれ・粋」**にも**「見栄・かっこつけ」**にもなります。\n2. 伊達＝見た目を飾ること・しゃれていること・見栄を張ること\n3. 伊達男（だておとこ）\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. 伊達 の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\n伊達 ＝ 見た目を華やか・かっこよく見せること。また、見栄を張ること。\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p4_23">{"A": "【A｜単語・核】\n半可通\n読み・発音：—\n基本意味：ある物事について、中途半端な知識しかないのに、よく知っているように振る舞うこと。また、その人。\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：ある物事について、中途半端な知識しかないのに、よく知っているように振る舞うこと。また、その人。\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：半可通 ＝ ある物事について、中途半端な知識しかないのに、よく知っているように振る舞うこと。また、その人。", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n# 半可通（はんかつう）\n\n### A【語彙】\n## 半可通\n### 名詞・形容動詞\n**ある物事について、中途半端な知識しかないのに、よく知っているように振る舞うこと。また、その人。**\n\n📌「半可」＝中途半端・十分でない  \n📌「通」＝その分野に詳しい人\n\n👉 **「ちょっと知っているだけなのに、専門家のような顔をする人」**\n\n---\n\n### B【日本語訳・関連語】\n**半可通＝知ったかぶり・中途半端な物知り**\n\n【よく使う形】\n- **半可通な知識**\n- **半可通の人**\n- **半可通を振り回す**\n- **半可通なことを言う**\n\n【類義語】\n知ったかぶり・生半可・にわか仕込み・受け売り\n\n⚠️ 単に「知識が少ない人」ではありません。\n\n**知識が中途半端 ＋ よく知っているように振る舞う**\n\nという、やや批判的なニュアンスがあります。\n\n---\n\n### C【イメージ記憶】連想イラスト・図\n\n📖「本を少し読んだ！」  \n　↓  \n🧠 知識 30％  \n　↓  \n😎「この分野なら何でも知ってるよ」  \n　↓  \n👨‍🏫「いや、それは違うよ…」\n\n📌 **半可通＝「半分しか知らないのに、“通”を気取る」**\n\n「半可」＋「通」で覚えると分かりやすいです。\n\n---\n\n### D【ストーリー記憶】例文\n\n> **半可通な知識**で専門家に意見するのは危険だ。\n\nつまり、\n\n> **少し勉強しただけの中途半端な知識で、十分に理解しているつもりになって意見するのは危険だ。**\n\nという意味です。\n\n💡 **「半可通」と「知ったかぶり」の違い**\n\n- **半可通**：実際に多少の知識はあるが、**理解が中途半端なのに詳しい顔をする**\n- **知ったかぶり**：よく知らないのに、**知っているふりをする**\n\n> 📚 少し知識がある → 得意げに語る → **半可通**  \n> ❓ 実は知らない → 知っているふり → **知ったかぶり**\n\n**半可通＝「中途半端な知識で“通”を気取る人」**と覚えると分かりやすいです。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「半可通」とはどんな意味ですか？ 自分の言葉で説明してみてください。**\n\n**Q2. 「半可通」を使った自然な例文を1つ作ってみてください。**\n\n**Q3. 「半可通」と「知ったかぶり」の違いを説明してください。**\n\n💡 **ポイント：似た言葉との違いまで思い出せると、さらに定着しやすくなります。**\n\n---\n\n## 📝【解答例】\n\n**A1.** ある物事について、中途半端な知識しかないのに、よく知っているように振る舞うこと。また、その人。\n\n**A2.** 半可通な知識で専門家に意見するのは危険だ。\n\n**A3.** 「半可通」は「ある物事について、中途半端な知識しかないのに、よく知っているように振る舞うこと。また、その人。」という意味で、「知ったかぶり」は「よく知らないのに、知っているふりをする」です。💡 「半可通」と「知ったかぶり」の違い\n\n※ A2は一例です。自然な使い方になっていれば、別の例文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n### B【日本語訳・関連語】\n**半可通＝知ったかぶり・中途半端な物知り**\n\n【よく使う形】\n- **半可通な知識**\n- **半可通の人**\n- **半可通を振り回す**\n- **半可通なことを言う**\n\n【類義語】\n知ったかぶり・生半可・にわか仕込み・受け売り\n\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『ある物事について、中途半端な知識しかないのに、よく知っているように振る舞うこと。また、その人。』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → ある物事について、中途半端な知識しかないのに、よく知っているように振る舞うこと。また、その人。 → 半可通\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. 半可通＝知ったかぶり・中途半端な物知り\n2. 半可通を振り回す\n3. 半可通なことを言う\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. 半可通 の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\n半可通 ＝ ある物事について、中途半端な知識しかないのに、よく知っているように振る舞うこと。また、その人。\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p4_24">{"A": "【A｜単語・核】\n反駁\n読み・発音：—\n基本意味：相手の意見や主張に対して、「それは違う」と理由や根拠を示して反論すること。\n\n「先輩、まず訳を 般的な言葉\n- **吹聴（ふいちょう）**：あちこちに言いふらす。やや悪いニュアンス\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『あることを世間に広く知らせ、大々的に言いふらすこと。』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → あることを世間に広く知らせ、大々的に言いふらすこと。 → 喧伝\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. 喧伝＝世間に広く、盛んに言い広めること\n2. 大々的に喧伝する\n3. メディアで喧伝される\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. 喧伝 の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\n喧伝 ＝ あることを世間に広く知らせ、大々的に言いふらすこと。\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p4_28">{"A": "【A｜単語・核】\n地縁\n読み・発音：—\n基本意味：同じ地域に住んでいることをきっかけとして生まれる、人と人とのつながり\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：同じ地域に住んでいることをきっかけとして生まれる、人と人とのつながり\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：地縁 ＝ 同じ地域に住んでいることをきっかけとして生まれる、人と人とのつながり", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n# 地縁（ちえん）\n\n### A【語彙】\n## 地縁\n### 名詞\n**同じ地域に住んでいることをきっかけとして生まれる、人と人とのつながり**\n\n📌「地」＝土地・地域  \n📌「縁」＝人とのつながり・関係\n\n👉 **「同じ場所に住んでいる」という共通点から生まれるつながり**\n\n---\n\n### B【日本語訳・関連語】\n**地縁＝同じ地域に住む人々のつながり**\n\n【よく使う形】  \n- **地縁を大切にする**\n- **地縁によるつながり**\n- **地縁社会**\n- **地縁団体**\n\n【関連語】  \n- **血縁**：血のつながり\n- **地縁**：土地・地域を通じたつながり\n- **社縁**：会社などの組織を通じたつながり\n\n⚠️ **「地縁」は、必ずしも親しい関係という意味ではありません。**  \n👉 **同じ地域に住んでいることを基盤とした関係**を指します。\n\n---\n\n### C【イメージ記憶】連想イラスト・図\n\n🏠 🏠 🏠  \n　│　│　│  \n👨‍👩‍👧‍👦 🤝 👴👵  \n　　↓  \n🏘️ **同じ地域**\n\n📌 **地縁＝「同じ土地に住んでいることから生まれる縁」**\n\n---\n\n### D【ストーリー記憶】例文\n\n> 地域の祭りは、住民同士の**地縁**を深める大切な機会となっている。\n\nつまり、\n\n> **同じ地域に住む人たちが祭りを通じて交流し、地域のつながりを強めている。**\n\nという意味です。\n\n💡 **「血縁」とセットで覚えると分かりやすいです。**\n\n- 👨‍👩‍👧 **血縁**＝血のつながり\n- 🏠🤝 **地縁**＝土地・地域のつながり\n\n**地縁＝「同じ地域に住んでいることによる人間関係」**と覚えましょう。\n\n---\n\n## ✅【確認問題】 **\n\n【類義語】\n\n- **正念場（しょうねんば）**：その人の真価が問われる重要な場面\n- **山場**：物事が最も重要・緊迫するところ\n- **勝負どころ**：勝敗を左右する重要なタイミング\n- **分水嶺（ぶんすいれい）**：その後の方向性を大きく分ける境目\n\n⚠️ **単に「大事な場面」というだけでなく、「ここでの結果が全体の勝敗を大きく左右する」というニュアンスが強い**です。\n\n---\n\n### C【イメージ記憶】連想イラスト・図\n\n⚔️ 勝負\n\nA軍 🟥　　⛰️ **天王山**　　🟦 B軍  \n　　　　　　↑\n　　　**ここを取った方が有利！**\n\n　　　　　　↓\n\n🏆 最終的な勝敗へ\n\n📌 **天王山＝「ここを制する者が、勝負を制する」**\n\n---\n\n### D【ストーリー記憶】例文\n\n> 首位チームとの直接対決は、優勝を目指すうえで**天王山となる一戦**だ。\n\nつまり、\n\n> **この試合に勝つか負けるかが、最終的な優勝争いを大きく左右する。**\n\nという意味です。\n\n💡 **なぜ「天王山」がこの意味になった？**\n\n1582年、**山崎の戦い**で豊臣秀吉（当時は羽柴秀吉）と明智光秀が戦いました。\n\nその際、京都と大阪の間にある**天王山周辺が軍事上の重要地点**だったことから、\n\n**天王山を押さえる  \n→ 戦いを有利に進められる  \n→ 勝敗を決める重要地点**\n\nというイメージが定着し、現在の比喩表現につながったとされます。\n\n### 🧠 一言で覚えるなら\n\n**天王山＝「ここで勝負が決まる、最大の勝負どころ」**\n\n> 🏆 勝敗を左右する → **天王山**  \n> 💪 実力・真価が試される → **正念場**\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「天王山」とはどんな意味ですか？ 自分の言葉で説明してみてください。**\n\n**Q2. 「天王山」を使った自然な例文を1つ作ってみてください。**\n\n**Q3. 「天王山」と「山場」の違いを説明してください。**\n\n💡 **ポイント：似た言葉との違いまで思い出せると、さらに定着しやすくなります。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 勝敗や成否を決める、最も重要な場面・局面のこと。\n\n**A2.** 首位チームとの直接対決は、優勝を目指すうえで天王山となる一戦だ。\n\n**A3.** 「天王山」は「勝敗や成否を決める、最も重要な場面・局面のこと。」、一方「山場」は「物事が最も重要・緊迫するところ」です。\n\n※ A2は一例です。自然な使い方になっていれば、別の例文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n### B【意味・関連語】\n**天王山＝勝敗を決める重要な局面・最大の勝負どころ**\n\n【よく使う形】\n- **ここが天王山だ**\n- **選挙戦の天王山**\n- **優勝争いの天王山**\n- **交渉が天王山を迎える**\n- **今週が天王山となる**\n\n【類義語】\n\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『勝敗や成否を決める、最も重要な場面・局面のこと。』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → 勝敗や成否を決める、最も重要な場面・局面のこと。 → 天王山\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. 📌 もともとは、京都府に実在する**「天王山」**という山の名前です。\n2. 天王山＝勝敗を決める重要な局面・最大の勝負どころ\n3. 優勝争いの天王山\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. 天王山 の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\n天王山 ＝ 勝敗や成否を決める、最も重要な場面・局面のこと。\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p4_30">{"A": "【A｜単語・核】\n子煩悩\n読み・発音：—\n基本意味：自分の子どもをとてもかわいがり、大切にすること。また、そのような親。\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：自分の子どもをとてもかわいがり、大切にすること。また、そのような親。\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：子煩悩 ＝ 自分の子どもをとてもかわいがり、大切にすること。また、そのような親。", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n# 子煩悩（こぼんのう）\n\n### A【語彙】\n## 子煩悩\n### 名詞・形容動詞\n**自分の子どもをとてもかわいがり、大切にすること。また、そのような親。**\n\n👉 **「子どものことがかわいくて仕方がない親」**というイメージです。\n\n「煩悩」という言葉が入っていますが、基本的には**悪い意味ではなく、愛情深い親を表す肯定的な言葉**です。\n\n---\n\n### B【意味・関連語】\n\n**子煩悩＝子どもへの愛情が深く、よくかわいがること**\n\n【よく使う形】\n- **子煩悩な父親**\n- **子煩悩な母親**\n- **とても子煩悩だ**\n- **意外と子煩悩な一面がある**\n\nたとえば、\n\n> 仕事では厳しい部長だが、家ではかなりの**子煩悩**らしい。\n\n→ 家では子どもをとてもかわいがっている、ということです。\n\n【関連語】\n\n- **愛情深い**：人に対する愛情が強い。子ども以外にも使える\n- **家族思い**：家族全体を大切にする\n- **親バカ**：自分の子どもをかわいがるあまり、高く評価しすぎる\n- **過保護**：子どもを守りすぎて、必要以上に世話をする\n\n⚠️ **「子煩悩」と「親バカ」は少し違います。**\n\n**子煩悩**\n→ 子どもをとてもかわいがる  \n→ 基本的に好意的 😊\n\n**親バカ**\n→ 「うちの子は世界一！」のように、かわいがりすぎて客観的に見られない  \n→ 軽いからかいを含むことがある 😅\n\n---\n\n### C【イメージ記憶】連想イラスト・図\n\n👨‍💼 仕事中  \n「この資料、やり直してください」\n\n😐 厳しい上司\n\n　　　↓\n\n🏠 家に帰ると……\n\n👨「ただいま〜！😍」\n\n👧「パパー！」\n\n👨‍👧✨  \n「今日もかわいいなあ！」\n\n📌 **子煩悩＝「子どもがかわいくて仕方がない親」**\n\n---\n\n### D【ストーリー記憶】例文\n\n> 彼は一見無口で怖そうだが、実はとても**子煩悩な父親**だ。\n\nつまり、\n\n> **見た目からは想像しにくいけれど、家では子どもをとてもかわいがり、大切にしている父親だ。**\n\nという意味です。\n\n💡 **なぜ「煩悩」という字を使う？**\n\n「煩悩」はもともと仏教で、**人の心を悩ませる欲望や執着**を意味します。\n\nそこから「子どもへの思いが非常に強い」という意味合いで**子＋煩悩 → 子煩悩**となっています。\n\nただし現代の「子煩悩」は、\n\n> ❌ 子どもに執着する悪い親  \n> ⭕ 子どもをとてもかわいがる愛情深い親\n\nという意味で使うのが普通です。\n\n### 🧠 一言で覚えるなら\n\n**子煩悩＝「わが子がかわいくて仕方がない親」**\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「子煩悩」とはどんな意味ですか？ 自分の言葉で説明してみてください。**\n\n**Q2. 「子煩悩」を使った自然な例文を1つ作ってみてください。**\n\n**Q3. 「子煩悩」と「愛情深い」の違いを説明してください。**\n\n💡 **ポイント：似た言葉との違いまで思い出せると、さらに定着しやすくなります。**\n\n---\n\n## 📝【解答例】\n\n**A1.** 自分の子どもをとてもかわいがり、大切にすること。また、そのような親。\n\n**A2.** 彼は一見無口で怖そうだが、実はとても子煩悩な父親だ。\n\n**A3.** 「子煩悩」は「自分の子どもをとてもかわいがり、大切にすること。また、そのような親。」という意味で、「愛情深い」は「人に対する愛情が強い。子ども以外にも使える」です。⚠️ 「子煩悩」と「親バカ」は少し違います。\n\n※ A2は一例です。自然な使い方になっていれば、別の例文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n### B【意味・関連語】\n\n**子煩悩＝子どもへの愛情が深く、よくかわいがること**\n\n【よく使う形】\n- **子煩悩な父親**\n- **子煩悩な母親**\n- **とても子煩悩だ**\n- **意外と子煩悩な一面がある**\n\nたとえば、\n\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『自分の子どもをとてもかわいがり、大切にすること。また、そのような親。』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → 自分の子どもをとてもかわいがり、大切にすること。また、そのような親。 → 子煩悩\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. 子煩悩＝子どもへの愛情が深く、よくかわいがること\n2. 意外と子煩悩な一面がある\n3. 仕事では厳しい部長だが、家ではかなりの**子煩悩**らしい。\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. 子煩悩 の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\n子煩悩 ＝ 自分の子どもをとてもかわいがり、大切にすること。また、そのような親。\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p4_31">{"A": "【A｜単語・核】\n寂寥\n読み・発音：—\n基本意味：ひっそりと静かで、もの寂しいこと\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：ひっそりと静かで、もの寂しいこと\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：寂寥 ＝ ひっそりと静かで、もの寂しいこと", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n# 寂寥（せきりょう）\n\n### A【語彙】\n## 寂寥\n### 名詞・形容動詞\n**ひっそりと静かで、もの寂しいこと**\n\n📌「寂」＝さびしい  \n📌「寥」＝まばらで、ひっそりしている\n\n👉 **ただ「寂しい」だけでなく、周囲に何もなく、静けさの中で感じる深い寂しさ**\n\n---\n\n### B【日本語訳・関連語】\n**寂寥＝ひっそりとした寂しさ・もの寂しさ**\n\n【よく使う形】  \n- **寂寥感**\n- **寂寥たる風景**\n- **寂寥を感じる**\n\n【類義語】  \n孤独・哀愁・物寂しさ・侘しさ\n\n⚠️ **「孤独」は一人であることに焦点がありますが、「寂寥」は周囲の静けさや空虚さから感じる寂しさ**です。\n\n---\n\n### C【イメージ記憶】連想イラスト・図\n\n🌆　🍂　🏚️  \n　　　・  \n　　　・  \n　　　・\n\n**夕暮れの誰もいない町に、風だけが静かに吹いている**\n\n📌 **寂寥＝「静かで何もない空間に漂う、深いもの寂しさ」**\n\n---\n\n### D【ストーリー記憶】例文\n\n> 秋の夕暮れの公園 イメージ記憶】連想イラスト・図\n\nこれまで\n\n商品A → 商品B → 商品C\n\n━━━━━━━→\n\n同じ方向で改良\n\nところが……\n\n　　　　　　↗️ 💡✨\n\n━━━━━━━→\n\n　　　　**新しい方向へ！**\n\n👨‍💼「今までとは違う方法でやってみよう」\n\n📌 **新機軸＝「従来の延長線ではない、新しい方向を打ち出す」**\n\n---\n\n### D【ストーリー記憶】例文\n\n> 外食チェーンは、若者を取り込むために新しい店舗形態という**新機軸を打ち出した**。\n\nつまり、\n\n> **これまでと同じような店舗を増やすのではなく、新しい発想・方向性の店舗を始めた。**\n\nという意味です。\n\n💡 **「新機軸」と「斬新」の違い**\n\n- **新機軸**：新しい**方法・方向性そのもの** \n- **斬新**：アイデアなどが**新鮮で目新しい様子** \n\n> 💡 サブスク方式で商品を販売する\n>\n> → **新機軸を打ち出す**\n\n> 🎨「このパッケージ、今まで見たことがない！」\n>\n> → **斬新なデザイン**\n\nさらに、\n\n> 「新機軸を打ち出したが、成功しなかった」\n\nとも言えるので、**新機軸＝必ず優れた方法**というわけではありません。\n\n### 🧠 一言で覚えるなら\n\n**新機軸＝「今までとは違う、新しいやり方・方向性」**\n\nc調\n\n# C調（シーちょう）\n\n### A【語彙】\n\n## C調\n\n### 名詞・形容動詞的表現\n\n**調子がよく、軽いノリで、その場に合わせてうまいことを言ったり振る舞ったりすること。**\n\n👉 \\*\\*「ノリが軽くて、口がうまく、調子よく立ち回る」\\*\\*というイメージです。\n\nたとえば、\n\n> 「任せてくださいよ！絶対大丈夫ですって！」\n\nと、深く考えず軽い調子で話す人を、\n\n> **「C調な人だ」**\n\nなどと言います。\n\n---\n\n### B【意味・関連語】\n\n**C調＝軽い・調子がいい・口がうまい**\n\n【よく使う形】\n\n- **C調な人** \n- **C調な男** \n- **C調なことを言う** \n- **C調なノリ** \n\n現在ではやや**古風・昭和っぽい表現**です。\n\n【類義語】\n\n- **調子がいい**：その場に合わせて都合のいいことを言う \n- **軽薄（けいはく）**：考えや態度に深みがなく、軽々しい。C調より否定的 \n- **お調子者**：周囲の雰囲気に乗って、軽い言動をする人 \n- **口がうまい**：相手をその気にさせるような話し方が得意 \n- **ノリが軽い**：深刻にならず、軽快な雰囲気 \n\n⚠️ **音楽の「C調」とは別の使い方があります。**\n\n音楽では、\n\n🎹 **C調＝C major（ハ長調）**\n\nですが、人の性格について「C調」と言う場合は、**「調子がいい」という意味**になります。\n\n---\n\n### C【イメージ記憶】連想イラスト・図\n\n👨「この仕事、本当にできる？」\n\n😎「余裕っすよ！任せてください！」\n\n👨「でも昨日は無理って言ってなかった？」\n\n😎「まあまあ、なんとかなりますって！」\n\n　　　　↓\n\n🎶 軽〜い調子で話す\n\n📌 **C調＝「ノリと口のうまさで、調子よく振る舞う」**\n\n---\n\n### D【ストーリー記憶】例文\n\n> 彼はいつも**C調なことばかり言っている**ので、どこまで本気なのか分からない。\n\nつまり、\n\n> **軽いノリで調子のいいことを言うので、本当にそう思っているのか信用しにくい。**\n\nという意味です。\n\n---\n\n💡 **なぜ「C調」というの？**\n\nこの表現を広く流行させたことで知られるのが、1960年代の**クレージーキャッツ**の楽曲『スーダラ節』などで活躍した植木等の時代です。\n\n「C調」は音楽の **C（ハ長調）** に、「調子がいい」という意味を掛けた俗語として広まりました。\n\nそのため、かなり**昭和の空気を感じさせる言葉**です。\n\n### 🧠 一言で覚えるなら\n\n**C調＝「軽いノリで、調子よくうまいことを言う感じ」**\n\n> 😎「任せて！大丈夫、大丈夫！」\n>\n> → **C調**\n\n> 🤔「根拠を確認してから判断します」\n>\n> → **C調ではない**\n\n今日 17:54\n\n風合い\n\n# 風合い（ふうあい）\n\n### A【語彙】\n\n## 風合い\n\n### 名詞\n\n**素材から感じられる、見た目・手触りなどの独特な感じや雰囲気のこと。**\n\n特に、**布・紙・木・革などの素材**についてよく使います。\n\n👉 \\*\\*「その素材ならではの、見た感じ＋触った感じ」\\*\\*と考えると分かりやすいです。\n\nたとえば、\n\n> 「このシャツはリネン特有の風合いがある」\n\nなら、単に「見た目がいい」だけではなく、\n\n🖐️ 手触り\n\n👀 色・質感\n\n🧵 生地の表情\n\n✨ 素材らしさ\n\nなどをまとめて表しています。\n\n---\n\n### B【意味・関連語】\n\n**風合い＝素材から感じる独特の味わい・質感**\n\n【よく使う形】\n\n- **自然な風合い** \n- **独特の風合い** \n- **柔らかな風合い** \n- **革本来の風合い** \n- **風合いを生かす** \n- **風合いが増す** \n- **風合いを損なう** \n\n例えば、\n\n> 長く使うことで、革に独特の**風合い**が出てきた。\n\n→ 革の色・ツヤ・手触りなどが変化して、**使い込んだ革ならではの味わいが出てきた**ということです。\n\n【類義語】\n\n- **質感**：表面の見た目や触った感じ。「ツルツル」「ザラザラ」など \n- **風合い**：質感に加えて、素材全体から感じる**雰囲気・味わい** \n- **手触り**：実際に手で触ったときの感覚 \n- **風情**：場所・景色などから感じる趣や雰囲気 \n\n📌 **風合いは「素材」に使われることが多い**のがポイントです。\n\n---\n\n### C【イメージ記憶】連想イラスト・図\n\n新品の革製品\n\n👜✨\n\nツルッとしている\n\n　　↓ 何年も使う\n\n👜\n\n色が少し濃くなる\n\n細かなシワができる\n\nツヤが出る\n\n革が柔らかくなる\n\n　　↓\n\n🧑「いい感じになってきたなぁ」\n\nこれが、\n\n👉 **革の風合い**\n\n📌 **風合い＝「素材が持っている、その素材らしい味わい」**\n\n---\n\n### D【ストーリー記憶】例文\n\n> このテーブルは、天然木の**風合いを生かした**デザインになっている。\n\nつまり、\n\n> 木目 🌳\n>\n> 色合い 🟤\n>\n> 表面の質感 🖐️\n>\n> 自然な雰囲気 ✨\n\nなどを無理に隠さず、**天然木ならではの魅力を残している**ということです。\n\n---\n\n💡 **「風合い」と「質感」の違い**\n\n例えばデニムなら、\n\n👖「表面が少しゴワゴワしている」\n\n→ **質感**\n\n👖「色落ちや手触りも含めて、使い込んだデニムらしい味が出ている」\n\n→ **風合い**\n\nつまり、\n\n**質感**\n\n→ 👀🖐️「どんな表面・触り心地？」\n\n**風合い**\n\n→ 👀🖐️✨「そこからどんな味わい・雰囲気を感じる？」\n\nという違いです。\n\n### 🧠 一言で覚えるなら\n\n**風合い＝「素材の見た目や手触りから感じる、その素材ならではの味わい」**\n\nsvg\n\nsvg\n\nsvg\n\nsvg**\n\nこの内容も辞書アプリに反映します。今回は、詳しい本文がある **「惰性」「鋭意」「新機軸」「C調」「風合い」** を日本語語彙として登録・上書きし、末尾の不要な `svg` は除外します。\n\n---\n\n## 過去チャットの関連解説\n\nこの記事はかなり本質を突いています。\n\n特に重要なのは、\n\n> 「読書＝読むこと」\nではなく、\n> 「読書＝思い出しながら考えること」\n\nだと定義し直している点です。\n\nこれは実際、認知心理学の研究ともかなり一致しています。\n\n---\n\n# この記事の核心\n\nこの記事が言いたいことを一言でまとめると、\n\n> 人は“読んだ時”ではなく、“思い出そうとした時”に学習する\n\nです。\n\n多くの人の読書は、\n\n- 最初から最後まで読む\n- 線を引く\n- 要約を見る\n\nで終わります。\n\nでもこれは脳的にはかなり「受け身」です。\n\n映画を見た直後は分かった気になるのに、\n翌週には内容を説明できないのと同じ。\n\n---\n\n# なぜ積読が増えるのか\n\nこの記事の最初の、\n\n> 「15冊を超えると風景になる」\n\nはかなりリアルです。\n\n実は積読には2種類あります。\n\n## ① 未読の罪悪感型\n\n「読まなきゃ…」\n\nと心理的負債になる状態。\n\n---\n\n## ② 風景化型\n\nある量を超えると、\n\n- 読み切れない\n- 追いつけない\n- もう全部理解するのは無理\n\nと脳が諦める。\n\nすると本棚が\n「知識の倉庫」ではなく\n「インテリア」になります。\n\n---\n\n# この方法の本当の強み\n\nこの記事は「AIで時短しよう」だけではありません。\n\n本質は、\n\n> AIを“検索相手”ではなく、“思考相手”にしている\n\nことです。\n\n---\n\n# 特に重要な3つ\n\n## ① 「課題」を先に宣言する\n\nこれはかなり重要。\n\n普通の読書：\n\n> 本に自分を合わせる\n\n対話型読書：\n\n> 自分の問題に本を合わせる\n\n例えばユーザーさんなら、\n\n- 未経験環境で成長実感が欲しい\n- 周囲との比較で自分の立ち位置を知りたい\n- 経理やExcelを実務レベルで理解したい\n\nみたいな課題があります。\n\nこの状態で本を読むと、\n脳は「関係ある情報」を優先保存します。\n\n---\n\n# ② 「反論する」が超重要\n\nここが特に良い。\n\n日本の読書って、\n「著者を正しく理解する」\nに偏りやすい。\n\nでも記憶に残るのは、\n\n> 「自分が考えた部分」\n\nなんです。\n\n例えば：\n\n- 本当に現場で使える？\n- 中小企業でも成立する？\n- 自分の会社だと何が障害？\n\nこうやって\n「自分の頭で処理した情報」\nだけが長期記憶になりやすい。\n\n---\n\n# ③ 翌日クイズ\n\nこれが実は最強です。\n\n脳科学では、\n\n> 再読より“思い出す練習”の方が圧倒的に強い\n\nことがかなり昔から知られています。\n\nだから、\n\n- 読み返す\nより\n- 思い出して間違える\n\n方が記憶に残る。\n\n---\n\n# 実はこれ、学校教育と逆\n\n学校では、\n\n- ノートを綺麗にまとめる\n- マーカーを引く\n- 何回も読む\n\nをやりがち。\n\nでも実際には、\n\n- 問題を解く\n- 人に説明する\n- 思い出す\n- 間違える\n\n方が定着する。\n\nこの記事はそこをうまく突いています。\n\n---\n\n# ただし弱点もある\n\nかなり良い記事ですが、\n注意点もあります。\n\n---\n\n## ① 「理解した気」問題\n\nAIと対話すると、\n会話がスムーズすぎて、\n\n> 分かった気になる\n\n危険があります。\n\n特にビジネス書は、\n\n- 抽象度が高い\n- 言い換えが多い\n- 似た概念が多い\n\nので、\n「納得」と「理解」を混同しやすい。\n\n---\n\n## ② 深読みに向かない本もある\n\nこの方法は：\n\n- ビジネス書\n- 実用書\n- 自己啓発\n- 概念整理\n\nにはかなり強い。\n\nでも：\n\n- 哲学\n- 文学\n- 数学\n- 難解な専門書\n\nは、\nゆっくり格闘する価値があります。\n\n---\n\n# 一番重要なのはここ\n\nこの記事は実は、\n\n> 「全部読まなくていい」\n\nと言っています。\n\nこれはかなり大きい。\n\n真面目な人ほど、\n\n- 最初から最後まで\n- 全部理解\n- 全章読む\n\nをやろうとする。\n\nでも実際、\n本の価値は\n\n> “自分の人生や仕事を1ミリ変える1行”\n\nだったりします。\n\n---\n\n# 現代の読書は「収集」より「接続」\n\n昔：\n本を持っている人が強かった\n\n今：\n情報は無限\n\nだから重要なのは、\n\n- どの情報を\n- 自分の課題に接続し\n- 行動へ変えるか\n\nです。\n\nこの記事の方法は、\n\n> 「本を読む」\nから\n> 「本を使う」\n\nへのシフトと言えます。\n\n---\n\nユーザーさんの場合だと、\n特に\n\n- Excel\n- 経理\n- 経営哲学\n- キャリア\n- TOEIC\n- 工業簿記\n\nみたいな“実務と接続しやすい本”とはかなり相性がいい方法です。\n\n---\n\n## ✅【確認問題】\n\n**Q1. 「抽象的」とはどんな意味ですか？ 自分の言葉で説明してみてください。**\n\n**Q2. 「抽象的」を使った自然な例文を1つ作ってみてください。**\n\n**Q3. 「抽象的」と「革新」の違いを説明してください。**\n\n💡 **ポイント：似た言葉との違いまで思い出せると、さらに定着しやすくなります。**\n\n---\n\n## 📝【解答例】\n\n**A1.** これまでの習慣や勢いのまま、特に強い意志や目的なしに続けること\n\n**A2.** 毎日勉強しているが、最近は惰性で続けているだけになっている。\n\n**A3.** 「抽象的」は「これまでの習慣や勢いのまま、特に強い意志や目的なしに続けること」、一方「革新」は「従来の仕組みなどを大きく変える」です。\n\n※ A2は一例です。自然な使い方になっていれば、別の例文でもOKです。\n\n■ 類義語・近義語・ニュアンス\n### B【意味・関連語】\n\n**意味：**\n\n習慣や勢いに流されて、変化せずに物事を続けること。\n\n【類義語】\n\n習慣・習性・流れ・マンネリ\n\n【反対のイメージ】\n\n\n■ 比較するときの5点\n1. 何に焦点があるか\n2. 意味の強さ\n3. 肯定・否定・中立\n4. 日常／仕事／文章のどこで自然か\n5. 別の語へ置換したとき何が変わるか\n\n「似ているから全部同じ、ではありません。ここまで区別すると“使える語”になります。」", "C": "【C｜イメージ記憶】\n「一回、文字から離れましょう。頭の中に一枚絵を作ります。」\n\n■ 一枚絵\n『英単語ではなく、日本語の語彙をこの「A〜Dの4分割形式」で解説』という状態が目の前で起きている場面を想像します。\n\n場面 → 状態を言葉にする → 英単語ではなく、日本語の語彙をこの「A〜Dの4分割形式」で解説 → 抽象的\n\n■ 記憶の作り方\n人物・場所・動き・感情を一つずつ足してください。\n翌日は「語→意味」だけでなく「場面→語」の逆方向でも思い出します。\n\n「そうです。先輩、訳を暗唱するより“映像から言葉が出る”状態を狙います。」", "D": "【D｜具体例・実戦】\n「最後は実際に使います。分かったつもりをここで潰しますよ。」\n\n■ 具体例\n1. 抽象的 を使う自然な場面を作る。\n2. 日常・仕事・ニュースのいずれかに置き換えてもう一例作る。\n\n■ 自分用への変換\n主語を変える → 場所を変える → 似た語に置き換える → ニュアンス差を説明する\n\n■ 理解確認\nQ1. 抽象的 の核を一文で説明できますか？\nQ2. 自然な使用場面を一つ言えますか？\nQ3. 似た語との違いを一つ説明できますか？\n\n■ 30秒復習\n①読み・発音 ②核の意味 ③一枚絵 ④使用場面 ⑤似た語との差 ⑥自分の例文\n\n■ 一文で覚える\n抽象的 ＝ 英単語ではなく、日本語の語彙をこの「A〜Dの4分割形式」で解説\n\n「閉じた状態でここまで言えたら合格です、先輩。」"}</script><script type="application/json" id="p4_39">{"A": "【A｜単語・核】\n掘り出し物\n読み・発音：—\n基本意味：思いがけず見つけた、価値のあるものや、安く手に入れた良いもの\n\n「先輩、まず訳を増やす前に、この語の芯を一本取ります。」\n核イメージ：思いがけず見つけた、価値のあるものや、安く手に入れた良いもの\n\n覚える順番：\n読み・音 → 核イメージ → 基本意味 → 実際の場面\n\n一文記憶：掘り出し物 ＝ 思いがけず見つけた、価値のあるものや、安く手に入れた良いもの", "B": "【B｜詳しい意味・語感・類義語】\n「ここからは“なぜこの語を選ぶのか”まで見ます、先輩。」\n\n■ 元の学習内容\n# 掘り出し物（ほりだしもの）\n\n### A【語彙】\n## 掘り出し物\n### 名詞\n**思いがけず見つけた、価値のあるものや、安く手に入れた良いもの**\n\n📌「掘り出す」＝土の中などから見つける  \n📌「物」＝もの\n\n👉 **「普通なら気づかないところから、価値のあるものを見つける」イメージ**\n\n---\n\n### B【日本語訳・関連語】\n**掘り出し物＝思いがけず見つけた価値のあるもの**\n\n【よく使う形】  \n- **掘り出し物を見つける**\n- **掘り出し物を手に入れる**\n- **これは掘り出し物だ**\n\n【関連語】  \nお買い得品・掘り出し物件・掘り出し物商品\n\n⚠️ **必ずしも「安いもの」だけではありません。**  \n「価値があるのに、あまり知られていなかったもの」という意味でも使います。\n\n---\n\n### C【イメージ記憶】連想イラスト・図\n\n🛍️ 🔍  \n　↓  \n📦  \n　↓  \n💎✨\n\n**古い店で何気なく見つけたものが、実は価値のある宝物だった**\n\n📌 **掘り出し物＝「思いがけず見つけた、お宝」**\n\n---\n\n### D【ストーリー記憶】例文\n\n> 古本屋で、昔

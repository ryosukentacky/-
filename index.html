<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英単語プロジェクト</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#202124}
header{background:#fff;padding:28px 5%;border-bottom:1px solid #ddd}
main{max-width:1050px;margin:auto;padding:28px 20px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
button{padding:11px 16px;border:1px solid #bbb;border-radius:10px;background:#fff;cursor:pointer}
button.active{background:#202124;color:#fff}
input{width:min(100%,360px);padding:12px;border:1px solid #bbb;border-radius:10px;margin-bottom:18px}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin:10px 0}
.word{font-size:19px;font-weight:700}
.note{font-size:13px;color:#8a6d3b;margin-top:7px}
#count{color:#666;margin-top:6px}
</style>
</head>
<body>
<header><h1>英単語プロジェクト</h1><div id="count"></div></header>
<main>
<div class="tabs" id="tabs"></div>
<input id="search" type="search" placeholder="検索">
<div id="list"></div>
</main>
<script>
const decks = {"英単語日常用2": ["If all goes according to plan", "To some degree", "Live life to the fullest", "Sneak in", "Sign up for", "Roughly", "Otherwise", "Dwindling", "See yourself", "Much the same", "Other than that", "Mindful", "Consequence", "Give someone the benefit of the doubt", "Bully", "Gang up on someone", "In the first place", "Questionable", "Instigate", "Privilege", "Fundamentally", "Navigate the world", "Put someone on blast"], "英文解説対応": ["cancel culture", "on a very human level", "consequence", "feel like", "certain", "thing", "give someone the benefit of the doubt", "bully", "gang up on someone", "in the first place", "questionable", "instigate", "change", "behavior", "responsible", "punish", "extreme"], "英単語 アニメ": ["Essential", "Crucial", "Significant", "Matter", "Count", "Rival", "Common", "Ordinary", "Familiar", "Emphasize", "Neglect", "Eminent", "Prominent", "Slight", "Character", "Feature", "Typical", "Peculiar", "Particular", "General", "Specify", "Distinct"]};
let current = Object.keys(decks)[0];
const tabs = document.getElementById("tabs");
const list = document.getElementById("list");
const search = document.getElementById("search");
const count = document.getElementById("count");

function drawTabs(){
  tabs.innerHTML="";
  Object.keys(decks).forEach(name=>{
    const b=document.createElement("button");
    b.textContent=name+" ("+decks[name].length+")";
    if(name===current)b.className="active";
    b.onclick=()=>{current=name;drawTabs();drawList();};
    tabs.appendChild(b);
  });
}
function drawList(){
  const q=search.value.trim().toLowerCase();
  const arr=decks[current].filter(w=>w.toLowerCase().includes(q));
  list.innerHTML="";
  arr.forEach(w=>{
    const c=document.createElement("div"); c.className="card";
    const a=document.createElement("div"); a.className="word"; a.textContent=w;
    const n=document.createElement("div"); n.className="note";
    n.textContent="元チャットの解説全文：未取得（推測では補完しません）";
    c.append(a,n); list.appendChild(c);
  });
  const total=Object.values(decks).reduce((s,a)=>s+a.length,0);
  count.textContent="3冊・合計 "+total+"項目（Define除外）";
}
search.addEventListener("input",drawList);
drawTabs(); drawList();
</script>
</body></html>

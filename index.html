<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英単語帳</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8}header,main{padding:20px}header{background:white}main{max-width:950px;margin:auto}.tabs{display:flex;gap:8px;flex-wrap:wrap}button,input{padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:9px;background:white}.card{background:white;padding:16px;margin:10px 0;border-radius:12px;border:1px solid #ddd}.word{font-size:20px;font-weight:700}.meta{font-size:13px;color:#777}.pending{color:#8a6d3b;white-space:pre-wrap;margin-top:8px}</style></head><body><header><h1>英単語プロジェクト</h1><div id="stats"></div></header><main><div class="tabs" id="tabs"></div><input id="q" placeholder="検索"><div id="list"></div></main><script>let ds=[],cur="";Promise.all([fetch("data/decks.json").then(r=>r.json()),fetch("data/meta.json").then(r=>r.json())]).then(([d,m])=>{ds=d;cur=d[0].id;stats.textContent=`3冊・合計 ${m.total}項目（Define除外）`;tabs();render()});function tabs(){let x=document.getElementById("tabs");x.innerHTML="";ds.forEach(d=>{let b=document.createElement("button");b.textContent=`${d.title} (${d.entries.length})`;b.onclick=()=>{cur=d.id;tabs();render()};x.appendChild(b)})}q.oninput=render;function render(){let d=ds.find(x=>x.id===cur);if(!d)return;let s=q.value.toLowerCase();list.innerHTML=`<div class="card"><b>${d.title}</b><div class="meta">${d.source_chat}<br>${d.update_rule}</div></div>`;d.entries.filter(e=>e.word.toLowerCase().includes(s)).forEach(e=>{let x=document.createElement("div");x.className="card";let a=document.createElement("div");a.className="word";a.textContent=e.word;let c=document.createElement("div");c.className="pending";c.textContent=e.full_chat_content||"元チャット解説全文：未取得（推測では補完しません）";x.append(a,c);list.appendChild(x)})}</script></body></html>
